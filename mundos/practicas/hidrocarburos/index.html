<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Simulador Hidrocarburos CERS</title>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-v1.5.0.min.js"></script>
<style>
:root{--bg:#0f1720;--fg:#f2f5f7;--acc:#f5b400;--ok:#2fbf71;--bad:#e5484d;--panel:rgba(15,23,32,.92)}
html,body{margin:0;height:100%;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--fg)}
#hud{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:var(--panel);font-size:13px}
#hud .t{font-weight:700;color:var(--acc);margin-right:auto}
#hud .st{opacity:.9}
#hud button,#ov button{background:#24313d;color:var(--fg);border:1px solid #3a4b5a;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
#hud button:active{background:#33475a}
#pad{position:fixed;left:14px;bottom:18px;z-index:10;display:none;grid-template-columns:repeat(3,52px);gap:6px}
#pad button{width:52px;height:52px;border-radius:12px;border:1px solid #3a4b5a;background:rgba(36,49,61,.85);color:#fff;font-size:20px;touch-action:none}
#pad .e{visibility:hidden}
#ov{position:fixed;inset:0;z-index:20;background:rgba(10,15,20,.96);display:none;overflow:auto;padding:16px}
#ov .box{max-width:760px;margin:40px auto;line-height:1.5;font-size:14px}
#ov h2{color:var(--acc);margin-top:0}
#ov a{color:#8fc7ff}
#ov li{margin-bottom:6px}
#help{font-size:13px}
</style>
</head>
<body>
<div id="hud">
  <span class="t">Zona de Simulación · Hidrocarburos · CERS</span>
  <span class="st" id="hudState">Menú principal</span>
  <span class="st" id="hudScore"></span>
  <button id="bCampus">⬅ Campus</button>
  <button id="bMenu">Menú</button>
  <button id="bPanel">Traer panel</button>
  <button id="bRefs">Fuentes</button>
  <button id="bHelp">Ayuda</button>
</div>
<div id="pad">
  <button class="e"></button><button data-m="f">▲</button><button class="e"></button>
  <button data-m="l">◀</button><button data-m="b">▼</button><button data-m="r">▶</button>
</div>
<div id="ov"><div class="box" id="ovBox"></div></div>

<a-scene renderer="antialias:true; colorManagement:true" background="color:#bcd6ea" fog="type:linear;color:#bcd6ea;near:60;far:220"
         cursor="rayOrigin: mouse" raycaster="objects: .clickable, .clickable *">
  <a-entity light="type:ambient;intensity:0.75"></a-entity>
  <a-entity light="type:directional;intensity:0.8" position="-20 40 25"></a-entity>

  <a-entity id="rig" position="0 0 22">
    <a-entity id="cam" camera position="0 1.6 0" look-controls="pointerLockEnabled:false" wasd-controls="acceleration:28"></a-entity>
    <a-entity id="hl" laser-controls="hand: left" raycaster="objects: .clickable, .clickable *; far: 60" thumb-move></a-entity>
    <a-entity id="hr" laser-controls="hand: right" raycaster="objects: .clickable, .clickable *; far: 60" snap-turn></a-entity>
  </a-entity>

  <a-entity id="world"></a-entity>
  <a-entity id="panel" visible="false"></a-entity>
</a-scene>

<script>
/* =========================================================
   Simulador de Hidrocarburos · Campus de Simulación SST · CERS
   Contenido técnico tomado de: GRE 2024 (guías 115 y 128),
   CAMEO Chemicals (NOAA), NOM-ASEA y NOM-STPS citadas en "Fuentes".
   Nombres genéricos: sin marcas ni logos de terceros.
   ========================================================= */

// ---------- Utilidades ----------
const $ = s => document.querySelector(s);
const T = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/[¿¡]/g,'').replace(/ñ/g,'n').replace(/Ñ/g,'N').replace(/[–—]/g,'-').replace(/°/g,' grados');
function el(tag, attrs={}, parent){
  const e=document.createElement(tag);
  for(const k0 in attrs){ const k=k0.replace(/[A-Z]/g,m=>'-'+m.toLowerCase()); e.setAttribute(k, typeof attrs[k0]==='object'? AFRAME.utils.styleParser.stringify(attrs[k0]) : attrs[k0]); }
  (parent||$('#world')).appendChild(e); return e;
}
const P=(x,y,z)=>`${x} ${y} ${z}`;
function box(p,pos,w,h,d,color,extra={}){return el('a-box',Object.assign({position:pos,width:w,height:h,depth:d,color},extra),p);}
function cyl(p,pos,r,h,color,extra={}){return el('a-cylinder',Object.assign({position:pos,radius:r,height:h,color},extra),p);}
function sph(p,pos,r,color,extra={}){return el('a-sphere',Object.assign({position:pos,radius:r,color},extra),p);}
function txt(p,pos,value,extra={}){return el('a-text',Object.assign({position:pos,value:T(value),align:'center',color:'#111',width:4},extra),p);}
function sign(p,pos,label,bg='#ffffff',fg='#111',w=2.4,rotY=0){
  const g=el('a-entity',{position:pos,rotation:P(0,rotY,0)},p);
  cyl(g,P(0,0.9,0),0.05,1.8,'#666');
  el('a-plane',{position:P(0,2.05,0),width:w,height:0.6,color:bg},g);
  txt(g,P(0,2.05,0.01),label,{color:fg,width:w*1.6});
  return g;
}
function person(p,pos,shirt='#2b6cb0',rotY=0){
  const g=el('a-entity',{position:pos,rotation:P(0,rotY,0)},p);
  cyl(g,P(0,0.45,0),0.13,0.9,'#2d3748');
  cyl(g,P(0,1.15,0),0.2,0.6,shirt);
  sph(g,P(0,1.62,0),0.15,'#d6a77a');
  return g;
}
function clickableTree(e){ e.classList.add('clickable'); }

// ---------- Componentes VR (movimiento) ----------
AFRAME.registerComponent('thumb-move',{
  init(){ this.ax={x:0,y:0}; this.el.addEventListener('thumbstickmoved',e=>{this.ax=e.detail;}); this.el.addEventListener('axismove',e=>{const a=e.detail.axis; if(a&&a.length>=4){this.ax={x:a[2],y:a[3]};}}); },
  tick(t,dt){ if(!dt) return; const {x,y}=this.ax; if(Math.abs(x)<0.15&&Math.abs(y)<0.15) return; moveRig(-y, x, dt); }
});
AFRAME.registerComponent('snap-turn',{
  init(){ this.ready=true; this.el.addEventListener('thumbstickmoved',e=>{const x=e.detail.x;
    if(Math.abs(x)>0.7&&this.ready){ this.ready=false; const r=$('#rig').object3D; r.rotation.y += (x>0?-1:1)*Math.PI/6; }
    if(Math.abs(x)<0.3) this.ready=true; }); }
});
function moveRig(fwd, side, dt){
  const cam=$('#cam').object3D, rig=$('#rig').object3D, sp=0.0045*dt;
  const dir=new THREE.Vector3(); cam.getWorldDirection(dir); dir.y=0; dir.normalize(); dir.negate();
  const right=new THREE.Vector3(-dir.z,0,dir.x);
  rig.position.addScaledVector(dir, fwd*sp).addScaledVector(right, side*sp);
}

// ---------- Fuentes (verificadas) ----------
const REFS=[

 {k:'N005',t:'NOM-005-ASEA-2016, Diseño, construcción, operación y mantenimiento de Estaciones de Servicio para almacenamiento y expendio de diésel y gasolinas (DOF 07/11/2016). El PROY-NOM-023-ASEA-2025 propone cancelarla: verificar estatus en el DOF.',u:'https://sidof.segob.gob.mx/notas/docFuente/5459927'},
 {k:'CTR004',t:'ASEA-CTR-004-2019, Criterio sobre tanques de almacenamiento subterráneos en estaciones de servicio (monitoreo de integridad y fugas).',u:'https://www.gob.mx/cms/uploads/attachment/file/517655/VF_web_Criterio_Tanques_de_Almacenamiento_de_Gasolinas_17.dic.2019.pdf'},
 {k:'N020',t:'NOM-020-ASEA-2024, Transporte de gas natural por medio de ductos terrestres (DOF 01/09/2025); cancela la NOM-007-ASEA-2016.',u:'https://vlex.com.mx/vid/convocatoria-dirigida-unidades-inspeccion-1099183960'},
 {k:'N009',t:'NOM-009-ASEA-2017, Administración de la integridad de ductos de recolección, transporte y distribución de hidrocarburos, petrolíferos y petroquímicos (DOF 25/01/2019).',u:'https://platiica.economia.gob.mx/normalizacion/nom-009-asea-2017/'},
 {k:'N011',t:'NOM-011-ASEA-2019, Bodegas de guarda para distribución y bodegas de expendio de gas licuado de petróleo, mediante recipientes portátiles y transportables sujetos a presión (vigente).',u:'https://platiica.economia.gob.mx/normalizacion/nom-011-asea-2019/'},

 {k:'N002',t:'NOM-002-STPS-2010, Condiciones de seguridad - Prevención y protección contra incendios en los centros de trabajo.',u:'https://platiica.economia.gob.mx/normalizacion/nom-018-asea-2023/'},
 {k:'N022',t:'NOM-022-STPS-2015, Electricidad estática en los centros de trabajo - Condiciones de seguridad.',u:'https://platiica.economia.gob.mx/normalizacion/nom-018-asea-2023/'}
];

// Coordenadas locales respecto al centro de cada escenario.

  {at:[8,1.2,6],title:'Tanques subterráneos',text:'La NOM-005-ASEA-2016 regula diseño, construcción, operación y mantenimiento de estaciones de servicio. ASEA emitió un criterio para el monitoreo de integridad, fugas y sustitución de tanques subterráneos (ASEA-CTR-004-2019).',ref:'CTR004'},

  {id:'g_smoker',title:'Persona fumando en la zona de despacho',text:'Se deben eliminar todas las fuentes de ignición del área inmediata: no fumar, sin bengalas, chispas ni llamas.',ref:'G128'},
  {id:'g_truck',title:'Autotanque descargando sin conexión a tierra',text:'Todo el equipo utilizado al manejar el producto debe estar conectado a tierra. La electricidad estática en centros de trabajo se regula en la NOM-022-STPS-2015.',ref:'N022'}

 ]}
},
{

 ],

  {q:'Distancia de aislamiento inicial (medida precautoria inmediata):',o:['50 m','100 m en todas direcciones','10 m'],c:1,ring:100,exp:'Aislar el área por lo menos 100 m en todas direcciones. En fuga grande, considerar evacuación inicial de al menos 800 m en la dirección del viento.',ref:'G115'},
  {q:'Si el fuego involucra tanques o recipientes:',o:['Aislar 1600 m en todas direcciones y considerar evacuación inicial de 1600 m','Mantener 100 m','No hace falta aislar más'],c:0,exp:'Aislar 1600 m en todas direcciones y considerar evacuación inicial de 1600 m. Consultar la sección BLEVE - precauciones de seguridad.',ref:'G115'},

},

  {at:[-3,2.8,-4.8],title:'Identificación de la tubería',text:'El amarillo es el color de seguridad para identificar tuberías que conducen fluidos peligrosos, como los inflamables (NOM-026-STPS-2008).',ref:'N026'}

// ---------- Construcción del mundo ----------
const OBJ={};     // id -> entidad clicable
const INFO={};    // scenarioId -> [entidades info]
const ROOT={};    // scenarioId -> entidad raíz

function buildBase(){
  const w=$('#world');
  el('a-plane',{rotation:'-90 0 0',width:320,height:320,color:'#7fa667'},w);
  el('a-plane',{rotation:'-90 0 0',position:P(4,0.01,7),width:150,height:7,color:'#3d4247'},w);
  for(let x=-70;x<80;x+=6) el('a-plane',{rotation:'-90 0 0',position:P(x,0.02,7),width:2.4,height:0.18,color:'#f2c94c'},w);
  // Hub de bienvenida
  const hub=el('a-entity',{position:P(0,0,24)},w);
  el('a-circle',{rotation:'-90 0 0',position:P(0,0.02,0),radius:5,color:'#c9ced3'},hub);
  const b=el('a-entity',{position:P(0,0,-4)},hub);
  box(b,P(0,1.6,0),5.2,2.2,0.2,'#1d2a36');
  txt(b,P(0,2.2,0.12),'Zona de Simulacion de Hidrocarburos',{color:'#f5b400',width:6});
  txt(b,P(0,1.65,0.12),'Campus de Simulacion SST - CERS',{color:'#ffffff',width:4.5});
  txt(b,P(0,1.15,0.12),'Abre el MENU para elegir escenario y modo',{color:'#cfd8e0',width:4});
  const labels=[['Estacion de servicio',-50],['Galera gas LP',-18],['Ducto gas natural',14],['Ducto crudo',36],['Ducto gasolina',58]];
  labels.forEach(([l,x])=>sign(w,P(x,0,10.8),l,'#1d2a36','#ffffff',3.2));
}

function windsock(p,pos,id){
  const g=el('a-entity',{position:pos},p);
  cyl(g,P(0,2,0),0.05,4,'#888');
  const s=el('a-cone',{position:P(0.7,3.8,0),rotation:'0 0 -90',radiusBottom:0.25,radiusTop:0.1,height:1.4,color:'#ff7a1a',
    animation:'property:rotation;from:0 0 -95;to:0 0 -85;dir:alternate;loop:true;dur:900;easing:easeInOutSine'},g);
  if(id){ clickableTree(g); OBJ[id]=g; }
  return g;
}
function cloud(p,pos,color,rising){
  const g=el('a-entity',{position:pos},p);
  for(let i=0;i<5;i++){
    const s=sph(g,P((Math.random()-.5)*0.8,0.1+i*0.15,(Math.random()-.5)*0.8),0.35+Math.random()*0.25,color,{material:'transparent:true;opacity:0.45'});
    s.setAttribute('animation',rising?`property:position;to:${(Math.random()-.5)*1.5} ${3+i} ${(Math.random()-.5)*1.5};dur:${3000+i*500};loop:true;easing:linear`
      :`property:scale;from:1 1 1;to:2.4 0.6 2.4;dur:${2600+i*400};loop:true;dir:alternate;easing:easeInOutSine`);
  }
  return g;
}
function flame(p,pos,scale=1){
  const g=el('a-entity',{position:pos,scale:P(scale,scale,scale)},p);
  el('a-cone',{position:P(0,0.6,0),radiusBottom:0.35,radiusTop:0,height:1.3,color:'#ff6a00',material:'emissive:#ff4500;emissiveIntensity:0.9;transparent:true;opacity:0.9',
    animation:'property:scale;from:1 0.85 1;to:0.9 1.15 0.9;dur:180;loop:true;dir:alternate'},g);
  el('a-cone',{position:P(0,0.5,0),radiusBottom:0.2,radiusTop:0,height:0.9,color:'#ffd23f',material:'emissive:#ffb000;emissiveIntensity:1',
    animation:'property:scale;from:1 0.9 1;to:0.85 1.2 0.85;dur:140;loop:true;dir:alternate'},g);
  el('a-entity',{position:P(0,1,0),light:'type:point;color:#ff8a30;intensity:1.2;distance:10'},g);
  return g;
}
function pipe(p, z, x1, x2, y=0.9, r=0.35){
  const len=Math.abs(x2-x1), xc=(x1+x2)/2;
  const g=el('a-entity',{},p);
  el('a-cylinder',{position:P(xc,y,z),rotation:'0 0 90',radius:r,height:len,color:'#f2c230'},g);
  for(let x=Math.min(x1,x2)+1;x<Math.max(x1,x2);x+=4){ box(g,P(x,y/2-0.05,z),0.5,y-0.2,0.5,'#8a8f94'); }
  // brida y válvula
  el('a-cylinder',{position:P(xc-4,y,z),rotation:'0 0 90',radius:r+0.12,height:0.2,color:'#c9a227'},g);
  cyl(g,P(xc-4,y+0.7,z),0.06,0.8,'#555');
  el('a-torus',{position:P(xc-4,y+1.15,z),rotation:'90 0 0',radius:0.3,radiusTubular:0.04,color:'#c0392b'},g);
  // flechas de sentido de flujo
  for(let x=Math.min(x1,x2)+2;x<Math.max(x1,x2);x+=5){
    el('a-cone',{position:P(x,y+r+0.12,z),rotation:'0 0 -90',radiusBottom:0.12,radiusTop:0,height:0.3,color:'#111'},g);
  }
  // postes de señalamiento del ducto enterrado
  [x1-1.5, x2+1.5].forEach(x=>{ const s=el('a-entity',{position:P(x,0,z+1.2)},g); cyl(s,P(0,0.6,0),0.06,1.2,'#f2c230'); box(s,P(0,1.25,0),0.6,0.3,0.05,'#f2c230'); txt(s,P(0,1.25,0.03),'DUCTO',{width:1.2}); });
  return g;
}
function hazardGroup(p,id,pos){ const g=el('a-entity',{position:pos},p); clickableTree(g); OBJ[id]=g; return g; }

  [-3.2,-1,1.5,2.8].forEach(x=>{ el('a-cylinder',{position:P(x,0.45,1.15),rotation:'90 0 0',radius:0.45,height:0.3,color:'#222'},h3); el('a-cylinder',{position:P(x,0.45,-1.15),rotation:'90 0 0',radius:0.45,height:0.3,color:'#222'},h3); });
  box(h3,P(0.4,1.6,1.02),2,0.5,0.02,'#ff9800'); txt(h3,P(0.4,1.6,1.04),'INFLAMABLE 3',{width:2});
  const reel=el('a-entity',{position:P(-1,0,-2.4)},h3); box(reel,P(0,0.5,0),0.4,1,0.3,'#f2c230'); el('a-torus',{position:P(0,0.8,0.2),radius:0.15,radiusTubular:0.03,color:'#2e7d32'},reel);

  const d1=hazardGroup(R,'g_ext',P(5.4,0,-2.2)); cyl(d1,P(0,0.4,0),0.12,0.6,'#d32f2f'); box(d1,P(0,1.2,0.05),0.35,0.35,0.02,'#d32f2f'); txt(d1,P(0,1.2,0.07),'EXT',{color:'#fff',width:1.2});

function buildGalera(sc,R){

  // malla perimetral parcial
  for(let x=-5.6;x<=5.6;x+=0.8) cyl(R,P(x,0.9,-3.8),0.02,1.8,'#8a9096');
  box(R,P(0,1.8,-3.8),11.6,0.05,0.05,'#8a9096');
  // cilindros
  for(let i=0;i<6;i++) for(let j=0;j<3;j++){ const x=-4.5+i*0.6, z=-2.5+j*0.6;
    cyl(R,P(x,0.6,z),0.18,1.2,'#e7e7e7'); sph(R,P(x,1.22,z),0.12,'#bdbdbd'); }
  for(let i=0;i<4;i++) cyl(R,P(1+i*0.6,0.6,-2.5),0.18,1.2,'#e7e7e7');
  // Peligro 1: calefactor junto a cilindros
  const h1=hazardGroup(R,'l_heat',P(-1.2,0,-1.5)); box(h1,P(0,0.5,0),0.6,1,0.4,'#b03a2e');
  el('a-plane',{position:P(0,0.6,0.21),width:0.45,height:0.5,color:'#ff7b00',material:'emissive:#ff5a00;emissiveIntensity:0.9'},h1);
  // Peligro 2: fuga junto a registro
  const h2=hazardGroup(R,'l_leak',P(3,0,1.5)); cyl(h2,P(0,0.6,0),0.18,1.2,'#e7e7e7'); sph(h2,P(0,1.22,0),0.12,'#bdbdbd');
  box(h2,P(1,0.02,0),0.8,0.03,0.8,'#1a1a1a'); cloud(h2,P(0.5,0,0),'#f3f6f8',false);
  // Peligro 3: esmerilado con chispas
  const h3=hazardGroup(R,'l_sparks',P(4.6,0,-1)); person(h3,P(0,0,0),'#2b6cb0',-60);
  box(h3,P(-0.3,1.1,0.25),0.35,0.12,0.12,'#555');
  for(let i=0;i<6;i++) sph(h3,P(-0.45,1.05,0.3),0.025,'#ffd54f',{material:'emissive:#ffc107;emissiveIntensity:1',
    animation:`property:position;to:${-0.9-Math.random()*0.6} ${0.3+Math.random()*0.6} ${0.3+Math.random()*0.8};dur:${400+i*90};loop:true;easing:easeOutQuad`});
  // Distractores
  const d1=hazardGroup(R,'l_ext',P(-5.4,0,3.4)); cyl(d1,P(0,0.4,0),0.12,0.6,'#d32f2f'); box(d1,P(0,1.2,0),0.35,0.35,0.02,'#d32f2f'); txt(d1,P(0,1.2,0.02),'EXT',{color:'#fff',width:1.2});
  const d2=hazardGroup(R,'l_sign',P(2,0,5));
  cyl(d2,P(0,0.9,0),0.05,1.8,'#666'); el('a-circle',{position:P(0,2.1,0),radius:0.42,color:'#c62828'},d2); el('a-circle',{position:P(0,2.1,0.01),radius:0.34,color:'#ffffff'},d2);
  box(d2,P(0,2.1,0.02),0.18,0.04,0.01,'#333'); box(d2,P(0,2.1,0.03),0.7,0.07,0.01,'#c62828',{rotation:'0 0 -45'});
  txt(d2,P(0,1.55,0.02),'PROHIBIDO FUMAR',{width:2,color:'#c62828'});
}

function buildDucto(sc,R,kind){
  box(R,P(0,0.005,-8),20,0.01,28,'#8fb07a');
  pipe(R,-6,-9,9);
  const id={gn:'n',cr:'c',ga:'p'}[kind];
  windsock(R,P(-6,0,-4),`${id}_sock`);
  if(kind==='gn'){
    const pp=hazardGroup(R,'n_pipe',P(-3,0,-4.8)); box(pp,P(0,1.9,0),0.9,0.35,0.05,'#f2c230'); txt(pp,P(0,1.9,0.03),'GAS NATURAL',{width:1.6}); cyl(pp,P(0,1.25,0),0.03,0.9,'#666');
    cloud(R,P(2,1.2,-6),'#eef3f7',true);
    const h1=hazardGroup(R,'n_down',P(8,0,-4)); person(h1,P(0,0,0),'#2b6cb0',-90);
    const h2=hazardGroup(R,'n_fire',P(-6,0,-1.5)); for(let i=0;i<4;i++) el('a-cylinder',{position:P(0,0.1,0),rotation:`90 ${i*45} 0`,radius:0.06,height:0.9,color:'#5d4037'},h2); flame(h2,P(0,0,0),0.6);
    const h3=hazardGroup(R,'n_hut',P(5,0,-10)); box(h3,P(0,1.2,0),2.2,2.4,2,'#cfd8dc'); box(h3,P(-1.11,1.8,0),0.02,0.5,0.8,'#455a64'); box(h3,P(0,2.5,0),2.4,0.12,2.2,'#78909c');
  }
  if(kind==='cr'){
    el('a-plane',{rotation:'-90 0 0',position:P(8,0.015,-8),width:2.5,height:28,color:'#4f8fc0',material:'transparent:true;opacity:0.85'},R);
    const h1=hazardGroup(R,'c_stream',P(2,0.02,-4.5));
    el('a-circle',{rotation:'-90 0 0',radius:1.6,color:'#111111',material:'metalness:0.5;roughness:0.25'},h1);
    el('a-plane',{rotation:'-90 0 -90',position:P(3,0.005,0),width:0.9,height:3.6,color:'#111111'},h1);
    const h2=hazardGroup(R,'c_noscba',P(-0.6,0,-3)); person(h2,P(0,0,0),'#ef6c00',160);
    const h3=hazardGroup(R,'c_walk',P(2.4,0,-4.2)); person(h3,P(0,0,0),'#6d4c41',90);
    const d1=hazardGroup(R,'c_dike',P(-6,0,-2)); for(let i=0;i<5;i++) box(d1,P(i*0.55,0.2,0),0.5,0.4,0.35,'#a1887f'); txt(d1,P(1.1,0.8,0.2),'COSTALES DIQUE',{width:2});
  }
  if(kind==='ga'){
    box(R,P(-5,-0.1,-3),4,0.25,1.4,'#5b4636');   // zanja (zona baja)
    el('a-plane',{rotation:'-90 0 0',position:P(-5,0.03,-3),width:4,height:1.4,color:'#3e2f23'},R);
    const h1=hazardGroup(R,'p_sewer',P(2,0.02,-4.5));
    el('a-circle',{rotation:'-90 0 0',radius:1.2,color:'#5b4a2a',material:'transparent:true;opacity:0.85;metalness:0.6;roughness:0.2'},h1);
    el('a-plane',{rotation:'-90 0 -90',position:P(1.8,0.005,0),width:0.6,height:2.2,color:'#5b4a2a'},h1);
    el('a-circle',{rotation:'-90 0 0',position:P(3.2,0.01,0),radius:0.45,color:'#222'},h1);
    const h2=hazardGroup(R,'p_tool',P(0.3,0,-2.8)); person(h2,P(0,0,0),'#2b6cb0',60);
    box(h2,P(0.35,0.7,0.3),0.06,1.2,0.06,'#8d6e63',{rotation:'25 0 0'}); box(h2,P(0.35,0.12,0.55),0.3,0.03,0.35,'#9e9e9e');
    const h3=hazardGroup(R,'p_trench',P(-5,-0.6,-3)); person(h3,P(0,0,0),'#455a64',90);
    const d1=hazardGroup(R,'p_sand',P(-7.5,0,-1)); cyl(d1,P(0,0.45,0),0.3,0.9,'#c49a3a'); txt(d1,P(0,0.6,0.31),'ARENA',{width:1.4});
  }
  txt(R,P(-4,0.02,4),sc.name.toUpperCase(),{rotation:'-90 0 0',width:7,color:'#1d2a36'});
}

function buildInfo(sc,R){
  INFO[sc.id]=sc.info.map((inf,i)=>{
    const g=el('a-entity',{position:P(...inf.at),visible:false},R);
    sph(g,P(0,0,0),0.28,'#1e88e5',{material:'emissive:#1565c0;emissiveIntensity:0.5'});
    txt(g,P(0,0,0.3),'i',{color:'#fff',width:4});
    g.setAttribute('animation','property:position;to:'+P(inf.at[0],inf.at[1]+0.25,inf.at[2])+';dir:alternate;loop:true;dur:1200;easing:easeInOutSine');
    g.dataset.info=i; g.addEventListener('click',()=>{ if(STATE.mode==='recorrido'&&STATE.sc===sc) showInfo(sc,i); });
    return g;
  });
}

function buildWorld(){
  buildBase();
  SC.forEach(sc=>{
    const R=el('a-entity',{position:P(...sc.center)});
    ROOT[sc.id]=R;
    if(sc.id==='gasolinera') buildGasolinera(sc,R);
    if(sc.id==='galera') buildGalera(sc,R);
    if(sc.id==='ducto_gn') buildDucto(sc,R,'gn');
    if(sc.id==='ducto_crudo') buildDucto(sc,R,'cr');
    if(sc.id==='ducto_gasolina') buildDucto(sc,R,'ga');
    buildInfo(sc,R);
    [...sc.hazards,...sc.decoys].forEach(h=>{
      const o=OBJ[h.id]; if(!o) return;
      o.addEventListener('click',ev=>{ ev.stopPropagation(); onObjectClick(sc,h); });
    });
  });
}

// ---------- Panel 3D (funciona en PC, celular y visor) ----------
function placePanel(){
  const cam=$('#cam').object3D, pan=$('#panel').object3D;
  const cp=new THREE.Vector3(); cam.getWorldPosition(cp);
  const dir=new THREE.Vector3(); cam.getWorldDirection(dir); dir.y=0;
  if(dir.lengthSq()<1e-4) dir.set(0,0,1); dir.normalize();
  pan.position.copy(cp).addScaledVector(dir,-2.9); pan.position.y=cp.y-0.1;
  pan.lookAt(cp.x, pan.position.y, cp.z);
}
function showPanel({title,body='',options=[],tone='#1d2a36'}){
  const p=$('#panel'); while(p.firstChild) p.removeChild(p.firstChild);
  const W=2.9,H=2.6;
  el('a-plane',{width:W,height:H,color:tone,material:'transparent:true;opacity:0.96;shader:flat'},p);
  el('a-plane',{position:P(0,H/2-0.03,0.001),width:W,height:0.06,color:'#f5b400',material:'shader:flat'},p);
  el('a-text',{value:T(title),position:P(0,1.08,0.01),align:'center',color:'#f5b400',width:3.2,wrapCount:34},p);
  el('a-text',{value:T(body),position:P(0,0.88,0.01),align:'center',anchor:'center',baseline:'top',color:'#ffffff',width:2.7,wrapCount:50},p);
  const two=options.length>4, cols=two?2:1, bw=two?1.35:2.6, bh=0.26;
  options.forEach((o,i)=>{
    const col=two?(i%2):0, row=two?Math.floor(i/2):i;
    const x=two?(col===0?-0.7:0.7):0, y=-0.18-row*0.3;
    const b=el('a-entity',{position:P(x,y,0.02),class:'clickable'},p);
    el('a-plane',{width:bw,height:bh,color:o.color||'#2f4558',material:'shader:flat',class:'clickable'},b);
    el('a-text',{value:T(o.label),align:'center',color:'#ffffff',width:two?1.6:2.5,wrapCount:two?30:56,position:P(0,0,0.01)},b);
    b.addEventListener('mouseenter',()=>b.firstChild.setAttribute('color','#3f6a8a'));
    b.addEventListener('mouseleave',()=>b.firstChild.setAttribute('color',o.color||'#2f4558'));
    b.addEventListener('click',ev=>{ ev.stopPropagation(); setTimeout(o.onClick,10); });
  });
  placePanel(); p.setAttribute('visible',true);
  p.object3D.traverse(()=>{});
}
function hidePanel(){ const p=$('#panel'); p.setAttribute('visible',false); while(p.firstChild) p.removeChild(p.firstChild); }

// ---------- Estado y modos ----------
const STATE={sc:null,mode:null,found:new Set(),errors:0,qi:0,ok:0,fx:[],ring:null,arrow:null};
const RESULTS={};
function hud(){
  $('#hudState').textContent = STATE.sc? `${STATE.sc.name} · ${({recorrido:'Recorrido libre',peligros:'Identificar peligros',inspeccion:'Inspección',emergencia:'Respuesta a emergencia'})[STATE.mode]||'Elige modo'}` : 'Menú principal';
  let s='';
  if(STATE.mode==='peligros') s=`Peligros: ${STATE.found.size}/${STATE.sc.hazards.length} · Errores: ${STATE.errors}`;
  if(STATE.mode==='inspeccion'||STATE.mode==='emergencia') s=`Aciertos: ${STATE.ok}`;
  $('#hudScore').textContent=s;
}
function teleport(sc){
  const rig=$('#rig').object3D, cam=$('#cam');
  const [cx,cy,cz]=sc?sc.center:[0,0,0]; const v=sc?sc.view:[0,0,22];
  rig.position.set(cx+v[0],0,cz+v[2]); rig.rotation.set(0,0,0);
  cam.object3D.position.set(0,1.6,0);
  const lc=cam.components['look-controls']; if(lc){ lc.yawObject.rotation.y=0; lc.pitchObject.rotation.x=0; }
}
function clearFX(){
  STATE.fx.forEach(e=>e.parentNode&&e.parentNode.removeChild(e)); STATE.fx=[];
  if(STATE.ring){ STATE.ring.parentNode.removeChild(STATE.ring); STATE.ring=null; }
  if(STATE.arrow){ STATE.arrow.parentNode.removeChild(STATE.arrow); STATE.arrow=null; }
  document.querySelectorAll('.foundmark').forEach(e=>e.parentNode.removeChild(e));
  Object.values(INFO).flat().forEach(g=>g.setAttribute('visible',false));
}
function mainMenu(){
  clearFX(); STATE.sc=null; STATE.mode=null; hud();
  showPanel({title:'Zona de Simulacion de Hidrocarburos',body:'Elige un escenario. Todos los nombres son genericos. Contenido basado en la GRE 2024 y normas oficiales mexicanas (ver Fuentes).',
    options:[...SC.map(sc=>({label:sc.name,onClick:()=>openScenario(sc)})),
      {label:'Resultados',onClick:showResults,color:'#3b5a2f'},{label:'Fuentes',onClick:refsPanel,color:'#5a4a2f'}]});
}
function openScenario(sc){
  clearFX(); STATE.sc=sc; STATE.mode=null; teleport(sc); hud();
  setTimeout(()=>modeMenu(sc),60);
}
function modeMenu(sc){
  clearFX(); STATE.mode=null; hud();
  showPanel({title:sc.name,body:sc.material+'\n\nElige que quieres realizar:',options:[
    {label:'Recorrido libre (fichas informativas)',onClick:()=>startMode('recorrido')},
    {label:'Identificar peligros',onClick:()=>startMode('peligros')},
    {label:'Inspeccion con lista de verificacion',onClick:()=>startMode('inspeccion')},
    {label:'Respuesta a emergencia',onClick:()=>startMode('emergencia')},
    {label:'Volver al menu principal',onClick:()=>{teleport(null);mainMenu();},color:'#4a3b3b'}]});
}
function startMode(m){
  const sc=STATE.sc; clearFX(); STATE.mode=m; STATE.found=new Set(); STATE.errors=0; STATE.qi=0; STATE.ok=0; hud();
  if(m==='recorrido'){
    INFO[sc.id].forEach(g=>g.setAttribute('visible',true));
    showPanel({title:'Recorrido libre',body:'Toca o apunta a las esferas azules (i) para ver cada ficha. Muevete con WASD (PC), los botones de flechas (celular) o el joystick izquierdo (visor).',
      options:[{label:'Comenzar',onClick:hidePanel},{label:'Terminar recorrido',onClick:()=>modeMenu(sc),color:'#4a3b3b'}]});
  }
  if(m==='peligros'){
    showPanel({title:'Identificar peligros',body:`Encuentra los ${sc.hazards.length} peligros del escenario y tocalos. Cuidado: tambien hay elementos que NO son peligros; seleccionarlos cuenta como error.`,
      options:[{label:'Comenzar',onClick:hidePanel},{label:'Volver',onClick:()=>modeMenu(sc),color:'#4a3b3b'}]});
  }
  if(m==='inspeccion') nextInspect();
  if(m==='emergencia'){
    startFX(sc);
    showPanel({title:'Respuesta a emergencia',body:sc.emergency.intro,tone:'#3a1d1d',options:[{label:'Iniciar',onClick:nextEmergency}]});
  }
}
function showInfo(sc,i){
  const inf=sc.info[i], r=REFS.find(x=>x.k===inf.ref);
  showPanel({title:inf.title,body:inf.text+'\n\nFuente: '+r.t.split(',')[0].split(' - ')[0],options:[{label:'Cerrar',onClick:hidePanel},{label:'Terminar recorrido',onClick:()=>modeMenu(sc),color:'#4a3b3b'}]});
}
function markFound(obj,color){
  const m=el('a-ring',{class:'foundmark',rotation:'-90 0 0',position:P(0,2.4,0),radiusInner:0.35,radiusOuter:0.5,color,material:'shader:flat;side:double',
    animation:'property:rotation;to:-90 360 0;loop:true;dur:3000;easing:linear'},obj);
  return m;
}
function onObjectClick(sc,h){
  if(STATE.sc!==sc||STATE.mode!=='peligros') return;
  const isHaz=sc.hazards.includes(h), r=REFS.find(x=>x.k===h.ref);
  if(isHaz){
    if(!STATE.found.has(h.id)){ STATE.found.add(h.id); markFound(OBJ[h.id],'#2fbf71'); }
    hud();
    const done=STATE.found.size===sc.hazards.length;
    showPanel({title:'Peligro identificado: '+h.title,body:h.text+'\n\nFuente: '+shortRef(r),tone:'#1d3a2a',
      options: done?[{label:'Ver resultado',onClick:finishPeligros}]:[{label:'Seguir buscando',onClick:hidePanel},{label:'Terminar',onClick:finishPeligros,color:'#4a3b3b'}]});
  } else {
    STATE.errors++; hud();
    showPanel({title:'No es un peligro: '+h.title,body:h.text+'\n\nFuente: '+shortRef(r),tone:'#3a321d',options:[{label:'Seguir buscando',onClick:hidePanel}]});
  }
}
function finishPeligros(){
  const sc=STATE.sc, n=sc.hazards.length, f=STATE.found.size;
  const missing=sc.hazards.filter(h=>!STATE.found.has(h.id)).map(h=>'- '+h.title).join('\n');
  saveResult(sc,'Identificar peligros',`${f}/${n} peligros, ${STATE.errors} errores`);
  showPanel({title:'Resultado: identificar peligros',body:`Peligros encontrados: ${f} de ${n}\nSelecciones erroneas: ${STATE.errors}`+(missing?'\n\nNo identificados:\n'+missing:''),
    options:[{label:'Repetir',onClick:()=>startMode('peligros')},{label:'Otro modo',onClick:()=>modeMenu(sc)},{label:'Menu principal',onClick:()=>{teleport(null);mainMenu();},color:'#4a3b3b'}]});
}
function pointAt(id){
  if(STATE.arrow){ STATE.arrow.parentNode.removeChild(STATE.arrow); STATE.arrow=null; }
  const o=OBJ[id]; if(!o) return;
  STATE.arrow=el('a-cone',{position:P(0,3,0),rotation:'180 0 0',radiusBottom:0.25,radiusTop:0,height:0.6,color:'#f5b400',material:'shader:flat',
    animation:'property:position;to:0 2.6 0;dir:alternate;loop:true;dur:600'},o);
}
function nextInspect(){
  const sc=STATE.sc, list=sc.inspect;
  if(STATE.qi>=list.length){
    saveResult(sc,'Inspeccion',`${STATE.ok}/${list.length} correctas`);
    if(STATE.arrow){ STATE.arrow.parentNode.removeChild(STATE.arrow); STATE.arrow=null; }
    return showPanel({title:'Resultado: inspeccion',body:`Respuestas correctas: ${STATE.ok} de ${list.length}`,
      options:[{label:'Repetir',onClick:()=>startMode('inspeccion')},{label:'Otro modo',onClick:()=>modeMenu(sc)},{label:'Menu principal',onClick:()=>{teleport(null);mainMenu();},color:'#4a3b3b'}]});
  }
  const it=list[STATE.qi]; pointAt(it.target);
  const answer=v=>{ const good=(v===it.a); if(good) STATE.ok++; hud(); STATE.qi++;
    const r=REFS.find(x=>x.k===it.ref);
    showPanel({title:good?'Correcto':'Incorrecto',body:it.exp+'\n\nFuente: '+shortRef(r),tone:good?'#1d3a2a':'#3a1d1d',options:[{label:'Siguiente',onClick:nextInspect}]}); };
  showPanel({title:`Inspeccion ${STATE.qi+1}/${list.length}`,body:it.q+'\n\n(Observa el elemento senalado con la flecha amarilla.)',
    options:[{label:'Si cumple',onClick:()=>answer(true),color:'#2e5a3e'},{label:'No cumple',onClick:()=>answer(false),color:'#5a2e2e'},{label:'Ocultar panel para observar',onClick:()=>{hidePanel();}}]});
}
function startFX(sc){
  const R=ROOT[sc.id], [x,y,z]=sc.leak, fx=sc.emergency.fx;
  if(fx==='spill'||fx==='crude'){
    const c=el('a-circle',{rotation:'-90 0 0',position:P(x,0.04,z),radius:0.5,color:fx==='crude'?'#0d0d0d':'#5b4a2a',material:'transparent:true;opacity:0.9;metalness:0.5;roughness:0.2',
      animation:'property:radius;to:3.2;dur:8000;easing:easeOutQuad'},R); STATE.fx.push(c);
  }
  if(fx==='lpfire'){ STATE.fx.push(flame(R,P(x,1.25,z),0.7)); }
  if(fx==='gnfire'){ STATE.fx.push(flame(R,P(x,y+0.3,z),1.6)); }
}
function showRing(sc,r){
  const R=ROOT[sc.id], [x,,z]=sc.leak;
  if(STATE.ring) STATE.ring.parentNode.removeChild(STATE.ring);
  const g=el('a-entity',{position:P(x,0.06,z)},R);
  el('a-ring',{rotation:'-90 0 0',radiusInner:r-0.6,radiusOuter:r,color:'#e5484d',material:'shader:flat;side:double',segmentsTheta:96},g);
  for(let a=0;a<360;a+=45){ const rad=a*Math.PI/180; const s=el('a-entity',{position:P(Math.cos(rad)*r,0,Math.sin(rad)*r),rotation:P(0,-a+90,0)},g);
    cyl(s,P(0,0.6,0),0.05,1.2,'#e5484d'); box(s,P(0,1.3,0),1.6,0.35,0.04,'#ffffff'); txt(s,P(0,1.3,0.03),`AISLAMIENTO ${r} m`,{color:'#c62828',width:2.4}); }
  STATE.ring=g;
}
function nextEmergency(){
  const sc=STATE.sc, st=sc.emergency.steps;
  if(STATE.qi>=st.length){
    saveResult(sc,'Respuesta a emergencia',`${STATE.ok}/${st.length} decisiones correctas`);
    return showPanel({title:'Resultado: respuesta a emergencia',body:`Decisiones correctas: ${STATE.ok} de ${st.length}\n\nRecuerda: la GRE orienta la fase inicial de incidentes de transporte. En una instalacion rige su Plan de Respuesta a Emergencias.`,
      options:[{label:'Repetir',onClick:()=>startMode('emergencia')},{label:'Otro modo',onClick:()=>modeMenu(sc)},{label:'Menu principal',onClick:()=>{teleport(null);mainMenu();},color:'#4a3b3b'}]});
  }
  const s=st[STATE.qi];
  // barajar opciones conservando la correcta
  const idx=s.o.map((_,i)=>i).sort(()=>Math.random()-0.5);
  showPanel({title:`Decision ${STATE.qi+1}/${st.length}`,body:s.q,tone:'#3a1d1d',options:idx.map(i=>({label:s.o[i],onClick:()=>{
    const good=i===s.c; if(good) STATE.ok++; hud(); STATE.qi++;
    if(s.ring) showRing(sc,s.ring);
    const r=REFS.find(x=>x.k===s.ref);
    showPanel({title:good?'Correcto':'Incorrecto',body:(good?'':'Respuesta correcta: '+s.o[s.c]+'\n\n')+s.exp+'\n\nFuente: '+shortRef(r),tone:good?'#1d3a2a':'#3a1d1d',options:[{label:'Siguiente',onClick:nextEmergency}]});
  }}))});
}
function shortRef(r){ return r? r.t.split(' - ')[0].split(',')[0] : ''; }
function saveResult(sc,m,v){ RESULTS[sc.name]=RESULTS[sc.name]||{}; RESULTS[sc.name][m]=v; }
function showResults(){
  const lines=Object.keys(RESULTS).map(k=>k+':\n'+Object.entries(RESULTS[k]).map(([m,v])=>'  '+m+': '+v).join('\n')).join('\n');
  showPanel({title:'Resultados de la sesion',body:lines||'Aun no hay resultados en esta sesion.',options:[{label:'Volver',onClick:mainMenu}]});
}
function refsPanel(){
  showPanel({title:'Fuentes',body:REFS.slice(0,6).map(r=>'- '+shortRef(r)).join('\n')+'\n'+REFS.slice(6).map(r=>'- '+shortRef(r)).join('\n')+'\n\nEnlaces completos: boton Fuentes de la barra superior.',
    options:[{label:'Volver',onClick:mainMenu}]});
}

$('#bMenu').onclick=()=>{ if(STATE.sc) modeMenu(STATE.sc); else mainMenu(); };
$('#bPanel').onclick=()=>{ const p=$('#panel'); if(p.children.length){ placePanel(); p.setAttribute('visible',true);} else (STATE.sc?modeMenu(STATE.sc):mainMenu()); };
$('#bRefs').onclick=()=>overlay('<h2>Fuentes y bibliografía</h2><ol>'+REFS.map(r=>`<li>${r.t} <a href="${r.u}" target="_blank" rel="noopener">Ver fuente</a></li>`).join('')+'</ol><p><b>Aviso:</b> simulador de capacitación. La GRE está diseñada para la fase inicial de incidentes de transporte, no para derrames en instalaciones; en una instalación rige su Plan de Respuesta a Emergencias y la normativa aplicable vigente. Verifica en el DOF el estatus de las normas antes de usarlas como requisito.</p>');
$('#bHelp').onclick=()=>overlay(`<h2>Cómo usar</h2><div id="help"><ul>
<li><b>PC:</b> arrastra con el mouse para mirar, WASD o flechas para caminar, clic para seleccionar.</li>
<li><b>Celular/tablet:</b> arrastra para mirar, botones de flechas para caminar, toca para seleccionar.</li>
<li><b>Visor (Meta Quest):</b> botón VR de la esquina inferior derecha; joystick izquierdo para caminar, derecho para girar, gatillo para seleccionar con el láser.</li>
<li><b>Traer panel</b> coloca el panel frente a ti si lo perdiste de vista.</li>
<li>Cada escenario tiene 4 modos: recorrido libre, identificar peligros, inspección y respuesta a emergencia.</li></ul></div>`);

// Pad táctil
const PAD={f:0,b:0,l:0,r:0};
if('ontouchstart' in window || navigator.maxTouchPoints>0){ $('#pad').style.display='grid'; }
document.querySelectorAll('#pad button[data-m]').forEach(b=>{
  const m=b.dataset.m; const on=e=>{e.preventDefault();PAD[m]=1;}, off=e=>{e.preventDefault();PAD[m]=0;};
  b.addEventListener('touchstart',on,{passive:false}); b.addEventListener('touchend',off,{passive:false}); b.addEventListener('touchcancel',off,{passive:false});
  b.addEventListener('mousedown',on); b.addEventListener('mouseup',off); b.addEventListener('mouseleave',off);
});
AFRAME.registerComponent('pad-move',{tick(t,dt){ if(!dt) return; const f=PAD.f-PAD.b, s=PAD.r-PAD.l; if(f||s) moveRig(f,s,dt); }});

// ---------- Inicio ----------
const scene=document.querySelector('a-scene');
function boot(){ buildWorld(); scene.setAttribute('pad-move','');
  const pedido=new URLSearchParams(location.search).get('e'), sc=SC.find(x=>x.id===pedido);
  if(sc){ setTimeout(()=>openScenario(sc),200); } else { teleport(null); setTimeout(mainMenu,200); } }
// Acceso con código (mismo sistema que el resto del campus)
(function(){ const s=document.createElement('script'); s.src='../../../motor/acceso.js';
  s.onload=()=>{ if(window.Acceso){ Acceso.sesionUnica&&Acceso.sesionUnica(); Acceso.proteger('🛢️ Prácticas: hidrocarburos','../../../index.html?zona=practicas'); } };
  document.head.appendChild(s); })();
if(scene.hasLoaded) boot(); else scene.addEventListener('loaded',boot);
</script>
