<style>
:root{--bg:#0f1720;--fg:#f2f5f7;--acc:#f5b400;--ok:#2fbf71;--bad:#e5484d;--panel:rgba(15,23,32,.92)}
html,body{margin:0;height:100%;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--fg)}
#hud{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:var(--panel);font-size:13px}
#hud .t{font-weight:700;color:var(--acc);margin-right:auto}
#hud .st{opacity:.9}
#hud button,#ov button{background:#24313d;color:var(--fg);border:1px solid #3a4b5a;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
#hud button:active{background:#33475a}
#pad{position:fixed;left:14px;bottom:18px;z-index:10;display:none;grid-template-columns:repeat(3,52px);gap:6px}
#pad button{width:52px;height:52px;border-radius:12px;border:1px solid #3a4b5a;background:rgba(36,49,61,.85);color:#fff;font-size:20px;touch-action:none}
#pad .e{visibility:hidden}
#ov{position:fixed;inset:0;z-index:20;background:rgba(10,15,20,.96);display:none;overflow:auto;padding:16px}
#ov .box{max-width:760px;margin:40px auto;line-height:1.5;font-size:14px}
#ov h2{color:var(--acc);margin-top:0}
#ov a{color:#8fc7ff}
#ov li{margin-bottom:6px}
#help{font-size:13px}

<body>
<div id="hud">

  <button id="bRegresar" title="Regresar a la caseta de Prácticas">⬅ Regresar</button>

  <button id="bSalir" title="Salir a la pantalla de inicio" style="background:#8e2a2a">🚪 Salir</button>
  <button id="bMenu">Menú</button>

  <button id="bRefs">Fuentes</button>
  <button id="bHelp">Ayuda</button>
</div>
<div id="pad">
  <button class="e"></button><button data-m="f">▲</button><button class="e"></button>

</div>
<div id="ov"><div class="box" id="ovBox"></div></div>

<!-- (21/10/2026) vr-mode-ui apagado por omisión: en el celular el botón VR de A-Frame parte la pantalla en dos (modo
     Cardboard) y se ve "como un túnel". Más abajo se enciende solo cuando hay un visor de verdad (Meta Quest, Pico…). -->
<a-scene vr-mode-ui="enabled: false" renderer="antialias:true; colorManagement:true; toneMapping:ACESFilmic; exposure:1.05" shadow="type:pcfsoft" background="color:#bcd6ea" fog="type:linear;color:#cfe0ec;near:70;far:260"
         cursor="rayOrigin: mouse" raycaster="objects: .clickable, .clickable *">
  <a-entity id="hemi" light="type:hemisphere;color:#eaf4ff;groundColor:#7a8a5a;intensity:1.1"></a-entity>
  <a-entity id="sunTarget" position="0 0 0"></a-entity>
  <a-entity id="sun" light="type:directional;intensity:2.2;color:#fff4e0;castShadow:true;shadowMapWidth:2048;shadowMapHeight:2048;shadowCameraLeft:-24;shadowCameraRight:24;shadowCameraTop:24;shadowCameraBottom:-24;shadowCameraNear:1;shadowCameraFar:140;shadowBias:-0.0004;target:#sunTarget" position="-18 36 22"></a-entity>

  <a-entity id="rig" position="0 0 22">
    <a-entity id="cam" camera position="0 1.6 0" look-controls="pointerLockEnabled:false"></a-entity>
    <a-entity id="hl" laser-controls="hand: left" raycaster="objects: .clickable, .clickable *; far: 60" thumb-move></a-entity>
    <a-entity id="hr" laser-controls="hand: right" raycaster="objects: .clickable, .clickable *; far: 60" snap-turn></a-entity>
  </a-entity>

  <a-entity id="world"></a-entity>
  <a-entity id="panel" visible="false" encima></a-entity>
</a-scene>

<script>
// (21/10/2026) El botón 🥽 VR solo aparece en un visor de verdad (Meta Quest, Pico, Wolvic…) o con ?xr=1 a la fuerza.
// En el celular, el navegador dice que "soporta VR" (Cardboard) y la pantalla se parte en dos ojos: se ve como un túnel.
// Sin visor, en su lugar va un botón de PANTALLA COMPLETA, que es lo que sí sirve en el celular.
(function () {
  const ua = navigator.userAgent || '';
  const visor = /OculusBrowser|Quest|Pico|Wolvic|Vive|SamsungBrowser\/.*VR/i.test(ua) || /[?&]xr=1/.test(location.search);
  const sc = document.querySelector('a-scene');
  const listo = fn => sc.hasLoaded ? fn() : sc.addEventListener('loaded', fn);
  if (visor) { listo(() => sc.setAttribute('vr-mode-ui', 'enabled: true')); return; }
  document.head.insertAdjacentHTML('beforeend', '<style>.a-enter-vr,.a-enter-ar{display:none!important}</style>');
  const b = document.createElement('button');
  b.id = 'bPantalla'; b.textContent = '⛶ Pantalla completa'; b.title = 'Ver en pantalla completa';
  b.onclick = () => { const d = document.documentElement;
    if (document.fullscreenElement) { document.exitFullscreen && document.exitFullscreen(); return; }
    const p = d.requestFullscreen ? d.requestFullscreen() : (d.webkitRequestFullscreen && d.webkitRequestFullscreen());
    p && p.catch && p.catch(() => { }); };
  document.addEventListener('fullscreenchange', () => { b.textContent = document.fullscreenElement ? '⛶ Salir de pantalla completa' : '⛶ Pantalla completa'; });
  const hud = document.getElementById('hud'); if (hud) hud.appendChild(b);
})();
</script>

<script>
/* =========================================================
   Simulador de Hidrocarburos · Campus de Simulación SST · CERS
   Contenido técnico tomado de: GRE 2024 (guías 115 y 128),
   CAMEO Chemicals (NOAA), NOM-ASEA y NOM-STPS citadas en "Fuentes".
   Nombres genéricos: sin marcas ni logos de terceros.
   ========================================================= */

// ---------- Utilidades ----------
const $ = s => document.querySelector(s);
const T = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/[¿¡]/g,'').replace(/ñ/g,'n').replace(/Ñ/g,'N').replace(/[–—]/g,'-').replace(/°/g,' grados');
function el(tag, attrs={}, parent){
  const e=document.createElement(tag);
  for(const k0 in attrs){ const k=k0.replace(/[A-Z]/g,m=>'-'+m.toLowerCase()); e.setAttribute(k, typeof attrs[k0]==='object'? AFRAME.utils.styleParser.stringify(attrs[k0]) : attrs[k0]); }
  (parent||$('#world')).appendChild(e); return e;
}
const P=(x,y,z)=>`${x} ${y} ${z}`;
function box(p,pos,w,h,d,color,extra={}){return el('a-box',Object.assign({position:pos,width:w,height:h,depth:d,color},extra),p);}
function cyl(p,pos,r,h,color,extra={}){return el('a-cylinder',Object.assign({position:pos,radius:r,height:h,color},extra),p);}
function sph(p,pos,r,color,extra={}){return el('a-sphere',Object.assign({position:pos,radius:r,color},extra),p);}
function txt(p,pos,value,extra={}){return el('a-text',Object.assign({position:pos,value:T(value),align:'center',color:'#111',width:4},extra),p);}
// Material PBR en texto para A-Frame: color, rugosidad, metalicidad y extras.
const M=(c,r=0.8,m=0,x='')=>`color:${c};roughness:${r};metalness:${m}${x?';'+x:''}`;
const VIDRIO=M('#6d97b3',0.08,0.7,'opacity:0.82;transparent:true');
function bx(p,pos,w,h,d,c,r=0.8,m=0,extra={}){return el('a-box',Object.assign({position:pos,width:w,height:h,depth:d,material:M(c,r,m)},extra),p);}
function cy(p,pos,r,h,c,ro=0.8,me=0,extra={}){return el('a-cylinder',Object.assign({position:pos,radius:r,height:h,material:M(c,ro,me)},extra),p);}
function sign(p,pos,label,bg='#ffffff',fg='#111',w=2.4,rotY=0){
  const g=el('a-entity',{position:pos,rotation:P(0,rotY,0)},p);
  [-w/2+0.15,w/2-0.15].forEach(x=>cy(g,P(x,1.0,-0.04),0.045,2.0,'#7b858d',0.4,0.7));
  bx(g,P(0,2.05,-0.03),w+0.08,0.68,0.05,'#5d666e',0.5,0.6);
  el('a-plane',{position:P(0,2.05,0),width:w,height:0.6,material:M(bg,0.6)},g);
  txt(g,P(0,2.05,0.01),label,{color:fg,width:w*1.6});
  return g;
}
// Persona con piernas, brazos articulados, casco y chaleco opcionales. Frente = +z.
// o: {casco:'#f2c230', chaleco:'#c6f13a', pant, piel, pose:'normal'|'fumar'|'frente'|'pala'}
function person(p,pos,shirt='#2b6cb0',rotY=0,o={}){
  const g=el('a-entity',{position:pos,rotation:P(0,rotY,0)},p);
  const piel=o.piel||'#c99a6e', pant=o.pant||'#2d3a4f';
  [-0.095,0.095].forEach(x=>{ cy(g,P(x,0.45,0),0.075,0.82,pant,0.9); bx(g,P(x,0.05,0.04),0.13,0.1,0.27,'#1e1e1e',0.6); });
  bx(g,P(0,0.88,0),0.34,0.14,0.21,pant,0.9);
  el('a-entity',{position:P(0,1.18,0),geometry:'primitive:cone;radiusTop:0.2;radiusBottom:0.165;height:0.56;segmentsRadial:16',material:M(shirt,0.85)},g);
  if(o.chaleco){
    el('a-entity',{position:P(0,1.16,0),geometry:'primitive:cone;radiusTop:0.208;radiusBottom:0.175;height:0.46;segmentsRadial:16',material:M(o.chaleco,0.6)},g);
    [1.05,1.25].forEach(y=>el('a-entity',{position:P(0,y,0),geometry:'primitive:cone;radiusTop:0.212;radiusBottom:0.205;height:0.035;segmentsRadial:16',material:M('#e6e9ec',0.25,0.6)},g));
  }
  cy(g,P(0,1.5,0),0.06,0.1,piel,0.7);
  sph(g,P(0,1.65,0),0.13,piel,{material:M(piel,0.7)});
  [-0.045,0.045].forEach(x=>sph(g,P(x,1.68,0.118),0.016,'#1b1b1b'));
  if(o.casco){
    el('a-entity',{position:P(0,1.7,0),geometry:'primitive:sphere;radius:0.15;thetaLength:90;segmentsWidth:18;segmentsHeight:8',material:M(o.casco,0.35,0.05)},g);
    el('a-entity',{position:P(0,1.705,0.03),geometry:'primitive:cylinder;radius:0.185;height:0.018;segmentsRadial:18',material:M(o.casco,0.35,0.05)},g);
  } else {
    el('a-entity',{position:P(0,1.68,-0.01),geometry:'primitive:sphere;radius:0.137;thetaLength:80;segmentsWidth:16;segmentsHeight:8',material:M('#2a1d14',0.9)},g);
  }
  // brazos: [hombro x, codo x, giro z] en grados
  const poses={normal:[[8,-8,6],[8,-8,-6]], fumar:[[-55,-118,10],[6,-6,-6]], frente:[[-72,-18,4],[-72,-18,-4]], pala:[[-35,-45,8],[-50,-30,-8]]};
  const pz=poses[o.pose||'normal'];
  [-1,1].forEach((s,i)=>{ const [hx,cx,zz]=pz[i];
    const h=el('a-entity',{position:P(s*0.235,1.4,0),rotation:P(hx,0,zz*-s)},g);
    cy(h,P(0,-0.15,0),0.058,0.3,shirt,0.85);
    const c=el('a-entity',{position:P(0,-0.3,0),rotation:P(cx,0,0)},h);
    cy(c,P(0,-0.14,0),0.05,0.28,shirt,0.85); sph(c,P(0,-0.3,0),0.055,piel,{material:M(piel,0.7)});
    if(i===0) g.mano=c;   // mano derecha para objetos (cigarro, herramienta)
  });
  return g;
}
// Árbol simple de bajo costo (tronco + copa en dos niveles)
function arbol(p,pos,s=1,tono='#4f7d3a'){
  const g=el('a-entity',{position:pos,scale:P(s,s,s)},p);
  cy(g,P(0,1.1,0),0.16,2.2,'#6b4a2f',0.95);
  el('a-entity',{position:P(0,2.9,0),geometry:'primitive:sphere;radius:1.35;segmentsWidth:9;segmentsHeight:6',material:M(tono,0.95,0,'flatShading:true')},g);
  el('a-entity',{position:P(0.35,3.8,0.2),geometry:'primitive:sphere;radius:0.95;segmentsWidth:8;segmentsHeight:5',material:M('#5e9046',0.95,0,'flatShading:true')},g);
  return g;
}
function extintor(p,pos,rotY=0){
  const g=el('a-entity',{position:pos,rotation:P(0,rotY,0)},p);
  cy(g,P(0,0.36,0),0.11,0.6,'#c62828',0.35,0.2);
  sph(g,P(0,0.66,0),0.11,'#c62828',{scale:'1 0.5 1',material:M('#c62828',0.35,0.2)});
  cy(g,P(0,0.75,0),0.03,0.08,'#2b2b2b',0.5,0.6); bx(g,P(0.05,0.8,0),0.14,0.025,0.04,'#2b2b2b',0.5,0.6);
  el('a-torus',{position:P(0.1,0.55,0),rotation:'0 90 0',radius:0.13,radiusTubular:0.012,arc:200,material:M('#1a1a1a',0.6)},g);
  cy(g,P(0.32,0.9,-0.08),0.035,1.8,'#7b858d',0.4,0.7);
  bx(g,P(0.32,1.6,-0.04),0.34,0.34,0.02,'#c62828',0.6); txt(g,P(0.32,1.6,-0.025),'EXTINTOR',{color:'#fff',width:0.9});
  return g;
}
// Textura procedural en <canvas> (malla ciclónica, lámina acanalada) usable como src de material
function canvasTex(id,draw,w=128,h=128){ if(document.getElementById(id)) return '#'+id;
  const c=document.createElement('canvas'); c.id=id; c.width=w; c.height=h; c.style.display='none'; draw(c.getContext('2d'),w,h); document.body.appendChild(c); return '#'+id; }
const MALLA=()=>canvasTex('texMalla',(g,w,h)=>{ g.clearRect(0,0,w,h); g.strokeStyle='#c3c9ce'; g.lineWidth=5;
  for(let i=-w;i<=w*2;i+=32){ g.beginPath(); g.moveTo(i,0); g.lineTo(i+h,h); g.stroke(); g.beginPath(); g.moveTo(i,h); g.lineTo(i+h,0); g.stroke(); } });
const LAMINA=()=>canvasTex('texLamina',(g,w,h)=>{ for(let x=0;x<w;x++){ const v=170+Math.round(45*Math.sin(x/w*Math.PI*8)); g.fillStyle=`rgb(${v},${v+6},${v+12})`; g.fillRect(x,0,1,h); } });
function malla(p,pos,w,h=1.8,rotY=0){
  const g=el('a-entity',{position:pos,rotation:P(0,rotY,0)},p);
  el('a-plane',{position:P(0,h/2,0),width:w,height:h,material:`src:${MALLA()};repeat:${Math.round(w*3)} ${Math.round(h*3)};transparent:true;alphaTest:0.4;side:double;roughness:0.5;metalness:0.6`},g);
  for(let x=-w/2;x<=w/2+0.01;x+=2.5) cy(g,P(x,h/2+0.05,0),0.035,h+0.1,'#9aa2a8',0.4,0.7);
  cy(g,P(0,h,0),0.022,w,'#9aa2a8',0.4,0.7,{rotation:'0 0 90'});
  return g;
}
function clickableTree(e){ e.classList.add('clickable'); }

// ---------- Componentes VR (movimiento) ----------
AFRAME.registerComponent('thumb-move',{
  init(){ this.ax={x:0,y:0}; this.el.addEventListener('thumbstickmoved',e=>{this.ax=e.detail;}); this.el.addEventListener('axismove',e=>{const a=e.detail.axis; if(a&&a.length>=4){this.ax={x:a[2],y:a[3]};}}); },
  tick(t,dt){ if(!dt) return; const {x,y}=this.ax; if(Math.abs(x)<0.15&&Math.abs(y)<0.15) return; moveRig(-y, x, dt); }
});
AFRAME.registerComponent('snap-turn',{
  init(){ this.ready=true; this.el.addEventListener('thumbstickmoved',e=>{const x=e.detail.x;
    if(Math.abs(x)>0.7&&this.ready){ this.ready=false; const r=$('#rig').object3D; r.rotation.y += (x>0?-1:1)*Math.PI/6; }
    if(Math.abs(x)<0.3) this.ready=true; }); }
});
let ULT_MOV=0; setInterval(()=>{ if(window.Sonido) Sonido.andar(performance.now()-ULT_MOV<150); },100);   // pasos al caminar
function moveRig(fwd, side, dt){
  ULT_MOV=performance.now();
  const cam=$('#cam').object3D, rig=$('#rig').object3D, sp=0.0045*dt;
  const dir=new THREE.Vector3(); cam.getWorldDirection(dir); dir.y=0; dir.normalize(); dir.negate();
  const right=new THREE.Vector3(-dir.z,0,dir.x);
  const d=new THREE.Vector3().addScaledVector(dir, fwd*sp).addScaledVector(right, side*sp);
  if(!NAV){ rig.position.add(d); return; }
  const p=rig.position;   // se desliza a lo largo de los obstáculos: no los atraviesa
  if(NAV.libre(p.x+d.x,p.z+d.z)) p.add(d); else if(NAV.libre(p.x+d.x,p.z)) p.x+=d.x; else if(NAV.libre(p.x,p.z+d.z)) p.z+=d.z;
  if(d.lengthSq()>0) RUTA.length=0;
}

// ---------- Fuentes (verificadas) ----------
const REFS=[
 {k:'G128',t:'GRE 2024 (Guía de Respuesta en Caso de Emergencia), Guía 128 - Líquidos inflamables (no miscibles con agua). PHMSA/Transport Canada/SICT/CIQUIME.',u:'https://cameochemicals.noaa.gov/erg_guides/es/Guide_128.pdf'},
 {k:'G115',t:'GRE 2024, Guía 115 - Gases inflamables (incluye líquidos refrigerados).',u:'https://cameochemicals.noaa.gov/erg_guides/es/Guide_115.pdf'},
 {k:'UN1203',t:'CAMEO Chemicals (NOAA) - UN1203 Gasolina, clase 3, Guía 128. Nota: la GRE está diseñada para la fase inicial de incidentes de transporte, no para derrames en instalaciones.',u:'https://cameochemicals.noaa.gov/unna/1203'},
 {k:'N005',t:'NOM-005-ASEA-2016, Diseño, construcción, operación y mantenimiento de Estaciones de Servicio para almacenamiento y expendio de diésel y gasolinas (DOF 07/11/2016). Vigente según PLATIICA (consulta 11/10/2026). El PROY-NOM-023-ASEA-2025 (aviso de consulta pública, DOF 24/12/2025) propone cancelarla; a la fecha de consulta no se encontró publicación definitiva.',u:'https://sidof.segob.gob.mx/notas/docFuente/5459927'},
 {k:'CTR004',t:'ASEA-CTR-004-2019, Criterios para el monitoreo de la integridad mecánica de tanques de almacenamiento subterráneos en estaciones de servicio para expendio al público de gasolinas y/o diésel.',u:'https://www.gob.mx/cms/uploads/attachment/file/517655/VF_web_Criterio_Tanques_de_Almacenamiento_de_Gasolinas_17.dic.2019.pdf'},
 {k:'N020',t:'NOM-020-ASEA-2024, Transporte de gas natural por medio de ductos terrestres (DOF 01/09/2025; en vigor 28/02/2026); cancela la NOM-007-ASEA-2016.',u:'https://dof.gob.mx/nota_detalle.php?codigo=5767026&fecha=01/09/2025'},
 {k:'N009',t:'NOM-009-ASEA-2017, Administración de la integridad de ductos de recolección, transporte y distribución de hidrocarburos, petrolíferos y petroquímicos (DOF 25/01/2019).',u:'https://platiica.economia.gob.mx/normalizacion/nom-009-asea-2017/'},
 {k:'N011',t:'NOM-011-ASEA-2019, Bodegas de guarda para distribución y bodegas de expendio de gas licuado de petróleo, mediante recipientes portátiles y transportables sujetos a presión (vigente).',u:'https://platiica.economia.gob.mx/normalizacion/nom-011-asea-2019/'},
 {k:'N026',t:'NOM-026-STPS-2008, Colores y señales de seguridad e higiene, e identificación de riesgos por fluidos conducidos en tuberías.',u:'https://www.gob.mx/cms/uploads/attachment/file/807422/GUIA_INFORMATIVA_NOM-026.pdf'},
 {k:'N002',t:'NOM-002-STPS-2010, Condiciones de seguridad - Prevención y protección contra incendios en los centros de trabajo (DOF 09/12/2010).',u:'https://dof.gob.mx/normasOficiales/4228/stps/stps.htm'},
 {k:'N022',t:'NOM-022-STPS-2015, Electricidad estática en los centros de trabajo - Condiciones de seguridad (DOF 01/04/2016).',u:'https://dof.gob.mx/nota_detalle.php?codigo=5435581&fecha=01/04/2016'}
];

// ---------- Escenarios ----------
// Coordenadas locales respecto al centro de cada escenario.
const SC=[
{
 id:'gasolinera', name:'Estación de servicio (gasolina)', center:[-50,0,-8], view:[-2,0,12], yaw:0,
 material:'Gasolina · UN1203 · Clase 3 · GRE Guía 128', leak:[-2.5,0.05,3],
 info:[
  {at:[-2.5,2.6,0],title:'Zona de despacho',text:'Los vapores de gasolina son en su mayoría más pesados que el aire: se extienden a ras de suelo y se acumulan en zonas bajas o confinadas (alcantarillas, sótanos, tanques). Pueden viajar hasta una fuente de ignición y regresar en llamarada.',ref:'G128'},
  {at:[8,1.2,6],title:'Tanques subterráneos',text:'La NOM-005-ASEA-2016 regula diseño, construcción, operación y mantenimiento de estaciones de servicio. ASEA emitió un criterio para el monitoreo de integridad, fugas y sustitución de tanques subterráneos (ASEA-CTR-004-2019).',ref:'CTR004'},
  {at:[0,6.2,0],title:'Material y normativa',text:'Gasolina: UN1203, clase 3 (líquido inflamable), GRE Guía 128. Norma de la instalación: NOM-005-ASEA-2016. Sigue vigente (consulta del 11/10/2026); el PROY-NOM-023-ASEA-2025, publicado a consulta pública en el DOF el 24/12/2025, propone cancelarla.',ref:'N005'}

function probarTex(){ if(window.Realismo && Realismo.calidad()==='baja') return Promise.resolve(false);
  return fetch(TEX.base+'pbr/pasto_color.webp',{method:'HEAD'}).then(r=>TEX.ok=r.ok).catch(()=>false); }
function texturizar(){
  if(!TEX.ok) return; {
    const pon=(sel,n,rep,tinte)=>{ const e=$(sel); if(e) e.setAttribute('material',`src:url(${TEX.base}pbr/${n}_color.webp);normalMap:url(${TEX.base}pbr/${n}_normal.webp);repeat:${rep};normalTextureRepeat:${rep};roughness:1;metalness:0;color:${tinte}`); };
    pon('#suelo','pasto','90 90','#d9e8c8'); pon('#camino','asfalto','40 2','#c8c8c8');
    document.querySelectorAll('.piso-concreto').forEach(e=>{ const w=+e.getAttribute('width')||10, d=+e.getAttribute('depth')||+e.getAttribute('height')||10;
      e.setAttribute('material',`src:url(${TEX.base}concreto.webp);repeat:${Math.round(w/3)} ${Math.round(d/3)};roughness:0.95;color:#e2e4e6`); });
  }
}
// Sombras: solo mallas opacas con material estándar (no textos ni paneles)
function sombras(){
  if(window.Realismo && Realismo.calidad()==='baja') return;
  const sc=$('a-scene'), r=sc.renderer, nuevo=!r.shadowMap.enabled;
  if(nuevo){ r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap;
    if(window.Realismo && Realismo.calidad()!=='alta'){ const l=$('#sun').getObject3D('light'); l.shadow.mapSize.set(1024,1024); if(l.shadow.map){ l.shadow.map.dispose(); l.shadow.map=null; } } }
  sc.object3D.traverse(o=>{ if(!o.isMesh) return; const m=o.material; if(!m||Array.isArray(m)||m.transparent||!m.isMeshStandardMaterial) return;
    if(nuevo) m.needsUpdate=true;
    o.receiveShadow=true; o.castShadow=!(o.el&&(o.el.id==='suelo'||o.el.id==='camino'||o.el.classList.contains('piso-concreto'))); });
}

function buildWorld(){
  buildBase();
  SC.forEach(sc=>{
    const R=el('a-entity',{position:P(...sc.center)});
    ROOT[sc.id]=R;
    if(sc.id==='gasolinera') buildGasolinera(sc,R);
    if(sc.id==='galera') buildGalera(sc,R);
    if(sc.id==='ducto_gn') buildDucto(sc,R,'gn');
    if(sc.id==='ducto_crudo') buildDucto(sc,R,'cr');
    if(sc.id==='ducto_gasolina') buildDucto(sc,R,'ga');

    [...sc.hazards,...sc.decoys].forEach(h=>{
      const o=OBJ[h.id]; if(!o) return;
      o.addEventListener('click',ev=>{ ev.stopPropagation(); onObjectClick(sc,h); });
    });

}

// ---------- Panel 3D (funciona en PC, celular y visor) ----------
function placePanel(){
  const cam=$('#cam').object3D, pan=$('#panel').object3D;
  const cp=new THREE.Vector3(); cam.getWorldPosition(cp);
  const dir=new THREE.Vector3(); cam.getWorldDirection(dir); dir.y=0;
  if(dir.lengthSq()<1e-4) dir.set(0,0,1); dir.normalize();
  pan.position.copy(cp).addScaledVector(dir,-2.9); pan.position.y=cp.y-0.1;
  pan.lookAt(cp.x, pan.position.y, cp.z);
}
function showPanel({title,body='',options=[],tone='#1d2a36'}){
  const p=$('#panel'); while(p.firstChild) p.removeChild(p.firstChild);
  const W=2.9,H=2.6;
  el('a-plane',{width:W,height:H,color:tone,material:'transparent:true;opacity:0.96;shader:flat'},p);
  el('a-plane',{position:P(0,H/2-0.03,0.001),width:W,height:0.06,color:'#f5b400',material:'shader:flat'},p);
  el('a-text',{value:T(title),position:P(0,1.08,0.01),align:'center',color:'#f5b400',width:3.2,wrapCount:34},p);
  el('a-text',{value:T(body),position:P(0,0.88,0.01),align:'center',anchor:'center',baseline:'top',color:'#ffffff',width:2.7,wrapCount:50},p);
  const two=options.length>4, cols=two?2:1, bw=two?1.35:2.6, bh=0.26;
  options.forEach((o,i)=>{
    const col=two?(i%2):0, row=two?Math.floor(i/2):i;
    const x=two?(col===0?-0.7:0.7):0, y=-0.18-row*0.3;
    const b=el('a-entity',{position:P(x,y,0.02),class:'clickable'},p);
    el('a-plane',{width:bw,height:bh,color:o.color||'#2f4558',material:'shader:flat',class:'clickable'},b);
    el('a-text',{value:T(o.label),align:'center',color:'#ffffff',width:two?1.6:2.5,wrapCount:two?30:56,position:P(0,0,0.01)},b);
    b.addEventListener('mouseenter',()=>b.firstChild.setAttribute('color','#3f6a8a'));
    b.addEventListener('mouseleave',()=>b.firstChild.setAttribute('color',o.color||'#2f4558'));
    b.addEventListener('click',ev=>{ ev.stopPropagation(); setTimeout(o.onClick,10); });
  });
  placePanel(); p.setAttribute('visible',true);
  p.object3D.traverse(()=>{});
}
function hidePanel(){ const p=$('#panel'); p.setAttribute('visible',false); while(p.firstChild) p.removeChild(p.firstChild); }

// ---------- Estado y modos ----------
const STATE={sc:null,mode:null,found:new Set(),errors:0,qi:0,ok:0,fx:[],ring:null,arrow:null};
const RESULTS={};
function hud(){
  $('#hudState').textContent = STATE.sc? `${STATE.sc.name} · ${({recorrido:'Recorrido libre',peligros:'Identificar peligros',inspeccion:'Inspección',emergencia:'Respuesta a emergencia'})[STATE.mode]||'Elige modo'}` : 'Menú principal';
  let s='';
  if(STATE.mode==='peligros') s=`Peligros: ${STATE.found.size}/${STATE.sc.hazards.length} · Errores: ${STATE.errors}`;
  if(STATE.mode==='inspeccion'||STATE.mode==='emergencia') s=`Aciertos: ${STATE.ok}`;
  $('#hudScore').textContent=s;
}
function teleport(sc){
  const rig=$('#rig').object3D, cam=$('#cam');
  const [cx,cy,cz]=sc?sc.center:[0,0,0]; const v=sc?sc.view:[0,0,22];
  rig.position.set(cx+v[0],0,cz+v[2]); rig.rotation.set(0,0,0); solSobre(sc?sc.center:null);
  cam.object3D.position.set(0,1.6,0);
  const lc=cam.components['look-controls']; if(lc){ lc.yawObject.rotation.y=0; lc.pitchObject.rotation.x=0; }
}
function clearFX(){
  SFX.splice(0).forEach(h=>window.Sonido&&Sonido.detener(h));
  STATE.fx.forEach(e=>e.parentNode&&e.parentNode.removeChild(e)); STATE.fx=[];
  if(STATE.ring){ STATE.ring.parentNode.removeChild(STATE.ring); STATE.ring=null; }
  if(STATE.arrow){ STATE.arrow.parentNode.removeChild(STATE.arrow); STATE.arrow=null; }
  document.querySelectorAll('.foundmark').forEach(e=>e.parentNode.removeChild(e));
  Object.values(INFO).flat().forEach(g=>g.setAttribute('visible',false));
}
function mainMenu(){
  clearFX(); STATE.sc=null; STATE.mode=null; hud();
  showPanel({title:'Zona de Simulacion de Hidrocarburos',body:'Elige un escenario. Todos los nombres son genericos. Contenido basado en la GRE 2024 y normas oficiales mexicanas (ver Fuentes).',
    options:[...SC.map(sc=>({label:sc.name,onClick:()=>openScenario(sc)})),
      {label:'Resultados',onClick:showResults,color:'#3b5a2f'},{label:'Fuentes',onClick:refsPanel,color:'#5a4a2f'}]});
}
function openScenario(sc){
  clearFX(); STATE.sc=sc; STATE.mode=null; teleport(sc); hud();
  setTimeout(()=>modeMenu(sc),60);
}
function modeMenu(sc){
  clearFX(); STATE.mode=null; hud();
  showPanel({title:sc.name,body:sc.material+'\n\nElige que quieres realizar:',options:[
    {label:'Recorrido libre (fichas informativas)',onClick:()=>startMode('recorrido')},
    {label:'Identificar peligros',onClick:()=>startMode('peligros')},
    {label:'Inspeccion con lista de verificacion',onClick:()=>startMode('inspeccion')},
    {label:'Respuesta a emergencia',onClick:()=>startMode('emergencia')},
    {label:'Volver al menu principal',onClick:()=>{teleport(null);mainMenu();},color:'#4a3b3b'}]});
}
function startMode(m){
  const sc=STATE.sc; clearFX(); STATE.mode=m; STATE.found=new Set(); STATE.errors=0; STATE.qi=0; STATE.ok=0; hud();
  if(m==='recorrido'){
    INFO[sc.id].forEach(g=>g.setAttribute('visible',true));
    showPanel({title:'Recorrido libre',body:'Toca o apunta a las esferas azules (i) para ver cada ficha. Muevete con WASD (PC), los botones de flechas (celular) o el joystick izquierdo (visor).',
      options:[{label:'Comenzar',onClick:hidePanel},{label:'Terminar recorrido',onClick:()=>modeMenu(sc),color:'#4a3b3b'}]});
  }
  if(m==='peligros'){
    showPanel({title:'Identificar peligros',body:`Encuentra los ${sc.hazards.length} peligros del escenario y tocalos. Cuidado: tambien hay elementos que NO son peligros; seleccionarlos cuenta como error.`,
      options:[{label:'Comenzar',onClick:hidePanel},{label:'Volver',onClick:()=>modeMenu(sc),color:'#4a3b3b'}]});
  }
  if(m==='inspeccion') nextInspect();
  if(m==='emergencia'){
    startFX(sc);
    showPanel({title:'Respuesta a emergencia',body:sc.emergency.intro,tone:'#3a1d1d',options:[{label:'Iniciar',onClick:nextEmergency}]});
  }
}
function showInfo(sc,i){
  const inf=sc.info[i], r=REFS.find(x=>x.k===inf.ref);
  showPanel({title:inf.title,body:inf.text+'\n\nFuente: '+r.t.split(',')[0].split(' - ')[0],options:[{label:'Cerrar',onClick:hidePanel},{label:'Terminar recorrido',onClick:()=>modeMenu(sc),color:'#4a3b3b'}]});
}
function markFound(obj,color){
  const m=el('a-ring',{class:'foundmark',rotation:'-90 0 0',position:P(0,2.4,0),radiusInner:0.35,radiusOuter:0.5,color,material:'shader:flat;side:double',
    animation:'property:rotation;to:-90 360 0;loop:true;dur:3000;easing:linear'},obj);
  return m;
}
function onObjectClick(sc,h){
  if(STATE.sc!==sc||STATE.mode!=='peligros') return;
  const isHaz=sc.hazards.includes(h), r=REFS.find(x=>x.k===h.ref);
  if(isHaz){
    if(!STATE.found.has(h.id)){ STATE.found.add(h.id); markFound(OBJ[h.id],'#2fbf71'); }
    hud();
    const done=STATE.found.size===sc.hazards.length;
    showPanel({title:'Peligro identificado: '+h.title,body:h.text+'\n\nFuente: '+shortRef(r),tone:'#1d3a2a',
      options: done?[{label:'Ver resultado',onClick:finishPeligros}]:[{label:'Seguir buscando',onClick:hidePanel},{label:'Terminar',onClick:finishPeligros,color:'#4a3b3b'}]});
  } else {
    STATE.errors++; hud();
    showPanel({title:'No es un peligro: '+h.title,body:h.text+'\n\nFuente: '+shortRef(r),tone:'#3a321d',options:[{label:'Seguir buscando',onClick:hidePanel}]});
  }
}
function finishPeligros(){
  const sc=STATE.sc, n=sc.hazards.length, f=STATE.found.size;
  const missing=sc.hazards.filter(h=>!STATE.found.has(h.id)).map(h=>'- '+h.title).join('\n');
  saveResult(sc,'Identificar peligros',`${f}/${n} peligros, ${STATE.errors} errores`);
  showPanel({title:'Resultado: identificar peligros',body:`Peligros encontrados: ${f} de ${n}\nSelecciones erroneas: ${STATE.errors}`+(missing?'\n\nNo identificados:\n'+missing:''),
    options:[{label:'Repetir',onClick:()=>startMode('peligros')},{label:'Otro modo',onClick:()=>modeMenu(sc)},{label:'Menu principal',onClick:()=>{teleport(null);mainMenu();},color:'#4a3b3b'}]});
}
function pointAt(id){
  if(STATE.arrow){ STATE.arrow.parentNode.removeChild(STATE.arrow); STATE.arrow=null; }
  const o=OBJ[id]; if(!o) return;
  STATE.arrow=el('a-cone',{position:P(0,3,0),rotation:'180 0 0',radiusBottom:0.25,radiusTop:0,height:0.6,color:'#f5b400',material:'shader:flat',
    animation:'property:position;to:0 2.6 0;dir:alternate;loop:true;dur:600'},o);
}
function nextInspect(){
  const sc=STATE.sc, list=sc.inspect;
  if(STATE.qi>=list.length){
    saveResult(sc,'Inspeccion',`${STATE.ok}/${list.length} correctas`);
    if(STATE.arrow){ STATE.arrow.parentNode.removeChild(STATE.arrow); STATE.arrow=null; }
    return showPanel({title:'Resultado: inspeccion',body:`Respuestas correctas: ${STATE.ok} de ${list.length}`,
      options:[{label:'Repetir',onClick:()=>startMode('inspeccion')},{label:'Otro modo',onClick:()=>modeMenu(sc)},{label:'Menu principal',onClick:()=>{teleport(null);mainMenu();},color:'#4a3b3b'}]});
  }
  const it=list[STATE.qi]; pointAt(it.target);
  const answer=v=>{ const good=(v===it.a); if(good) STATE.ok++; hud(); STATE.qi++;
    const r=REFS.find(x=>x.k===it.ref);
    showPanel({title:good?'Correcto':'Incorrecto',body:it.exp+'\n\nFuente: '+shortRef(r),tone:good?'#1d3a2a':'#3a1d1d',options:[{label:'Siguiente',onClick:nextInspect}]}); };
  showPanel({title:`Inspeccion ${STATE.qi+1}/${list.length}`,body:it.q+'\n\n(Observa el elemento senalado con la flecha amarilla.)',
    options:[{label:'Si cumple',onClick:()=>answer(true),color:'#2e5a3e'},{label:'No cumple',onClick:()=>answer(false),color:'#5a2e2e'},{label:'Ocultar panel para observar',onClick:()=>{hidePanel();}}]});
}
function startFX(sc){
  const R=ROOT[sc.id], [x,y,z]=sc.leak, fx=sc.emergency.fx;
  if(fx==='spill'||fx==='crude'){
    const c=el('a-circle',{rotation:'-90 0 0',position:P(x,0.04,z),radius:0.5,color:fx==='crude'?'#0d0d0d':'#5b4a2a',material:'transparent:true;opacity:0.9;metalness:0.5;roughness:0.2',
      animation:'property:radius;to:3.2;dur:8000;easing:easeOutQuad'},R); STATE.fx.push(c);
  }
  if(fx==='lpfire'){ STATE.fx.push(flame(R,P(x,1.25,z),0.7)); }
  if(fx==='gnfire'){ STATE.fx.push(flame(R,P(x,y+0.3,z),1.6)); }
  // sonido de la emergencia (motor/sonido.js): alarma y, si hay flama, fuego
  if(window.Sonido){ const pos=R.object3D.localToWorld(new THREE.Vector3(x,1,z)); const o={getWorldPosition:v=>v.copy(pos),position:pos};
    SFX.push(Sonido.fuente('alarma',o,{vol:0.7,alcance:45})); if(fx==='lpfire'||fx==='gnfire') SFX.push(Sonido.fuente('fuego',o,{vol:0.8,alcance:25})); }
  setTimeout(sombras,100);
}
function showRing(sc,r){
  const R=ROOT[sc.id], [x,,z]=sc.leak;
  if(STATE.ring) STATE.ring.parentNode.removeChild(STATE.ring);
  const g=el('a-entity',{position:P(x,0.06,z)},R);
  el('a-ring',{rotation:'-90 0 0',radiusInner:r-0.6,radiusOuter:r,color:'#e5484d',material:'shader:flat;side:double',segmentsTheta:96},g);
  for(let a=0;a<360;a+=45){ const rad=a*Math.PI/180; const s=el('a-entity',{position:P(Math.cos(rad)*r,0,Math.sin(rad)*r),rotation:P(0,-a+90,0)},g);
    cyl(s,P(0,0.6,0),0.05,1.2,'#e5484d'); box(s,P(0,1.3,0),1.6,0.35,0.04,'#ffffff'); txt(s,P(0,1.3,0.03),`AISLAMIENTO ${r} m`,{color:'#c62828',width:2.4}); }
  STATE.ring=g;
}
function nextEmergency(){
  const sc=STATE.sc, st=sc.emergency.steps;
  if(STATE.qi>=st.length){
    saveResult(sc,'Respuesta a emergencia',`${STATE.ok}/${st.length} decisiones correctas`);
    return showPanel({title:'Resultado: respuesta a emergencia',body:`Decisiones correctas: ${STATE.ok} de ${st.length}\n\nRecuerda: la GRE orienta la fase inicial de incidentes de transporte. En una instalacion rige su Plan de Respuesta a Emergencias.`,
      options:[{label:'Repetir',onClick:()=>startMode('emergencia')},{label:'Otro modo',onClick:()=>modeMenu(sc)},{label:'Menu principal',onClick:()=>{teleport(null);mainMenu();},color:'#4a3b3b'}]});
  }
  const s=st[STATE.qi];
  // barajar opciones conservando la correcta
  const idx=s.o.map((_,i)=>i).sort(()=>Math.random()-0.5);
  showPanel({title:`Decision ${STATE.qi+1}/${st.length}`,body:s.q,tone:'#3a1d1d',options:idx.map(i=>({label:s.o[i],onClick:()=>{
    const good=i===s.c; if(good) STATE.ok++; hud(); STATE.qi++;
    if(s.ring) showRing(sc,s.ring);
    const r=REFS.find(x=>x.k===s.ref);
    showPanel({title:good?'Correcto':'Incorrecto',body:(good?'':'Respuesta correcta: '+s.o[s.c]+'\n\n')+s.exp+'\n\nFuente: '+shortRef(r),tone:good?'#1d3a2a':'#3a1d1d',options:[{label:'Siguiente',onClick:nextEmergency}]});
  }}))});
}
function shortRef(r){ return r? r.t.split(' - ')[0].split(',')[0] : ''; }
function saveResult(sc,m,v){ RESULTS[sc.name]=RESULTS[sc.name]||{}; RESULTS[sc.name][m]=v; }
function showResults(){
  const lines=Object.keys(RESULTS).map(k=>k+':\n'+Object.entries(RESULTS[k]).map(([m,v])=>'  '+m+': '+v).join('\n')).join('\n');
  showPanel({title:'Resultados de la sesion',body:lines||'Aun no hay resultados en esta sesion.',options:[{label:'Volver',onClick:mainMenu}]});
}

// ---------- Caminar con clic y respetar objetos (12/10/2026) ----------
// Toca/clic en el piso: se calcula una ruta A* (motor/navegacion.js) que rodea dispensarios, cilindros, ductos, personas y
// vehículos. Teclado (WASD/flechas), botones y joystick también chocan con los objetos en lugar de atravesarlos.
let NAV=null; const RUTA=[]; let MARCA=null;
AFRAME.registerComponent('encima',{tick(){ this.el.object3D.traverse(o=>{ if(!o.material) return; o.renderOrder=999;
  (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ if(m.depthTest){ m.depthTest=false; m.depthWrite=false; m.transparent=true; m.needsUpdate=true; } }); }); }});
async function construirNav(){
  const {Navegacion}=await import('../../../motor/navegacion.js');
  const nav=new Navegacion({x0:-90,z0:-50,x1:100,z1:50,celda:0.3});
  const b=new THREE.Box3(), c=new THREE.Vector3(), t=new THREE.Vector3();
  const w=$('#world').object3D; w.updateMatrixWorld(true);
  const bloquear=o=>{ b.setFromObject(o); if(b.isEmpty()) return; b.getSize(t); b.getCenter(c);
    if(t.y<0.15||b.min.y>1.9||t.x*t.z>150) return; nav.bloquearRect(c.x,c.z,t.x+0.45,t.z+0.45,0); };
  const visitar=(ent)=>{ for(const ch of ent.children){ if(!ch.object3D||ch.id==='suelo'||ch.id==='camino') continue;
    // grupos grandes (techumbres, patios) se recorren por partes; los objetos se bloquean completos
    b.setFromObject(ch.object3D); if(!b.isEmpty()){ b.getSize(t); if(t.x*t.z>60 && ch.children.length) { visitar(ch); continue; } }
    bloquear(ch.object3D); } };
  visitar($('#world'));
  NAV=nav; return nav;
}
function caminarA(x,z){ if(!NAV) return; const rig=$('#rig').object3D, cam=$('#cam').object3D, cp=new THREE.Vector3(); cam.getWorldPosition(cp);
  const r=NAV.ruta({x:cp.x,z:cp.z},{x,z}); RUTA.length=0; if(!r.length){ aviso2('No hay paso libre hasta ahí'); return; }
  const off=new THREE.Vector3(cp.x-rig.position.x,0,cp.z-rig.position.z);   // en el visor la cabeza no está en el centro del rig
  r.forEach(p=>RUTA.push(new THREE.Vector3(p.x-off.x,0,p.z-off.z)));
  if(!MARCA){ MARCA=el('a-ring',{rotation:'-90 0 0',radiusInner:0.18,radiusOuter:0.28,color:'#3FA7C6',material:'shader:flat;side:double'}); }
  const u=r[r.length-1]; MARCA.setAttribute('position',P(u.x,0.03,u.z)); MARCA.setAttribute('visible',true); }
function aviso2(t){ const h=$('#hudScore'); const o=h.textContent; h.textContent='⚠ '+t; setTimeout(()=>{ if(h.textContent==='⚠ '+t) h.textContent=o; },1800); }
AFRAME.registerComponent('seguir-ruta',{tick(t,dt){ if(!RUTA.length||!dt) return; ULT_MOV=performance.now(); const rig=$('#rig').object3D, d=RUTA[0].clone().sub(rig.position); d.y=0; const L=d.length();
  if(L<0.08){ RUTA.shift(); if(!RUTA.length&&MARCA) MARCA.setAttribute('visible',false); return; }
  rig.position.addScaledVector(d.normalize(),Math.min(L,2.4*dt/1000)); }});
// clic/toque en el piso (no cuenta si fue un arrastre para mirar)
let abajo=null;
addEventListener('pointerdown',e=>{ if(e.target.tagName==='CANVAS') abajo=[e.clientX,e.clientY]; },true);
addEventListener('pointerup',e=>{ if(e.target.tagName!=='CANVAS'||!abajo) return; const mov=Math.hypot(e.clientX-abajo[0],e.clientY-abajo[1]); abajo=null; if(mov>8) return;
  const cam=scene.camera; if(!cam) return; const ray=new THREE.Raycaster(), v=new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(v,cam);
  const objs=[]; document.querySelectorAll('.clickable').forEach(n=>{ if(n.object3D&&n.object3D.visible) objs.push(n.object3D); });
  const hitObj=ray.intersectObjects(objs,true)[0], piso=new THREE.Plane(new THREE.Vector3(0,1,0),0), p=new THREE.Vector3();
  if(!ray.ray.intersectPlane(piso,p)) return; if(hitObj && hitObj.distance < ray.ray.origin.distanceTo(p)) return;   // tocó un objeto o el panel
  if($('#panel').getAttribute('visible')===true||$('#panel').object3D.visible) return;
  caminarA(p.x,p.z); },true);
// en el visor: gatillo apuntando al piso
['#hl','#hr'].forEach(id=>{ const c=$(id); c.addEventListener('triggerdown',()=>{ const rc=c.components.raycaster; if(!rc) return; if(rc.intersectedEls&&rc.intersectedEls.length) return;
  const o=new THREE.Vector3(), d=new THREE.Vector3(); c.object3D.getWorldPosition(o); c.object3D.getWorldDirection(d); d.negate();
  if(d.y>-0.05) return; const k=-o.y/d.y, x=o.x+d.x*k, z=o.z+d.z*k; caminarA(x,z); }); });
// teclado con colisiones

function senal(p,pos,id,rotY=0,alto=2.0){ if(!window.Senales) return null; const cv=Senales.canvas(id,256); cv.id='sen_'+id+'_'+Math.random().toString(36).slice(2,7); cv.style.display='none'; document.body.appendChild(cv);
  const info=(Senales.LISTA||[]).find(x=>x.id===id)||{nombre:id};
  const g=el('a-entity',{position:pos,rotation:P(0,rotY,0)},p);
  cy(g,P(0,alto/2,-0.03),0.04,alto,'#7b858d',0.4,0.7);
  el('a-plane',{position:P(0,alto+0.3,0),width:0.6,height:0.6,material:`src:#${cv.id};shader:flat;transparent:true;side:double`},g);
  bx(g,P(0,alto+0.3,-0.02),0.64,0.64,0.02,'#5d666e',0.5,0.6);
  txt(g,P(0,alto-0.08,0.01),info.nombre.toUpperCase(),{width:1.6,color:'#111'}); bx(g,P(0,alto-0.08,-0.005),0.95,0.16,0.01,'#ffffff',0.8);
  return g; }
const SENALES={
  gasolinera:[['no_fumar',[-13,0,11],15],['no_llama',[13,0,11],-15],['inflamable',[12,0,4],-90],['extintor',[6.2,0,-3.2],0],['salida',[-14.2,0,-7],90],['reunion',[16,0,13],-30]],

  ducto_crudo:[['inflamable',[-2.5,0,-1.5],0],['no_fumar',[5.5,0,-1.5],0],['no_paso',[-9,0,-12],60],['reunion',[-8,0,4],20]],
  ducto_gasolina:[['inflamable',[-1.2,0,-1.5],0],['no_fumar',[6,0,-1.5],0],['no_paso',[-9,0,-12],60],['reunion',[-8,0,4],20]]};
function ponerSenales(){ Object.entries(SENALES).forEach(([id,lista])=>{ const R=ROOT[id]; if(!R) return; lista.forEach(([s,pos,ry])=>senal(R,P(...pos),s,ry)); }); }
