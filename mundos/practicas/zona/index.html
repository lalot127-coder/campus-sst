// Contenido y fuentes en datos.js (numerales verificados); objetos en props.js; caminar con clic: motor.recorrido (A*).

// animaciones permanentes: disco de la sierra, torretas, semáforo, destellos, flamas

});

// ------------------------------------------------------------------ caminar con clic (rodea maquinaria, personas y muros)
const RC = await W.recorrido({ piso: [piso, ext], limites: { x0: -AN / 2 - 6, x1: AN / 2 + 6, z0: -FO / 2 - 6, z1: FO / 2 + 6 }, obstaculos: OBST, muros: MUROS,
  inicio: [0, FO / 2 - 1.5], ry: Math.PI, camara: [3.8, 7.8], alcance: 2.2 });
REG.yo = RC.yo;
// ------------------------------------------------------------------ sonido (motor/sonido.js, generado por código, sin archivos)
const SON = { camion: 'motor_grande', cargador: 'motor_grande', excavadora: 'motor_grande', locomotora: 'motor_grande', banda: 'banda', sierra: 'sierra', tractor: 'motor', montacargas: 'motor', tolva: 'maquina', grua: 'maquina' };
const SND = {}, SNDFX = [];
Object.entries(REG).forEach(([n, g]) => { const t = SON[n.replace(/\d+$/, '')]; if (t && g !== RC.yo) SND[n] = W.sonido(t, g, { vol: 0.75, alcance: 22 }); });
W.sonido({ mina_subterranea: 'ventilador', puerto: 'agua' }[ZID] || 'viento', null, { vol: 0.45 });
if (REG.semaforo) SND.semaforo = W.sonido('campana', REG.semaforo, { vol: 0.5, alcance: 18 });
if (H.mechero) SND.mechero = W.sonido('fuego', H.mechero.g, { vol: 0.4, alcance: 8 });

// ------------------------------------------------------------------ utilidades de los modos
const fuente = f => f;
const barajar = (ops, ok) => { const idx = ops.map((_, i) => i).sort(() => Math.random() - 0.5); return { ops: idx.map(i => ops[i]), ok: idx.indexOf(ok) }; };
const posDe = n => { const g = REG[n] || (H[n] && H[n].g); if (!g) return null; const b = new THREE.Box3().setFromObject(g); return b.isEmpty() ? g.getWorldPosition(new THREE.Vector3()) : b.getCenter(new THREE.Vector3()).setY(b.max.y); };
let flecha = null;
function senalar(n) { if (flecha) { scene.remove(flecha); flecha = null; } const p = posDe(n); if (!p) return;
  flecha = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.7, 16), new THREE.MeshBasicMaterial({ color: 0xF5B400, depthTest: false })); flecha.rotation.x = Math.PI; flecha.renderOrder = 9; flecha.position.copy(p).add(new THREE.Vector3(0, 1.2, 0)); scene.add(flecha);
  const y0 = flecha.position.y; flecha.userData.f = t => { if (flecha) flecha.position.y = y0 + 0.2 * Math.sin(t * 5); }; }

const mirar = n => { const p = posDe(n); if (!p) return; RC.seguir(false); W.mover(W.controls.target, p.clone().setY(1), 700); };
// efectos de emergencia

  if (fx[0]) W.efecto(fx[0]); if (fx[1]) SNDFX.push(W.sonido(fx[1], g || REG.yo, { vol: 0.8, alcance: 40 }));
  if (tipo === 'volcar' && g) { W.animar(900, k => { g.rotation.z = -1.3 * k; g.position.y = 0.6 * k; }); }
  if (tipo === 'humo' || tipo === 'fuga' || tipo === 'derrame') { const color = tipo === 'humo' ? 0x9E9E9E : tipo === 'fuga' ? 0xC0CA33 : 0x8BC34A;
    for (let i = 0; i < (tipo === 'humo' ? 14 : 1); i++) { const s = new THREE.Mesh(tipo === 'humo' ? new THREE.SphereGeometry(0.5, 10, 8) : new THREE.CircleGeometry(0.4, 24), new THREE.MeshStandardMaterial({ color, transparent: true, opacity: 0.55 }));
      if (tipo !== 'humo') { s.rotation.x = -Math.PI / 2; s.position.set(p.x, 0.03, p.z + 1.2); W.animar(5000, k => s.scale.setScalar(1 + 4 * k)); }
      else { s.position.set(p.x + (Math.random() - .5) * 3, 1 + Math.random(), p.z); s.userData.v = 0.3 + Math.random() * 0.5; }
      scene.add(s); FX.push(s); } }
  if (tipo === 'incendio') { const base = p.clone().setY(0); FUEGO.activo = true; FUEGO.I = 1; FUEGO.c.copy(base);   // llamas, humo y crepitar (motor/sonido.js)
    for (let i = 0; i < 26; i++) { const f = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.9, 8), new THREE.MeshBasicMaterial({ color: i % 3 ? 0xFF6D00 : 0xFFC400, transparent: true, opacity: 0.85 })); f.userData.llama = { a: Math.random() * 6.3, r: Math.random() * 0.9, v: Math.random() }; scene.add(f); FX.push(f); }
    for (let i = 0; i < 10; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(0.45, 10, 8), new THREE.MeshStandardMaterial({ color: 0x5A5A5A, transparent: true, opacity: 0.5 })); s.position.set(base.x + (Math.random() - .5) * 1.5, 1.2 + Math.random() * 2, base.z); s.userData.v = 0.4 + Math.random() * 0.4; scene.add(s); FX.push(s); }
    const lf = new THREE.PointLight(0xFF7A1A, 6, 9); lf.position.copy(base).add(new THREE.Vector3(0, 1, 0)); lf.userData.flama = true; scene.add(lf); FX.push(lf); SNDFX.push(W.sonido('fuego', lf, { vol: 1, alcance: 16 }));
    const la = new THREE.PointLight(0xFF1744, 0, 14); la.position.copy(base).add(new THREE.Vector3(0, 2.6, 0)); la.userData.alarma = true; scene.add(la); FX.push(la); }
  if (tipo === 'desmayo' && g) { W.animar(700, k => { g.rotation.x = -Math.PI / 2 * k; g.position.y = 0.25 * k; }); }
  if (tipo === 'sismo') { const c0 = W.camera.position.clone(); W.animar(2500, k => { W.camera.position.set(c0.x + Math.sin(k * 60) * 0.12 * (1 - k), c0.y, c0.z + Math.cos(k * 47) * 0.1 * (1 - k)); }); }
  if (tipo === 'derrumbe') { const m = new THREE.Mesh(new THREE.ConeGeometry(1.1, 1.2, 14), M(0x7A5A3A, { flatShading: true })); m.position.set(p.x + 0.4, -1.1, p.z); scene.add(m); FX.push(m); }
  if (tipo === 'alarma' || tipo === 'caida' || tipo === 'auto') { const l = new THREE.PointLight(0xFF1744, 0, 12); l.position.copy(p).add(new THREE.Vector3(0, 2, 0)); scene.add(l); l.userData.alarma = true; FX.push(l); }

    W.globo('A la base del fuego', b, 1800, 2.2); SNDFX.push(W.sonido('fuga', b, { vol: 0.7, alcance: 14 }));
    await W.animar(2600, k => { FUEGO.I = Math.max(0, 1 - k * 1.1); nube.forEach((c, i) => { const q = (k * 3 + i / 14) % 1; c.visible = true; c.position.set(b.position.x + (p.x - b.position.x) * q, 0.6 - 0.3 * q, b.position.z + (p.z - b.position.z) * q); c.scale.setScalar(0.5 + q * 2); }); });
    nube.forEach(c => c.visible = false); FUEGO.I = 0; SNDFX.forEach(h => h.detener()); FX.forEach(f => { if (f.userData.alarma) f.userData.alarma = false; }); W.globo('Fuego extinguido', b, 2000, 2.2); await W.esperar(900); }
  if (t === 'alarma') { SNDFX.push(W.sonido('alarma', null, { vol: 0.5 })); const l = new THREE.PointLight(0xFF1744, 0, 30); l.position.set(0, (D.alto || 4) - 0.3, 0); l.userData.alarma = true; scene.add(l); FX.push(l); W.globo(x || '¡Alarma activada!', REG.yo, 2200, 2.1); await W.esperar(1200); }
  if (t === 'evacuar') { const dest = new THREE.Vector3(...(D.reunion || [0, FO / 2 + 3])).setY(0), gente = [];
    for (let i = 0; i < (x || 4); i++) { const b = persona(['persona', -AN / 3 + i * 1.6, -FO / 4 + (i % 2), 0, { ropa: [0x1565C0, 0x6A1B9A, 0x2E7D32, 0xEF6C00][i % 4], casco: D.interior ? null : 0xF2C230 }]); FX.push(b); gente.push([b, b.position.clone()]); }
    W.globo('Sigan la ruta de evacuación', REG.yo, 2000, 2.1);
    await W.animar(3200, k => gente.forEach(([b, o], i) => { const d = dest.clone().add(new THREE.Vector3((i - 1.5) * 0.9, 0, 0)); b.position.lerpVectors(o, d, k); b.lookAt(d.x, 0, d.z); b.position.y = Math.abs(Math.sin(k * 30 + i)) * 0.04; }));
    W.globo('Punto de reunión: conteo', gente[0][0], 2000, 2.2); await W.esperar(900); }
  if (t === 'cortar') { const g = REG[n] || (H[n] && H[n].g); W.efecto('clic'); W.globo(x || 'Energía cortada y bloqueada', g, 2200, 2.4); anim.sierra = 'detenido'; Object.keys(SND).forEach(k => { SND[k].detener(); delete SND[k]; }); await W.esperar(1100); }
  if (t === 'ir') { const p = posDe(n); if (!p) return; await new Promise(ok => { if (!RC.ir(p.x + 1, p.z + 1.5, ok)) ok(); setTimeout(ok, 9000); }); }
}
// paso de pregunta con animación al acertar (opciones barajadas)
const pasoPregunta = (titulo, texto, q, ops, ok, exp, f, a, antes) => ({ titulo, texto, fuente: f, puntos: 10,
  async iniciar() { if (antes) await antes(); const b = barajar(ops, ok); W.pregunta(q, b.ops, [b.ok], fuente(f), async () => { await animar(a); W.siguiente(); }, false, exp); } });
const intro = (html) => ({ titulo: 'Inicio', texto: D.intro, sinPuntos: true, iniciar() { W.aviso(html + `<p class="ficticio">${D.intro}</p>`, () => W.siguiente(), 'Comenzar'); } });
function tablaMatriz(f, s) { const SV = ['I', 'II', 'III', 'IV'], col = { Grave: '#B03A2E', Elevado: '#E67E22', Medio: '#F2C94C', Bajo: '#A5D6A7', 'Mínimo': '#2E7D32' };
  return `<table style="margin-top:8px;font-size:.8rem;text-align:center"><tr><th></th>${SV.map(x => `<th>${x}</th>`).join('')}</tr>${['E', 'D', 'C', 'B', 'A'].map(fr => `<tr><th>${fr}</th>${SV.map((x, j) => { const v = R.MATRIZ[fr][j];
    return `<td style="background:${col[v]};color:${['Grave', 'Elevado', 'Mínimo'].includes(v) ? '#fff' : '#1F2433'};${fr === f || x === s ? 'outline:2px solid #14213D' : ''}">${fr === f && x === s ? '?' : v}</td>`; }).join('')}</tr>`).join('')}</table><p class="ficticio">Matriz NOM-031-STPS-2011, 8.3, Tabla 4.</p>`; }
const verPines = v => PINES.forEach(m => { m.ic.visible = m.marco.visible = v; });
const verHallazgos = v => Object.values(H).forEach(h => { h.mk.ic.visible = h.mk.marco.visible = v && h._visto; });

// ------------------------------------------------------------------ modos
const MODOS = {
  recorrido: () => [intro(`<h2>🗺️ Recorrido · ${D.nombre}</h2><p>Camina (toca el piso) y toca cada marcador numerado para leer qué pide la norma en ese punto.</p>`),
    ...D.recorrido.map((r, k) => ({ titulo: `${k + 1}. ${r.titulo}`, texto: `Camina y toca el marcador <b>${k + 1}</b>: ${r.titulo}.`, fuente: r.f, puntos: 10,
      iniciar() { verPines(true); W.resaltar([PINES[k].marco]); },
      tocar(o) { if (o.userData.tipo !== 'i:' + k || this._h) return; this._h = true; W.resaltar([]); PINES[k].marco.material.color.set(0x2E7D32);
        W.aviso(`<h2>${k + 1}. ${r.titulo}</h2><p>${r.texto}</p><p class="ficticio">Fuente: ${r.f}</p>`, () => { W.bien('Ficha leída.', r.f); W.siguiente(); }, 'Siguiente'); } }))],
  peligros: () => { const buenas = D.peligros.filter(p => p.real), malas = D.peligros.filter(p => !p.real);
    const item = p => ({ tipo: 'h:' + p.id, nombre: p.nombre, fb: p.fb, f: p.f, obj: H[p.id].mk });
    const st = R.encuentra(W, { titulo: 'Identifica los peligros', texto: 'Recorre la zona (toca el piso para caminar) y toca lo que sea un <b>riesgo sin control</b>. Cuidado: también hay condiciones controladas.', fuente: 'NOM-030-STPS-2009, 6.1', buenas: buenas.map(item), malas: malas.map(item) });
    const toc = st.tocar; st.tocar = function (o) { const t = o.userData.tipo || ''; const id = t.slice(2); if (H[id]) { H[id]._visto = true; H[id].mk.ic.visible = H[id].mk.marco.visible = true; toc.call(this, { userData: { tipo: 'h:' + id } }); } };
    return [intro(`<h2>⚠️ Identifica los peligros · ${D.nombre}</h2><p>Hay <b>${buenas.length}</b> riesgos sin control y <b>${malas.length}</b> condiciones controladas. Marcar una controlada resta puntos.</p>`), st]; },
  inspeccion: () => [intro(`<h2>📋 Inspección · ${D.nombre}</h2><p>Revisa cada punto de la lista (la flecha amarilla te muestra dónde) y contesta si <b>cumple</b> o <b>no cumple</b>.</p>`),
    ...D.inspeccion.map((it, k) => ({ titulo: `Inspección ${k + 1}/${D.inspeccion.length}`, texto: it.q, fuente: it.f, puntos: 10,
      iniciar() { senalar(it.obj); mirar(it.obj); const resp = v => { if (this._h) return; this._h = true; W.botones([]); if (flecha) { scene.remove(flecha); flecha = null; }
          if (v === it.a) W.bien(it.exp, it.f); else W.mal(it.exp, it.f); RC.seguir(true); W.siguiente(); };
        W.botones([['✔ Sí cumple', () => resp(true)], ['✘ No cumple', () => resp(false), 'sec']]); } }))],
  emergencia: () => { const E = D.emergencia; return [
    { titulo: 'Emergencia', texto: E.intro, sinPuntos: true, iniciar() { limpiarFX(); efecto(E.efecto, E.foco); mirar(E.foco); W.aviso(`<h2>🚨 Respuesta a emergencia · ${D.nombre}</h2><p>${E.intro}</p><p>Contesta en orden; la escena hará lo que diga cada respuesta correcta.</p>`, () => W.siguiente(), 'Comenzar'); } },
    ...E.pasos.map((p, k) => pasoPregunta(`Decisión ${k + 1}/${E.pasos.length}`, E.intro, p.q, p.ops, p.ok, p.exp, p.f, p.anim))]; },
  analisis: () => [].concat(D.analisis).flatMap((A, ia, todos) => { const h = H[A.principal], nv = R.nivel(A.f, A.s), FR = ['A', 'B', 'C', 'D', 'E'], SV = ['I', 'II', 'III', 'IV'], NV = ['Grave', 'Elevado', 'Medio', 'Bajo', 'Mínimo'];
    const ctx = `<b>${A.riesgo}</b><br><i>${A.pista}</i>`;
    const n = todos.length > 1 ? ` (${ia + 1}/${todos.length})` : '';
    return [...(ia ? [] : [intro(`<h2>🔎 Análisis de riesgo · ${D.nombre}</h2><p>Evalúa ${todos.length > 1 ? `<b>${todos.length} riesgos</b>` : 'el riesgo principal'} con la matriz de la NOM-031-STPS-2011 (frecuencia × severidad) y elige el control más efectivo para cada uno.</p>`)]),
      { titulo: 'Identifica' + n, texto: `Toca el riesgo: <b>${h.p.nombre}</b>.`, fuente: h.p.f, puntos: 10, iniciar() { senalar(A.principal); h._visto = true; h.mk.ic.visible = h.mk.marco.visible = true; W.resaltar([h.mk.marco]); },
        tocar(o) { const t = o.userData.tipo || ''; if (t !== 'h:' + A.principal && t !== 'm:' + A.principal || this._h) return; this._h = true; W.resaltar([]); if (flecha) { scene.remove(flecha); flecha = null; } W.bien(h.p.fb, h.p.f); W.siguiente(); } },
      { titulo: 'Frecuencia' + n, texto: ctx, fuente: R.N31, puntos: 10, iniciar() { R.decidir(W, '¿Qué frecuencia de ocurrencia tiene?', FR.map(f => ({ t: R.FREC[f], ok: f === A.f, fb: `Frecuencia ${R.FREC[A.f]}.`, f: 'NOM-031-STPS-2011, 8.3 a) Tabla 2' })), () => W.siguiente(), ctx, false); } },
      { titulo: 'Severidad' + n, texto: ctx, fuente: R.N31, puntos: 10, iniciar() { R.decidir(W, '¿Qué severidad del daño puede ocasionar?', SV.map(s => ({ t: R.SEV[s], ok: s === A.s, fb: `Severidad ${R.SEV[A.s]}.`, f: 'NOM-031-STPS-2011, 8.3 b) Tabla 3' })), () => W.siguiente(), ctx, false); } },
      { titulo: 'Nivel de riesgo' + n, texto: ctx, fuente: R.N31, puntos: 10, iniciar() { R.decidir(W, `Con ${A.f} × ${A.s}, ¿qué nivel indica la matriz?`, NV.map(x => ({ t: x, ok: x === nv, fb: `${A.f} × ${A.s} = ${nv}.`, f: 'NOM-031-STPS-2011, 8.3 c) Tabla 4' })),
        () => { h.mk.marco.material.color.set(R.NIVEL_COLOR[nv]); W.siguiente(); }, ctx + tablaMatriz(A.f, A.s), false); } },
      { titulo: 'Control' + n, texto: ctx, fuente: 'NOM-017-STPS-2024, 5.2; NIOSH (referencia)', puntos: 10, iniciar() { R.decidir(W, '¿Cuál es la medida MÁS efectiva?', A.control, () => { W.globo('Control aplicado', h.g, 2200, 2.6); setTimeout(() => W.siguiente(), 900); }, `${ctx}<br>Jerarquía: eliminación → sustitución → ingeniería → administrativos → EPP.`); } }]; }),
};
const NOMBRES = { recorrido: '🗺️ <b>Recorrido:</b> fichas de la norma en cada punto', peligros: '⚠️ <b>Identificar peligros</b> (riesgos sin control y condiciones controladas)',
  inspeccion: '📋 <b>Inspección</b> con lista de verificación', emergencia: '🚨 <b>Respuesta a emergencia</b> (la escena hace lo que dices)', analisis: '🔎 <b>Análisis de riesgo</b> (matriz NOM-031 y jerarquía de controles)' };
const pedido = Q.get('modo'), orden = Object.keys(MODOS).sort((a, b) => (b === pedido) - (a === pedido));
W.inicio(orden.map(id => ({ id, txt: NOMBRES[id] })), id => { limpiarFX(); verHallazgos(false); verPines(false); Object.values(H).forEach(h => { h._visto = false; h.mk.marco.material.color.set(0x1F6F8B); if (h.mk.rot) h.mk.rot.visible = false; });
  PINES.forEach(m => m.marco.material.color.set(0x154F90)); return MODOS[id](); },
  'Fuentes: ' + Object.values(FUENTES).map(f => f.t).join(' · ') + ' Escenas y personas ficticias con fines didácticos.');
W.activarXR({ inicio: [0, FO / 2 - 1.5], piso, entorno: [piso] });
if (Q.has('qa')) window.__qa = { W, REG, H, PINES, RC, D, tocar: W.tocar };
</script>
