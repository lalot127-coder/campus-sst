<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const crearMundo = cfg => MotorSim.crearMundo(THREE, OrbitControls, cfg);

// Fuentes verificadas (02_fuentes_verificadas/registro_fuentes.md, consulta 03/10/2026)
const F = {
  oms: 'OMS, cartel "How to handwash / How to handrub" (2006)',
  nom1: 'NOM-045-SSA2-2005, 10.6.1.1',
  nom2: 'NOM-045-SSA2-2005, 10.6.1.2',
  nom3: 'NOM-045-SSA2-2005, 10.6.1.3; OMS (2006)',
  alhajas: 'PROY-NOM-045-SSA-2026, 10.7.4 (proyecto); texto AESP DOF 08/09/2017, AE5B',
};
const W = crearMundo({ titulo: 'Lavado de manos correcto', icono: '🧼', clave: 'higiene_manos_tecnica',
  criterio: { pct: 80, sinCriticos: true },
  vistas: [[[0, 1.62, 0.78], [0, 1.08, -0.45]], [[0, 1.75, 1.35], [0, 1.0, -0.2]], [[1.3, 1.6, 1.0], [0, 1.0, -0.2]], [[0, 2.4, 0.4], [0, 0.9, -0.3]]] });
const { caja, cil, esfera, capsula, tocable, letrero, scene, mover, M, cuadro } = W;

// ------------------------------------------------------------------ módulo de lavado
const piso = new THREE.Mesh(new THREE.PlaneGeometry(6, 5), M(0xCFD8DF)); piso.rotation.x = -Math.PI / 2; scene.add(piso);
caja(6, 3, 0.1, 0xF5F8FA, 0, 1.5, -0.8);
const azulejo = caja(2.4, 1.0, 0.02, 0xE3F1F6, 0, 1.3, -0.74);
const mueble = caja(1.2, 0.85, 0.55, 0xE2E8ED, 0, 0.42, -0.5); tocable(mueble, 'lavabo', 0.6);
caja(1.2, 0.08, 0.6, 0xFFFFFF, 0, 0.88, -0.48);
const tarja = cil(0.32, 0.08, 0xDDE5EA, 0, 0.9, -0.45);
const llave = new THREE.Group(); llave.position.set(0, 0.92, -0.72); scene.add(llave);
cil(0.025, 0.28, 0xB0BEC5, 0, 0.14, 0, llave); const pico = caja(0.04, 0.04, 0.2, 0xB0BEC5, 0, 0.27, 0.09, llave);
const maneral = caja(0.16, 0.035, 0.05, 0xC62828, 0, 0.3, -0.02, llave); tocable(maneral, 'llave', 0.3);
const chorro = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.018, 0.33, 12), new THREE.MeshStandardMaterial({ color: 0x7FC8F8, transparent: true, opacity: .75 }));
chorro.position.set(0, 1.01, -0.53); chorro.visible = false; scene.add(chorro); tocable(chorro, 'chorro', 0.25);
// jabón líquido, toallas desechables, toalla de tela (distractor), bote, alcohol gel
const jabon = caja(0.11, 0.2, 0.08, 0x3FA7C6, -0.42, 1.25, -0.72); tocable(jabon, 'jabon', 0.3);
const sJ = letrero('JABÓN LÍQUIDO', 0.36, 0.08); sJ.position.set(-0.42, 1.42, -0.7); scene.add(sJ);
const toallero = caja(0.26, 0.28, 0.1, 0xF4F4F4, 0.5, 1.3, -0.72); tocable(toallero, 'toalla', 0.35);
const sT = letrero('TOALLAS DESECHABLES', 0.42, 0.08); sT.position.set(0.5, 1.5, -0.7); scene.add(sT);
const tela = caja(0.3, 0.42, 0.02, 0xC9A27E, 0.95, 1.15, -0.72); tocable(tela, 'tela', 0.35);
const sTe = letrero('TOALLA DE TELA', 0.36, 0.08, '#8A6A4F'); sTe.position.set(0.95, 1.42, -0.7); scene.add(sTe);
const bote = cil(0.13, 0.36, 0x5B6B7C, 0.85, 0.18, -0.2, scene, 0.15); tocable(bote, 'bote', 0.4);
const gel = caja(0.1, 0.18, 0.08, 0x154F90, -0.85, 1.2, -0.72); tocable(gel, 'gel', 0.3);
const sG = letrero('ALCOHOL GEL', 0.32, 0.08); sG.position.set(-0.85, 1.36, -0.7); scene.add(sG);

// ------------------------------------------------------------------ manos (modelo simple articulado)
const piel = 0xE0B48F;
function mano(lado) {
  const g = new THREE.Group();
  const palma = caja(0.085, 0.025, 0.1, piel, 0, 0, 0, g);
  [-0.03, -0.01, 0.01, 0.03].forEach((x, i) => { const d = capsula(0.009, 0.05 + (i === 1 || i === 2 ? 0.01 : 0), piel); d.rotation.x = Math.PI / 2; d.position.set(x, 0, -0.085); g.add(d); });
  const pul = capsula(0.011, 0.04, piel); pul.rotation.set(Math.PI / 2, 0, lado * 0.8); pul.position.set(lado * 0.05, 0, -0.02); g.add(pul);
  const muneca = capsula(0.03, 0.12, piel); muneca.rotation.x = Math.PI / 2; muneca.position.set(0, 0, 0.11); g.add(muneca);
  return g;
}
const manoI = mano(1), manoD = mano(-1);
const BASE_I = new THREE.Vector3(-0.1, 1.05, -0.4), BASE_D = new THREE.Vector3(0.1, 1.08, -0.4);
manoI.position.copy(BASE_I); manoD.position.copy(BASE_D); manoI.rotation.z = 0.25; manoD.rotation.z = -0.25; manoI.scale.setScalar(1.7); manoD.scale.setScalar(1.7); scene.add(manoI, manoD);
// anillo (dorado con piedra roja) en el dedo anular de la mano izquierda y reloj en la muñeca derecha: rodean el dedo y la
// muñeca (antes estaban acostados y casi no se distinguían). Un halo amarillo parpadea mientras hay que quitarlos.
const anillo = new THREE.Group(); anillo.position.set(-0.01, 0.0, -0.072); manoI.add(anillo);
const aro = new THREE.Mesh(new THREE.TorusGeometry(0.0125, 0.0045, 10, 24), M(0xFFC93C, { metalness: 0.9, roughness: 0.25, emissive: 0x6B4E00 })); anillo.add(aro);
const piedra = new THREE.Mesh(new THREE.OctahedronGeometry(0.007), M(0xE53935, { metalness: 0.2, roughness: 0.1, emissive: 0x7A0000 })); piedra.position.y = 0.017; anillo.add(piedra);
tocable(aro, 'anillo', 0.12);
const reloj = new THREE.Group(); reloj.position.set(0, 0, 0.1); manoD.add(reloj);
const correa = new THREE.Mesh(new THREE.TorusGeometry(0.034, 0.008, 8, 28), M(0x263238)); reloj.add(correa);
const caratula = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.01, 24), M(0xCFD8DC, { metalness: 0.8, roughness: 0.3 })); caratula.position.y = 0.04; reloj.add(caratula);
const vidrio = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.002, 24), M(0x1E88E5, { emissive: 0x0D47A1 })); vidrio.position.y = 0.046; reloj.add(vidrio);
tocable(correa, 'reloj', 0.13);
const halo = (obj, r) => { const h = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), new THREE.MeshBasicMaterial({ color: 0xFFEB3B, transparent: true, opacity: 0.35, depthWrite: false })); obj.add(h); return h; };
const haloA = halo(anillo, 0.03), haloR = halo(reloj, 0.055);
cuadro.push(t => { const o = 0.15 + 0.3 * Math.abs(Math.sin(t * 4)); haloA.material.opacity = o; haloR.material.opacity = o; });
const espuma = []; for (let i = 0; i < 18; i++) { const e = esfera(0.012 + Math.random() * 0.01, 0xFFFFFF, 0, 0, 0); e.visible = false; e.userData.off = new THREE.Vector3((Math.random() - .5) * 0.12, 0.02 + Math.random() * 0.02, (Math.random() - .5) * 0.14); espuma.push(e); }
const brillo = []; for (let i = 0; i < 10; i++) { const e = esfera(0.008, 0xB8E4F2, 0, 0, 0); e.material.transparent = true; e.material.opacity = .8; e.visible = false; e.userData.off = new THREE.Vector3((Math.random() - .5) * 0.1, 0.025, (Math.random() - .5) * 0.12); brillo.push(e); }
const papel = caja(0.12, 0.004, 0.16, 0xFAFAFA, 0, 0, 0); papel.visible = false;   // toalla desechable en la mano

// ------------------------------------------------------------------ manos que hacen cada paso (14/10/2026)
// pose(): destino de cada mano {p:[x,y,z], r:[rx,ry,rz]}; en cada cuadro las manos se acercan suavemente al destino.
const DEST = { I: { p: BASE_I.clone(), r: new THREE.Euler(0, 0, 0.25) }, D: { p: BASE_D.clone(), r: new THREE.Euler(0, 0, -0.25) } };
const pose = (lado, p, r) => { const d = DEST[lado]; d.p.set(...p); d.r.set(...(r || [0, 0, lado === 'I' ? 0.25 : -0.25])); };
let modo = null;
const C = new THREE.Vector3(0, 1.06, -0.42);   // centro del frotado, sobre la tarja
cuadro.push(t => {
  const s = Math.sin(t * 9), c = Math.cos(t * 9), sl = Math.sin(t * 2.1) > 0;   // sl: alterna la mano de arriba («y viceversa»)
  if (modo === 1) { pose('I', [C.x - 0.03, C.y, C.z - s * 0.03], [0, 0, 1.45]); pose('D', [C.x + 0.03, C.y, C.z + s * 0.03], [0, 0, -1.45]); }
  if (modo === 2) { const a = sl ? 'I' : 'D', b = sl ? 'D' : 'I'; pose(a, [C.x, C.y, C.z], [0, 0, 0]); pose(b, [C.x + (sl ? 0.01 : -0.01), C.y + 0.04, C.z + 0.01 + s * 0.03], [0, sl ? 0.25 : -0.25, 0]); }
  if (modo === 3) { pose('I', [C.x - 0.026 + s * 0.008, C.y, C.z - 0.02], [0, 0.25, 1.45]); pose('D', [C.x + 0.026 - s * 0.008, C.y, C.z - 0.02], [0, -0.25, -1.45]); }
  if (modo === 4) { pose('I', [C.x - 0.02, C.y - 0.01, C.z], [0, 0, Math.PI]); pose('D', [C.x + 0.01 + s * 0.02, C.y + 0.035, C.z - 0.03], [0.9, Math.PI / 2, 0]); }
  if (modo === 5) { const a = sl ? 'I' : 'D', b = sl ? 'D' : 'I'; pose(a, [C.x + (sl ? -0.03 : 0.03), C.y, C.z], [0, 0, sl ? 1.4 : -1.4]); pose(b, [C.x + (sl ? 0.02 : -0.02) + c * 0.012, C.y + 0.02 + s * 0.012, C.z - 0.02], [s * 0.5, 0, sl ? -1.2 : 1.2]); }
  if (modo === 6) { const a = sl ? 'I' : 'D', b = sl ? 'D' : 'I'; pose(a, [C.x + (sl ? -0.02 : 0.02), C.y - 0.01, C.z], [0, 0, Math.PI]); pose(b, [C.x + (sl ? -0.02 : 0.02) + c * 0.018, C.y + 0.05, C.z - 0.01 + s * 0.018], [-1.0, 0, 0]); }
  if (modo === 'frotar') { pose('I', [C.x - 0.03, C.y, C.z - s * 0.02], [0, 0, 1.45]); pose('D', [C.x + 0.03, C.y, C.z + s * 0.02], [0, 0, -1.45]); }
  if (modo === 'agua') { pose('I', [-0.04, 0.99 + s * 0.008, -0.53], [0, 0, 1.2]); pose('D', [0.04, 0.99 - s * 0.008, -0.53], [0, 0, -1.2]); }
  if (modo === 'secar') { pose('I', [C.x - 0.03, C.y + 0.02, C.z + 0.08], [0, 0, 1.45]); pose('D', [C.x + 0.03, C.y + 0.02, C.z + 0.08 + s * 0.04], [0, 0, -1.45]); }
  [['I', manoI], ['D', manoD]].forEach(([l, m]) => { const d = DEST[l]; m.position.lerp(d.p, 0.25); m.rotation.x += (d.r.x - m.rotation.x) * 0.25; m.rotation.y += (d.r.y - m.rotation.y) * 0.25; m.rotation.z += (d.r.z - m.rotation.z) * 0.25; });
  const centro = manoI.position.clone().lerp(manoD.position, 0.5);
  espuma.forEach((e, i) => { if (e.visible) e.position.copy(centro).add(e.userData.off).setY(centro.y + e.userData.off.y + Math.abs(Math.sin(t * 6 + i)) * 0.015); });
  brillo.forEach(e => { if (e.visible) e.position.copy(centro).add(e.userData.off); });
});
function reposo() { modo = null; pose('I', BASE_I.toArray()); pose('D', BASE_D.toArray()); }
const A = W.animar, esperar = W.esperar;
// mueve una mano a un punto (las dos si se pide) y espera a que llegue
async function llevar(lado, p, r, ms = 650) { modo = null; pose(lado, p, r); await esperar(ms); }
async function animarPaso(nombre) {
  W.botones([]);
  if (nombre === 'mojar') { modo = 'agua'; await esperar(1600); modo = null; }
  if (nombre === 'jabon') { await llevar('D', [-0.42, 1.2, -0.6], [0.6, 0, 0], 700); await A(300, k => { jabon.scale.y = 1 - 0.15 * Math.sin(k * Math.PI); }); pose('I', [-0.4, 1.06, -0.55], [0, 0, 0]); await esperar(500);
    espuma.forEach(e => e.visible = true); reposo(); modo = 'frotar'; await esperar(1200); modo = null; }
  if (nombre === 'enjuagar') { modo = 'agua'; for (let i = 0; i < 6; i++) { await esperar(300); espuma.slice(i * 3, i * 3 + 3).forEach(e => e.visible = false); } espuma.forEach(e => e.visible = false); brillo.forEach(e => e.visible = true); await esperar(400); modo = null; reposo(); }
  if (nombre === 'secar') { await llevar('D', [0.5, 1.2, -0.6], [0.4, 0, 0], 700); papel.visible = true; manoD.add(papel); papel.position.set(0, -0.02, -0.02); reposo(); await esperar(500);
    modo = 'secar'; await esperar(1500); brillo.forEach(e => e.visible = false); modo = null; reposo(); }
  if (nombre === 'cerrar') { await llevar('D', [0, 1.2, -0.68], [0.5, 0, 0], 800); await A(500, k => { maneral.rotation.y = -k * Math.PI / 2; }); chorro.visible = false; await esperar(300); reposo(); }
  if (nombre === 'tirar') { await llevar('D', [0.85, 0.55, -0.2], [0.8, 0, 0], 900); papel.visible = false; manoD.remove(papel); await esperar(300); reposo(); }
  if (nombre === 'gel') { pose('I', [-0.82, 1.03, -0.62], [0, 0, 0]); await llevar('D', [-0.85, 1.15, -0.62], [0.6, 0, 0], 700); await A(300, k => { gel.scale.y = 1 - 0.15 * Math.sin(k * Math.PI); });
    brillo.forEach(e => e.visible = true); reposo(); await esperar(500); }
  if (nombre === 'secarAire') { modo = 'frotar'; await esperar(1800); brillo.forEach(e => e.visible = false); modo = null; reposo(); await esperar(400); }
}
// quitar alhajas: el anillo se desliza fuera del dedo y el reloj se abre y se guarda
async function quitar(obj) { const z0 = obj.position.z, y0 = obj.position.y;
  if (obj === anillo) await A(700, k => { anillo.position.z = z0 - 0.07 * k; anillo.position.y = y0 + 0.02 * k; });
  else await A(600, k => { reloj.position.z = z0 + 0.06 * k; reloj.rotation.z = k * 0.6; });
  obj.visible = false; obj.position.z = z0; obj.position.y = y0; obj.rotation.z = 0; }

// ------------------------------------------------------------------ utilidades de pasos
const MOVS = [['Palma con palma', 1], ['Palma derecha sobre dorso izquierdo con dedos entrelazados (y viceversa)', 2], ['Palma con palma con los dedos entrelazados', 3],
  ['Dorso de los dedos contra la palma opuesta, dedos unidos', 4], ['Pulgar izquierdo atrapado en la palma derecha, en rotación (y viceversa)', 5], ['Yemas de los dedos en rotación sobre la palma opuesta (y viceversa)', 6]];
let segTecnica = 0;
function chip() { W.$('pTxt').innerHTML = W.$('pTxt').innerHTML.replace(/<div class="cron".*<\/div>/, '') + `<div class="cron">⏱ ${segTecnica} s</div>`; }
function pasoOrdenar(titulo, porMov, fuente) {
  let k = 0, errores = 0;
  return { titulo, fuente, puntos: 30, texto: 'Toca los movimientos <b>en el orden correcto</b>. Cada acierto anima tus manos.',
    iniciar() {
      const orden = [...MOVS].sort(() => Math.random() - .5);
      const dibujar = () => W.botones(orden.map(([txt, n]) => [`${txt}`, () => {
        if (n !== k + 1) { errores++; W.mal(`Ese no es el movimiento ${k + 1}. Revisa el orden de la técnica.`, fuente); return; }
        k++; modo = n; segTecnica += porMov; chip(); W.toast('ok', `✅ Movimiento ${k}: ${txt}`, '', 1500);
        orden.splice(orden.findIndex(x => x[1] === n), 1); dibujar();
        if (k === 6) { setTimeout(() => { reposo(); W.estado().pts += errores ? 10 : 30; W.siguiente(); }, 1800); }
      }, 'sec']));
      chip(); dibujar();
    } };
}
function pasoTocar({ titulo, texto, fuente, ok, mal = {}, critico = [], alHacer, puntos }) {
  return { titulo, texto, fuente, puntos,
    iniciar() { W.resaltar(ok.map(t => OBJ[t]).filter(Boolean)); },
    tocar(o) { const t = o.userData.tipo;
      if (ok.includes(t)) { if (this._hecho) return; this._hecho = true; W.resaltar([]); W.bien(this.bienTxt || 'Correcto.', fuente); Promise.resolve(alHacer && alHacer(t)).then(() => { this._hecho = false; W.siguiente(); }); return; }
      if (mal[t]) W.mal(mal[t][0], mal[t][1] || fuente, critico.includes(t)); } };
}
const OBJ = { llave: maneral, jabon, toalla: toallero, tela, bote, gel, chorro, lavabo: mueble, anillo: aro, reloj: correa };

// ------------------------------------------------------------------ caso 1: agua y jabón [FICTICIO]
const AGUA = () => [
  { titulo: 'La situación', texto: 'Acabas de apoyar en una curación y tienes sangre visible en las manos.', sinPuntos: true,
    iniciar() { W.aviso('<h2>🩸 Caso 1: agua y jabón</h2><p>Apoyaste en una curación y quedó <b>sangre visible</b> en tus manos.</p><p>Vas a realizar la técnica completa en el lavabo. Toca los objetos que brillan.</p><p class="ficticio">[FICTICIO – ejercicio didáctico]</p>', () => W.siguiente(), 'Comenzar'); } },
  { titulo: 'Prepara tus manos', texto: 'Antes de iniciar, retira lo que impide una buena técnica: toca el <b>anillo</b> y el <b>reloj</b>, luego <b>Listo</b>.', fuente: F.alhajas,
    iniciar() { W.resaltar([aro, correa]); W.botones([['Listo ✓', () => { if (anillo.visible || reloj.visible) return W.mal('Aún traes alhajas o reloj: impiden frotar toda la superficie.', F.alhajas); W.bien('Manos y muñecas libres.', F.alhajas); W.siguiente(); }]]); },
    async tocar(o) { const g = (o === aro || o === anillo) ? anillo : (o === correa || o === reloj) ? reloj : null; if (g && (g === anillo || g === reloj) && g.visible && !g.userData.quitando) { g.userData.quitando = true; await quitar(g); g.userData.quitando = false; W.resaltar([[aro, anillo], [correa, reloj]].filter(x => x[1].visible).map(x => x[0])); W.toast('ok', g === anillo ? '💍 Anillo retirado' : '⌚ Reloj retirado', '', 1200); } } },
  { titulo: '¿Qué método usas?', texto: 'Con sangre visible en las manos, ¿vas al <b>lavabo</b> (abre la llave) o al <b>alcohol gel</b>?', fuente: F.nom3,
    iniciar() { W.resaltar([maneral, gel]); },
    tocar(o) { const t = o.userData.tipo;
      if (t === 'gel') return W.mal('Con sangre o líquidos corporales, el alcohol gel no es suficiente: agua y jabón.', F.nom3, true);
      if (t === 'llave') { chorro.visible = true; W.resaltar([]); W.bien('Agua corriente: abre la llave y moja tus manos (paso 0).', F.nom1); segTecnica = 3; animarPaso('mojar').then(() => W.siguiente()); } } },
  pasoTocar({ titulo: 'Aplica jabón', texto: 'Toca el dispensador de <b>jabón líquido</b> (cantidad suficiente para cubrir todas las superficies).', fuente: F.oms, ok: ['jabon'],
    mal: { gel: ['Estás lavando con agua y jabón: no mezcles con alcohol gel en este momento.', 'Texto AESP DOF 08/09/2017, AE5B'] }, alHacer: async () => { segTecnica += 3; await animarPaso('jabon'); } }),
  pasoOrdenar('Frota: los 6 movimientos', 6, F.oms),
  { titulo: 'Enjuaga', texto: 'Toca el <b>chorro de agua</b> para enjuagar tus manos.', fuente: F.oms,
    iniciar() { W.resaltar([chorro]); },
    tocar(o) { if (o === chorro && !this._h) { this._h = true; segTecnica += 6; chip(); W.bien('Manos enjuagadas.', F.oms); animarPaso('enjuagar').then(() => { this._h = false; W.siguiente(); }); } } },
  pasoTocar({ titulo: 'Seca tus manos', texto: '¿Con qué te secas? Toca la opción correcta.', fuente: F.nom1, ok: ['toalla'],
    mal: { tela: ['La toalla de tela compartida recontamina: la NOM pide toallas desechables.', F.nom1], chorro: ['Primero sécate.'] }, alHacer: async () => { segTecnica += 5; await animarPaso('secar'); } }),
  { titulo: 'Cierra la llave', texto: 'El agua sigue corriendo.', fuente: F.oms,
    iniciar() { W.pregunta('¿Cómo cierras la llave?', ['Con la mano recién lavada', 'Con la misma toalla desechable con la que me sequé', 'La dejo abierta para el siguiente'], [1], F.oms,
      async () => { segTecnica += 2; chip(); await animarPaso('cerrar'); W.siguiente(); }, false, 'Paso 10 de la OMS: usar la toalla para cerrar la llave.'); } },
  pasoTocar({ titulo: 'Desecha la toalla', texto: 'Toca el <b>bote de basura</b> para tirar la toalla.', fuente: 'PROY-NOM-045-SSA-2026, 10.7.8 (proyecto): módulo con bote de basura con bolsa', ok: ['bote'], alHacer: () => animarPaso('tirar') }),
  { titulo: 'Tiempo total', texto: '', fuente: F.oms,
    iniciar() { W.$('pTxt').innerHTML = `Tu técnica simulada duró <b>${segTecnica} s</b>.`;
      W.pregunta('Según la OMS, el lavado con agua y jabón completo debe durar:', ['10 a 20 segundos', '20 a 30 segundos', '40 a 60 segundos', '2 a 3 minutos'], [2], F.oms, () => W.siguiente(), false, '40 a 60 segundos.'); } },
  { titulo: 'En áreas críticas', texto: 'Una pregunta más.', fuente: F.nom2,
    iniciar() { W.pregunta('En terapia intensiva, urgencias y aislados la NOM-045 indica usar:', ['Jabón antiséptico líquido, agua corriente y toallas desechables', 'Jabón de barra compartido', 'Solo agua', 'Toalla de tela'], [0], F.nom2, () => W.siguiente()); } },
];

// ------------------------------------------------------------------ caso 2: alcohol gel [FICTICIO]
const ALCOHOL = () => [
  { titulo: 'La situación', texto: 'Vas de un paciente a otro. Tus manos no tienen suciedad visible.', sinPuntos: true,
    iniciar() { anillo.visible = false; reloj.visible = false; chorro.visible = false; maneral.rotation.y = 0;
      W.aviso('<h2>🧴 Caso 2: fricción con alcohol gel</h2><p>Terminaste con un paciente y vas con el siguiente. <b>Tus manos no tienen suciedad visible</b> ni contacto con sangre o líquidos.</p><p class="ficticio">[FICTICIO – ejercicio didáctico]</p>', () => W.siguiente(), 'Comenzar'); } },
  pasoTocar({ titulo: 'Elige el método', texto: 'Toca lo más práctico para este momento.', fuente: F.nom3, ok: ['gel'],
    mal: { llave: ['También sería válido, pero sin suciedad visible lo más práctico en el punto de atención es el alcohol gel.', F.nom3], tela: ['Eso no es higiene de manos.'] }, alHacer: () => animarPaso('gel') }),
  { titulo: '¿Cuánto producto?', texto: 'El dispensador está listo.', fuente: F.oms,
    iniciar() { W.pregunta('¿Cuánto alcohol gel te aplicas?', ['Unas gotas en la palma', 'Una palma llena (mano en forma de cuenco) que cubra todas las superficies', 'Solo en las yemas'], [1], F.oms, () => { brillo.forEach(e => e.visible = true); segTecnica = 2; W.siguiente(); }, false, 'Una palma llena del producto, cubriendo todas las superficies.'); } },
  pasoOrdenar('Frota: los 6 movimientos', 3, F.oms),
  { titulo: '¿Y después?', texto: 'Terminaste los movimientos.', fuente: F.oms,
    iniciar() { W.pregunta('¿Qué haces al terminar los movimientos?', ['Sigo frotando hasta que las manos estén secas', 'Me seco con toalla de tela', 'Me enjuago con agua', 'Me pongo guantes con las manos mojadas'], [0], F.oms,
      async () => { segTecnica += 6; await animarPaso('secarAire'); W.siguiente(); }, false, 'Frotar hasta que estén secas: "…una vez secas, tus manos son seguras".'); } },
  { titulo: 'Tiempo total', texto: '', fuente: F.oms,
    iniciar() { W.$('pTxt').innerHTML = `Tu fricción simulada duró <b>${segTecnica} s</b>.`;
      W.pregunta('Según la OMS, la fricción con alcohol gel dura:', ['5 segundos', '20 a 30 segundos', '40 a 60 segundos', '2 minutos'], [1], F.oms, () => W.siguiente(), false, '20 a 30 segundos.'); } },
  { titulo: 'El producto correcto', texto: 'Revisa la etiqueta del gel.', fuente: F.nom2,
    iniciar() { W.pregunta('La NOM-045-SSA2-2005 pide que el alcohol para manos sea etílico o isopropílico a una concentración:', ['Mayor al 60%, con emolientes', 'Menor al 30%', 'Cualquiera, si huele a alcohol'], [0], F.nom2, () => W.siguiente()); } },
];

W.inicio([{ id: 'agua', txt: '🩸 <b>Caso 1:</b> Agua y jabón · manos con sangre visible (40-60 s)' },
  { id: 'alc', txt: '🧴 <b>Caso 2:</b> Alcohol gel · entre pacientes, sin suciedad visible (20-30 s)' }],
  id => { anillo.visible = true; reloj.visible = true; maneral.rotation.y = 0; papel.visible = false; manoD.remove(papel); espuma.forEach(e => e.visible = false); brillo.forEach(e => e.visible = false); segTecnica = 0; reposo(); return id === 'agua' ? AGUA() : ALCOHOL(); },
  'Basado en: OMS, cartel "How to handwash / How to handrub" (2006); NOM-045-SSA2-2005 (10.6.1.1-10.6.1.3); PROY-NOM-045-SSA-2026 (proyecto) para alhajas. Casos ficticios con fines didácticos.');

if (location.search.includes('qa')) window.__qa = { OBJ, tocar: W.tocar, estado: W.qa };
</script>
