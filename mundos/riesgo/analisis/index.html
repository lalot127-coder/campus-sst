      caja(2.56, 0.08, 0.2, 0x8C99A6, s.xc + dx, 0.88, z); caja(2.56, 0.08, 0.2, 0x8C99A6, s.xc + dx, 2.02, z); } } }

const KITS = {
  escritorio: [['oficina', 'escritorio'], ['oficina', 'monitor', 0, 0.76, -0.18], ['oficina', 'teclado', 0, 0.76, 0.12], ['oficina', 'silla', 0, 0, 0.75, Math.PI]],
  silla: [['oficina', 'silla']], planta: [['oficina', 'planta']], basurero: [['oficina', 'bote']], mesa: [['oficina', 'mesa', 0, 0, 0, 0, 0.7]],
  anaquel: [['oficina', 'librero_abierto'], ['oficina', 'caja', 0.2, 1.9, 0], ['oficina', 'caja', -0.18, 1.9, 0.04]],

  estufa: [['oficina', 'estufa']], lavamanos: [['oficina', 'lavabo']], tambo: [['extintores-fuego', 'tambo']], extintor: [['extintores-fuego', 'extintor_a']],
  extintor_obstruido: [['extintores-fuego', 'extintor_a'], ['oficina', 'caja', -0.45, 0, 0.4], ['oficina', 'caja', 0, 0, 0.45], ['oficina', 'caja', 0.45, 0, 0.4], ['oficina', 'caja', 0, 0.4, 0.45]],
  tablero: [['seguridad-electrica', 'tablero']], prensa: [['loto', 'maquina', 0, 0, 0, 0, 0.75]], guarda: [['loto', 'maquina', 0, 0, 0, 0, 0.75]],
  botiquin: [['primeros-auxilios', 'botiquin_pared', 0, 1.25, 0]], dea: [['primeros-auxilios', 'dea', 0, 1.15, 0]], camilla: [['primeros-auxilios', 'cama']],

  guarda(g) { const m = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.9, 1.0), M(0xF2C94C, { transparent: true, opacity: .5, wireframe: true })); m.position.set(0, 1.0, 0.2); g.add(m); },
  puerta_candado(g) { caja(0.14, 0.16, 0.08, 0xFFC107, 0.32, 1.05, 0.15, g); caja(0.6, 0.14, 0.02, 0x2E7D32, 0, 2.25, 0.13, g); },

  document.querySelectorAll('#hLista .z').forEach(d => d.onclick = () => irASala(d.dataset.z));
  porZona.forEach(({ z, tot, ok }) => { const t = ROT[z.id]; const cv = t.material.map.image, g = cv.getContext('2d'); g.fillStyle = ok === tot ? '#2E7D32' : '#1F6FB2'; g.fillRect(0, 0, cv.width, cv.height);
    g.fillStyle = '#fff'; g.font = `bold ${Math.round(cv.height * 0.55)}px Calibri, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(`${ok === tot ? '✓ ' : ''}${ok} / ${tot} riesgos`, cv.width / 2, cv.height / 2); t.material.map.needsUpdate = true; });
}
$('bHud').onclick = () => { $('hud').classList.toggle('mini'); $('bHud').textContent = $('hud').classList.contains('mini') ? '▴' : '▾'; };
$('bGeneral').onclick = () => { RC.seguir(false); W.irVista(1); };
$('bPista').onclick = () => { const i = salaDe(); const lista = ITEMS.filter(it => it.mk.sala === i && !it.mk.marco.visible);
  if (!lista.length) { W.toast('info', i < 0 ? 'Entra a una sala para usar la pista.' : 'Ya inspeccionaste todo en esta sala.'); return; }
  lista.forEach(it => { it.mk.marco.material.color.set(0x7FB3D5); it.mk.marco.visible = true; }); W.toast('info', `🔍 En esta sala hay ${lista.length} objeto(s) por inspeccionar: decide cuáles son riesgos sin control.`);
  setTimeout(() => lista.forEach(it => { if (!it.mk._visto) { it.mk.marco.visible = false; it.mk.marco.material.color.set(0x1F6FB2); } }), 3500); };

// ------------------------------------------------------------------ pasos
const FREQ = ['A', 'B', 'C', 'D', 'E'], SEVS = ['I', 'II', 'III', 'IV'], NIVELES = ['Grave', 'Elevado', 'Medio', 'Bajo', 'Mínimo'];
const deZona = zona => ({ buenas: zona.riesgos.filter(r => r.real).map(r => ({ tipo: zona.id + ':' + r.id, zona: zona.id, nombre: r.nombre, fb: `${r.tipo}: ${r.fb}`, f: r.f, obj: S[zona.id + ':' + r.id] })),
  malas: zona.riesgos.filter(r => !r.real).map(r => ({ tipo: zona.id + ':' + r.id, zona: zona.id, nombre: r.nombre, fb: r.fb, f: r.f, obj: S[zona.id + ':' + r.id] })) });
// identificación: recorrido por todo el edificio (o por una sala). Al tocar un objeto lejano, el avatar camina hasta él.
function pasoIdentificar(zonas) {
  const buenas = zonas.flatMap(z => deZona(z).buenas), malas = zonas.flatMap(z => deZona(z).malas);
  const una = zonas.length === 1;
  const st = R.encuentra(W, { titulo: una ? `${zonas[0].titulo}: identifica` : 'Recorre el edificio e identifica',
    texto: (una ? zonas[0].escena + '<br>' : `Camina por las ${zonas.length} salas del edificio (toca el piso para moverte). `) + 'Toca los objetos para inspeccionarlos y marca solo los <b>riesgos sin control</b>. Hay más condiciones controladas y objetos inofensivos que riesgos: si marcas uno, pierdes puntos.',
    fuente: 'NOM-030-STPS-2009, 3.12 y 6.1', buenas, malas });
  const ini = st.iniciar, toc = st.tocar;
  st.iniciar = function () { ini.call(this); hud(buenas); if (una) irASala(zonas[0].id); };
  st.tocar = function (o) { const tipo = o.userData.tipo, mk = S[tipo]; if (!mk || !(buenas.concat(malas)).some(x => x.tipo === tipo)) return;
    const c = mk.hit.position, d = Math.hypot(c.x - yo.position.x, c.z - yo.position.z);
    const revisar = () => { yo.rotation.y = Math.atan2(c.x - yo.position.x, c.z - yo.position.z); toc.call(this, o); mk._visto = true; mk.mostrar(true);
      if (buenas.some(x => x.tipo === tipo)) { hallados.add(tipo); hud(buenas); } };
    if (d < 2.4 && salaDe() === mk.sala) return revisar();
    const s = sala(mk.sala), hacia = new THREE.Vector3(s.xc - c.x, 0, s.zc - c.z).normalize();
    caminarA(c.x + hacia.x * 1.3, c.z + hacia.z * 1.3, revisar); };
  return st;
}
function pasosEvaluar(zona) {
  const pr = zona.riesgos.find(r => r.id === zona.principal), ev = zona.evalua, mk = S[zona.id + ':' + pr.id], pasos = [];
  const preparar = async () => { await irASala(zona.id); mk.mostrar(true); mk.aro.visible = true; W.resaltar([mk.aro]); };
  if (ev.metodo) {
    pasos.push({ titulo: `${zona.titulo}: ¿qué método?`, texto: `Riesgo principal: <b>${pr.nombre}</b>.`, fuente: 'RFSST art. 7 fr. I (selector de metodología)',
      async iniciar() { await preparar(); R.decidir(W, ev.metodo.pregunta, ev.metodo.ops, () => W.siguiente(), `Riesgo: <b>${pr.nombre}</b>. Una NOM específica puede fijar su propio método.`); } });
  } else {
    const nv = R.nivel(ev.f, ev.s);
    pasos.push({ titulo: `${zona.titulo}: evalúa`, texto: `Califica el riesgo principal: <b>${pr.nombre}</b>.<br><i>${ev.pista}</i>`, fuente: R.N31, puntos: 30,
      async iniciar() { await preparar();
        const ctx = `<b>${pr.nombre}</b><br><i>${ev.pista}</i> <span class="ficticio">[ejemplo didáctico]</span>`;
        R.decidir(W, '1 · ¿Qué frecuencia de ocurrencia tiene?', FREQ.map(f => ({ t: R.FREC[f], ok: f === ev.f, fb: `Frecuencia ${R.FREC[ev.f]}.`, f: 'NOM-031-STPS-2011, 8.3 a) Tabla 2' })), () =>
          setTimeout(() => R.decidir(W, '2 · ¿Qué severidad del daño puede ocasionar?', SEVS.map(s => ({ t: R.SEV[s], ok: s === ev.s, fb: `Severidad ${R.SEV[ev.s]}.`, f: 'NOM-031-STPS-2011, 8.3 b) Tabla 3' })), () =>
            setTimeout(() => R.decidir(W, `3 · Con ${ev.f} × ${ev.s}, ¿qué nivel indica la matriz?`, NIVELES.map(x => ({ t: x, ok: x === nv, fb: `${ev.f} × ${ev.s} = ${nv}. ${nv === 'Grave' ? 'Se atiende de inmediato.' : 'Se atiende en orden: graves, elevados, medios, bajos y mínimos.'}`, f: 'NOM-031-STPS-2011, 8.3 c) Tabla 4 y 8.3.1' })), () => {
              mk.marco.material.color.set(R.NIVEL_COLOR[nv]); mk.aro.material.color.set(R.NIVEL_COLOR[nv]); W.siguiente(); }, ctx + tablaMatriz(ev.f, ev.s), false), 500), ctx, false), 500), ctx, false); } });
  }
  pasos.push({ titulo: `${zona.titulo}: controla`, texto: `Elige la medida más efectiva para <b>${pr.nombre}</b>.`, fuente: 'NOM-017-STPS-2024, 5.2; NIOSH (referencia)',
    iniciar() { mk.aro.visible = true; W.resaltar([mk.aro]); R.decidir(W, '¿Cuál es la medida MÁS efectiva?', zona.control, () => W.siguiente(), `Riesgo: <b>${pr.nombre}</b>. Recuerda: eliminación → sustitución → ingeniería → administrativos → EPP.`); } });
  return pasos;
}
function tablaMatriz(f, s) {
  const col = { Grave: '#B03A2E', Elevado: '#E67E22', Medio: '#F2C94C', Bajo: '#A5D6A7', 'Mínimo': '#2E7D32' };
  return `<table style="margin-top:8px;font-size:.8rem;text-align:center"><tr><th></th>${SEVS.map(x => `<th>${x}</th>`).join('')}</tr>${['E', 'D', 'C', 'B', 'A'].map(fr => `<tr><th>${fr}</th>${SEVS.map((x, j) => {
    const v = R.MATRIZ[fr][j]; return `<td style="background:${col[v]};color:${['Grave', 'Elevado', 'Mínimo'].includes(v) ? '#fff' : '#1F2433'};${fr === f || x === s ? 'outline:2px solid #14213D' : ''}">${fr === f && x === s ? '?' : v}</td>`; }).join('')}</tr>`).join('')}</table>
    <p class="ficticio">Matriz NOM-031-STPS-2011, Tabla 4 (la celda "?" es la tuya).</p>`;
}
const intro = R.intro(W, `<h2>🔎 Análisis de riesgo · ${ED.nombre}</h2><p>Recorre el edificio en 3D: <b>toca el piso</b> para caminar y <b>toca los objetos</b> para inspeccionarlos. Los riesgos están repartidos en las ${n} sala${n > 1 ? 's' : ''}. <b>1)</b> Identifica los riesgos sin control, <b>2)</b> evalúa el principal de cada sala con la matriz de la NOM-031-STPS-2011 o con el método que exige su NOM y <b>3)</b> elige el control más efectivo.</p><p>Usa <b>🔍 Pista</b> si no encuentras qué inspeccionar y <b>🗺️ Plano</b> para ver todo el edificio.</p><p class="ficticio">La matriz NOM-031 es obligatoria en construcción; aquí se usa como método de referencia validado en una NOM.</p>`,
  `${ED.nombre} del campus. Escenas, frecuencias y severidades de ejemplo.`);
const casos = [{ id: '*', txt: `🏢 <b>Recorrido completo:</b> ${n} sala${n > 1 ? 's' : ''} del edificio` }].concat(n > 1 ? Z.map(z => ({ id: z.id, txt: `📍 <b>Sala:</b> ${z.titulo}` })) : []);
W.inicio(casos, id => { const zs = id === '*' ? Z : Z.filter(z => z.id === id); hallados.clear(); return [intro, pasoIdentificar(zs), ...zs.flatMap(pasosEvaluar)]; },
  `Basado en: RFSST (DOF 13/11/2014) art. 7 fr. I; NOM-030-STPS-2009 3.12 y 6.1; NOM-031-STPS-2011 8.3; NOM-017-STPS-2024 5.1-5.2; NOM específicas citadas en cada riesgo; jerarquía de controles NIOSH (referencia). Catálogo ${window.CATALOGO_RIESGOS.version}. Modelos 3D: Kenney y Poly Pizza (CC0/CC-BY, ver Créditos). 🥽 En visor: botón VR.`);
W.activarXR({ inicio: [X0 + 1.2, 0], piso: suelo, entorno: [] });
if (Q.has('qa')) window.__qa = { W, S, ED, ITEMS, yo, caminarA, irASala, tocar: W.tocar, estado: W.qa, hallados };
</script>
