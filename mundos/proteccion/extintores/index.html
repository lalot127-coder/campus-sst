<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Fuentes verificadas (registro_fuentes.md, consulta 03/10/2026): NOM-002-STPS-2010 4.11 (clases de fuego), 7.2 (revisión:
// sello, manómetro en verde, capacidad de CO2, instrucciones en la etiqueta), 8.1 c) (alertamiento), 4.19 (mantenimiento y
// recarga), Guía de Referencia VII: Tabla VII.1 (agente por clase), Tabla VII.2 (PQS alcance mínimo 3.0 m), VII.3.2 (CO2

const W = MotorSim.crearMundo(THREE, OrbitControls, { titulo: 'Uso de extintores: fuego virtual', icono: '🧯', clave: 'pc_extintores',
  criterio: { pct: 80, sinCriticos: true }, fondo: 0xDCE6EE, xr: false,   // VR propia (paso 7: extintor en la mano)
 
  vistas: [[[0, 2.4, 4.6], [0, 0.8, -2.4]], [[-1.0, 1.7, 1.6], [-3.1, 0.9, 0.2]], [[1.4, 1.8, 1.4], [3.4, 1.3, -0.6]], [[0, 5.5, 1.8], [0, 0, -2]]] });
const { scene, camera, controls, renderer, caja, cil, esfera, tocable, letrero, M } = W;
renderer.xr.enabled = true;
const $ = s => document.getElementById(s);
const F26 = 'NOM-002-STPS-2010', T71 = `${F26}, Guía de Referencia VII, Tabla VII.1`;

// ------------------------------------------------------------------ entorno (se oculta en realidad mixta)
const entorno = new THREE.Group(); scene.add(entorno);
const piso = new THREE.Mesh(new THREE.PlaneGeometry(8, 10), M(0xB9BEC4)); piso.rotation.x = -Math.PI / 2; piso.position.z = -1; entorno.add(piso);
caja(8, 3.2, 0.1, 0xEEF1F4, 0, 1.6, -6, entorno); caja(0.1, 3.2, 10, 0xE6EAEE, -4, 1.6, -1, entorno); caja(0.1, 3.2, 10, 0xE6EAEE, 4, 1.6, -1, entorno);
for (let z = -5; z <= 3; z += 2) { const l = new THREE.Mesh(new THREE.PlaneGeometry(8, 0.08), M(0xF2C230)); l.rotation.x = -Math.PI / 2; l.position.set(0, 0.005, z); entorno.add(l); }
const tx = id => { const t = new THREE.CanvasTexture(Senales.canvas(id, 256)); t.colorSpace = THREE.SRGBColorSpace; return t; };
const senal = (id, w, x, y, z, ry) => { const cv = Senales.canvas(id, 256); const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w * cv.height / cv.width), new THREE.MeshBasicMaterial({ map: tx(id), transparent: true })); m.position.set(x, y, z); m.rotation.y = ry; entorno.add(m); return m; };
senal('extintor', 0.55, -3.94, 2.1, 0.2, Math.PI / 2); senal('alarma', 0.45, 3.94, 2.05, -0.6, -Math.PI / 2); senal('salida', 1.0, 0, 2.6, -5.94, 0); senal('ruta', 0.8, -3.94, 1.6, -3.5, Math.PI / 2);
const tit = letrero('ÁREA DE PRÁCTICA · USO DE EXTINTORES', 3.4, 0.3, '#B71C1C'); tit.position.set(0, 2.95, -5.94); entorno.add(tit);
// botón de alarma (pared derecha)
const alarma = caja(0.12, 0.3, 0.24, 0xD3122A, 3.92, 1.35, -0.6, entorno); tocable(alarma, 'alarma', 0.5);
const luzAlarma = new THREE.PointLight(0xff2222, 0, 6); luzAlarma.position.set(3.4, 2.6, -0.6); scene.add(luzAlarma);

// ------------------------------------------------------------------ extintores (estante pared izquierda)
const AGENTES = {
  agua: { nombre: 'Agua', color: 0xC62828, chorro: 0x4FC3F7, clases: ['A'], alcance: 'hasta 9 m (agua hasta 10 L)', fAlc: `${F26}, Guía VII, Tabla VII.3`, mano: true, dist: 3 },
  pqs: { nombre: 'Polvo químico seco ABC', color: 0xC62828, chorro: 0xFFF8E1, clases: ['A', 'B', 'C'], alcance: 'alcance mínimo 3.0 m (4.5 a 27.2 kg)', fAlc: `${F26}, Guía VII, Tabla VII.2`, mano: true, dist: 3 },
  co2: { nombre: 'Bióxido de carbono (CO2)', color: 0xC62828, chorro: 0xFFFFFF, clases: ['B', 'C'], alcance: 'de 1 a 2.5 m; no usar al aire libre ni con corrientes de aire', fAlc: `${F26}, Guía VII, VII.3.2`, mano: false, dist: 2 },
  k: { nombre: 'Químico húmedo (clase K)', color: 0xB0BEC5, chorro: 0xE0F7FA, clases: ['A', 'B', 'K'], alcance: 'el que indica su etiqueta', fAlc: `${F26}, 7.2 l) 3)`, mano: true, dist: 2.5 },
};
function modeloExtintor(tipo, conEtiqueta = true) {
  const a = AGENTES[tipo], g = new THREE.Group();
  const cuerpo = cil(0.11, 0.52, a.color, 0, 0.3, 0, g); cil(0.115, 0.04, 0x222222, 0, 0.04, 0, g);
  const dom = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), M(a.color)); dom.position.y = 0.56; g.add(dom);
  cil(0.03, 0.08, 0x37474F, 0, 0.68, 0, g); caja(0.16, 0.02, 0.04, 0x263238, 0.04, 0.73, 0, g);   // válvula y palanca
  const seguro = new THREE.Mesh(new THREE.TorusGeometry(0.025, 0.007, 6, 16), M(0xFDD835)); seguro.position.set(-0.04, 0.7, 0.03); g.add(seguro);
  let mano = null; if (a.mano) { mano = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.012, 20), M(0xffffff)); mano.rotation.x = Math.PI / 2; mano.position.set(0.05, 0.66, 0.05); g.add(mano);
    const ag = new THREE.Mesh(new THREE.PlaneGeometry(0.04, 0.04), new THREE.MeshBasicMaterial({ map: (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, 64, 64); x.lineWidth = 10; x.strokeStyle = '#C62828'; x.beginPath(); x.arc(32, 32, 24, Math.PI * .75, Math.PI * 1.2); x.stroke(); x.strokeStyle = '#2E7D32'; x.beginPath(); x.arc(32, 32, 24, Math.PI * 1.2, Math.PI * 1.9); x.stroke();
      x.strokeStyle = '#111'; x.lineWidth = 4; x.beginPath(); x.moveTo(32, 32); x.lineTo(46, 14); x.stroke(); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })() }));
    ag.position.set(0.05, 0.66, 0.057); g.add(ag); }
  const boq = tipo === 'co2' ? new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.16, 16, 1, true), M(0x111111, { side: THREE.DoubleSide })) : new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.018, 0.1, 10), M(0x111111));
  const manguera = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0.66, 0), new THREE.Vector3(0.12, 0.55, 0.02), new THREE.Vector3(0.14, 0.3, 0.05)]), 12, 0.012, 6), M(0x111111)); g.add(manguera);
  boq.position.set(0.14, 0.22, 0.05); boq.rotation.x = Math.PI; g.add(boq);
  if (conEtiqueta) { const e = letrero(a.nombre.split(' (')[0].toUpperCase(), 0.5, 0.11, '#FFFFFF', '#B71C1C'); e.position.set(0, 1.0, 0.0); g.add(e); }
  return { g, cuerpo, seguro, mano };
}
const RACK = {}; const ordenRack = ['agua', 'pqs', 'co2', 'k'];
caja(0.35, 0.06, 2.6, 0x5B6B7C, -3.75, 0.5, 0.3, entorno);
ordenRack.forEach((t, i) => { const m = modeloExtintor(t); m.g.position.set(-3.7, 0.53, -0.6 + i * 0.62); m.g.rotation.y = Math.PI / 2; entorno.add(m.g); tocable(m.cuerpo, 'ext_' + t, 0.45); RACK[t] = m; });

// ------------------------------------------------------------------ escenarios de fuego [FICTICIOS]
const CASOS = {
  A: { txt: '📦 <b>Clase A:</b> cajas de cartón y tarimas de madera en el almacén', clase: 'A', base: 0.55, radio: 0.6, alto: 1.4,
    def: 'material combustible sólido, generalmente de naturaleza orgánica, que forma brasas' },
  B: { txt: '🛢️ <b>Clase B:</b> charola con disolvente derramado en el taller', clase: 'B', base: 0.08, radio: 0.65, alto: 1.3,
    def: 'líquidos combustibles e inflamables y gases inflamables' },
  C: { txt: '⚡ <b>Clase C:</b> tablero eléctrico energizado', clase: 'C', base: 0.7, radio: 0.4, alto: 1.0,
    def: 'aparatos, equipos e instalaciones eléctricas energizadas' },
  K: { txt: '🍟 <b>Clase K:</b> freidora con aceite en la cocina del comedor', clase: 'K', base: 1.0, radio: 0.38, alto: 1.0,
    def: 'instalaciones de cocina con aceites y grasas vegetales o animales' },
};
const FUEGO_Z = -3, objetos = new THREE.Group(); scene.add(objetos);
function armarEscenario(c) {
  objetos.clear();
  if (c === 'A') { caja(1.2, 0.14, 1.0, 0x8B6B4A, 0, 0.07, FUEGO_Z, objetos); [[-.3, -.2], [.3, -.2], [0, .25], [-.25, .25]].forEach(([x, z], i) => caja(0.5, 0.45, 0.42, 0xB98D5A, x, 0.37 + (i > 2 ? 0.45 : 0), FUEGO_Z + z, objetos)); }
  if (c === 'B') { caja(1.3, 0.08, 0.9, 0x78909C, 0, 0.04, FUEGO_Z, objetos); const l = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.8), M(0x5D4037, { roughness: .1 })); l.rotation.x = -Math.PI / 2; l.position.set(0, 0.085, FUEGO_Z); objetos.add(l);
    cil(0.16, 0.45, 0x1565C0, 0.9, 0.22, FUEGO_Z + 0.4, objetos); }
  if (c === 'C') { caja(0.9, 1.6, 0.4, 0x90A4AE, 0, 0.8, FUEGO_Z - 0.2, objetos); caja(0.7, 0.9, 0.02, 0x546E7A, 0, 1.0, FUEGO_Z + 0.01, objetos);
    const s = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.27), new THREE.MeshBasicMaterial({ map: tx('electrico'), transparent: true })); s.position.set(0, 1.45, FUEGO_Z + 0.03); objetos.add(s);
    cil(0.03, 1.2, 0x212121, 0.35, 2.2, FUEGO_Z - 0.2, objetos); }
  if (c === 'K') { caja(1.6, 0.9, 0.7, 0xB0BEC5, 0, 0.45, FUEGO_Z, objetos); caja(0.6, 0.25, 0.45, 0x78909C, 0, 1.0, FUEGO_Z, objetos); const ac = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.36), M(0xC49A2C, { roughness: .1 })); ac.rotation.x = -Math.PI / 2; ac.position.set(0, 1.11, FUEGO_Z); objetos.add(ac); }
}
// partículas: flamas, humo y descarga (sprites → funcionan también en el visor)
const texFlama = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'); const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,220,1)'); g.addColorStop(.3, 'rgba(255,190,60,.9)'); g.addColorStop(.7, 'rgba(240,80,20,.5)'); g.addColorStop(1, 'rgba(200,30,0,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const texNube = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'); const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const flamas = [], humo = [], chorro = [];
for (let i = 0; i < 70; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: texFlama, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true })); s.visible = false; s.userData.vida = Math.random(); scene.add(s); flamas.push(s); }
for (let i = 0; i < 22; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: texNube, color: 0x37474F, depthWrite: false, transparent: true, opacity: .35 })); s.visible = false; s.userData.vida = Math.random(); scene.add(s); humo.push(s); }
for (let i = 0; i < 90; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: texNube, depthWrite: false, transparent: true, opacity: .8 })); s.visible = false; s.userData.vida = 1; scene.add(s); chorro.push(s); }
const luzFuego = new THREE.PointLight(0xff8a3d, 0, 7); scene.add(luzFuego);
const F = { activo: false, I: 0, caso: null, agente: null, carga: 1, rociando: false, desde: new THREE.Vector3(), hacia: new THREE.Vector3(), zona: '', ultimo: 0, alTerminar: null };
const centroFuego = () => new THREE.Vector3(0, CASOS[F.caso].base, FUEGO_Z);
function encender(c) { F.caso = c; F.I = 1; F.activo = true; luzFuego.position.copy(centroFuego()).add(new THREE.Vector3(0, 0.6, 0.4)); }

// ------------------------------------------------------------------ descarga (pantalla: mantener presionado; visor: gatillo)
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let modoDescarga = false;
const enMano = new THREE.Group(); camera.add(enMano); scene.add(camera);   // extintor visible en primera persona (pantalla)
function apuntar(origen, dir) {
  const c = centroFuego(), n = new THREE.Vector3(dir.x, 0, dir.z).normalize().negate(); const plano = new THREE.Plane().setFromNormalAndCoplanarPoint(n.lengthSq() ? n : new THREE.Vector3(0, 0, 1), c);
  const p = new THREE.Vector3(); if (!new THREE.Ray(origen, dir).intersectPlane(plano, p)) { F.zona = 'fuera'; return null; }
  const caso = CASOS[F.caso], dx = Math.hypot(p.x - c.x, p.z - c.z), dy = p.y - c.y;
  F.zona = dx < caso.radio * 1.1 && dy > -0.3 && dy < caso.alto * 0.35 ? 'base' : dx < caso.radio * 1.4 && dy < caso.alto * 1.3 ? 'llamas' : 'fuera'; return p;
}
// Pantalla: la MIRA marca a dónde apuntas (arrástrala con el dedo o el mouse) y la PALANCA roja se mantiene presionada
// para descargar (07/10/2026: en celular y tablet se usan dos dedos, uno apunta y otro descarga). Mouse: también basta con
// mantener presionado el botón sobre la escena. Teclado: barra espaciadora.
const mira = { x: innerWidth / 2, y: innerHeight / 2 }; let dedoPalanca = null, dedoMira = null;
function apuntaPantalla(x, y) { ptr.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1); ray.setFromCamera(ptr, camera); const o = new THREE.Vector3(); enMano.getWorldPosition(o);
  const p = apuntar(ray.ray.origin, ray.ray.direction); F.desde.copy(o); if (p) F.hacia.copy(p); else F.hacia.copy(ray.ray.origin).addScaledVector(ray.ray.direction, 4); }
function moverMira(x, y) { mira.x = Math.max(10, Math.min(innerWidth - 10, x)); mira.y = Math.max(10, Math.min(innerHeight - 10, y)); const m = $('mira'); m.style.left = mira.x + 'px'; m.style.top = mira.y + 'px'; apuntaPantalla(mira.x, mira.y); }
function miraALaBase() { const v = centroFuego().add(new THREE.Vector3(0, 0.1, 0)).project(camera); moverMira((v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight); }
function descargar(si) { F.rociando = si && modoDescarga; $('palanca').classList.toggle('on', F.rociando); if (F.rociando) apuntaPantalla(mira.x, mira.y); }
renderer.domElement.addEventListener('pointerdown', e => { if (!modoDescarga || renderer.xr.isPresenting) return; controls.enabled = false; dedoMira = e.pointerId; moverMira(e.clientX, e.clientY);
  if (e.pointerType === 'mouse') { dedoPalanca = e.pointerId; descargar(true); } });
renderer.domElement.addEventListener('pointermove', e => { if (modoDescarga && e.pointerId === dedoMira && !renderer.xr.isPresenting) moverMira(e.clientX, e.clientY); });
addEventListener('pointerup', e => { if (renderer.xr.isPresenting) return; if (e.pointerId === dedoMira) dedoMira = null; if (e.pointerId === dedoPalanca) { dedoPalanca = null; descargar(false); } });
addEventListener('pointercancel', e => { if (e.pointerId === dedoPalanca) { dedoPalanca = null; descargar(false); } if (e.pointerId === dedoMira) dedoMira = null; });
$('palanca').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); try { $('palanca').setPointerCapture(e.pointerId); } catch (x) { } dedoPalanca = e.pointerId; descargar(true); });
$('palanca').addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => { if (e.code === 'Space' && modoDescarga && !e.repeat) { e.preventDefault(); descargar(true); } });
addEventListener('keyup', e => { if (e.code === 'Space') descargar(false); });
// controles del visor
const mandos = [0, 1].map(i => { const c = renderer.xr.getController(i); scene.add(c); c.addEventListener('selectstart', () => { if (modoDescarga) { F.rociando = true; F.mando = c; } }); c.addEventListener('selectend', () => { F.rociando = false; }); return c; });
let modeloMando = null;
// panel flotante dentro del visor
const panelXR = (() => { const c = document.createElement('canvas'); c.width = 1024; c.height = 256; const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.4), new THREE.MeshBasicMaterial({ map: t, transparent: true })); m.visible = false; scene.add(m);
  return { m, pintar(txt1, txt2) { const g = c.getContext('2d'); g.clearRect(0, 0, 1024, 256); g.fillStyle = 'rgba(14,58,107,.88)'; g.fillRect(0, 0, 1024, 256); g.fillStyle = '#fff'; g.font = 'bold 54px Calibri, sans-serif'; g.textAlign = 'center';
    g.fillText(txt1, 512, 100); g.font = '44px Calibri, sans-serif'; g.fillText(txt2, 512, 185); t.needsUpdate = true; } }; })();

let tPrev = 0;
W.cuadro.push(t => {
  const dt = Math.min(0.05, t - tPrev || 0.016); tPrev = t;
  luzAlarma.intensity = F.alarma ? (Math.sin(t * 12) > 0 ? 8 : 0) : 0;
  // fuego
  const I = F.activo ? F.I : 0, caso = F.caso && CASOS[F.caso];
  luzFuego.intensity = I * (6 + Math.sin(t * 23) * 1.5 + Math.sin(t * 7) * 1);
  flamas.forEach((s, i) => { if (!caso || I <= 0.02) { s.visible = false; return; } const u = s.userData; u.vida += dt * (1.1 + (i % 5) * 0.12);
    if (u.vida > 1) { u.vida = 0; u.a = Math.random() * Math.PI * 2; u.r = Math.random() * caso.radio * Math.sqrt(I); }
    const k = u.vida, c = centroFuego(); s.visible = i < flamas.length * Math.max(0.25, I);
    s.position.set(c.x + Math.cos(u.a) * u.r * (1 - k * 0.6), c.y + k * caso.alto * (0.4 + I * 0.6), c.z + Math.sin(u.a) * u.r * (1 - k * 0.6)); s.scale.setScalar((0.45 + I * 0.35) * (1 - k * 0.7)); s.material.opacity = 1 - k; });
  humo.forEach((s, i) => { if (!caso || I <= 0.02) { s.visible = false; return; } const u = s.userData; u.vida += dt * 0.35; if (u.vida > 1) { u.vida = 0; u.x = (Math.random() - .5) * caso.radio; }
