pon('librero', -8.7, -2.0, Math.PI).then(g => g && libreros.push(g)); pon('librero', 4.6, -2.0, Math.PI).then(g => g && libreros.push(g));

const luz = new THREE.PointLight(0xff3030, 0, 30); luz.position.set(-2, 2.5, 0); scene.add(luz);     // luz estroboscópica de la alarma (4.2)

  estacionamiento: [10, 23, -15, -7], calle: [-27, -20], postes: [[-6, -18.6], [14, -18.6], [34, -18.6]],

let perfil = {}; try { perfil = JSON.parse(localStorage.getItem('campus_perfil') || '{}'); } catch (e) { }
const av = Avatar.construir(THREE, perfil); const yo = av.grupo; yo.position.set(-4.2, 0, -5.2); scene.add(yo);

]);

// ruta desde un punto del edificio a la salida y al punto de reunión

  const pts = []; if (z < -1.6) pts.push([x < -5 ? -5.3 : (x < 2.6 ? -5.3 : 2.6), -2.2], [x < -5 ? -5.3 : (x < 2.6 ? -5.3 : 2.6), 0]);

// ------------------------------------------------------------------ ciclo: caminata del avatar, cámara que sigue, alarma y sismo
let tPrev = 0, alarmaOn = false, sismo = 0, tSismo = 0;
const baseCam = new THREE.Vector3();
W.cuadro.push(t => {
  const dt = Math.min(0.05, t - tPrev || 0.016); tPrev = t; gente.actualizar(dt);
  luz.intensity = alarmaOn && Math.sin(t * 14) > 0.6 ? 30 : 0;
  if (ruta.length) { const d = ruta[0].clone().sub(yo.position); const L = d.length();
    if (L < 0.05) { ruta.shift(); if (!ruta.length) { seguir = false; if (alLlegar) { const c = alLlegar; alLlegar = null; c(); } } }
    else { d.normalize(); const paso = Math.min(L, (yo.userData.vel || 2.4) * dt); yo.position.addScaledVector(d, paso); yo.rotation.y = Math.atan2(d.x, d.z); fase += dt * 10; av.animar(fase, true);

    libreros.forEach(l => { l.rotation.z = Math.sin(tSismo * 9) * 0.02 * k; });

});
// sonidos con Web Audio: alarma (pitidos) y retumbo del sismo (ruido grave)
let audio = null, ctxA = null;
const ctx = () => ctxA || (ctxA = new (window.AudioContext || window.webkitAudioContext)());
function sirena(on) { alarmaOn = on; try { if (on && !audio) { const c = ctx(), o = c.createOscillator(), g = c.createGain(); o.type = 'square'; o.frequency.value = 880; g.gain.value = 0;
  o.connect(g); g.connect(c.destination); o.start(); audio = { o, g, i: setInterval(() => { g.gain.setTargetAtTime(g.gain.value > 0 ? 0 : 0.035, c.currentTime, 0.01); }, 500) }; }
  if (!on && audio) { clearInterval(audio.i); audio.o.stop(); audio = null; } } catch (e) { } }
let ruido = null;
function retumbo(on) { try { if (on && !ruido) { const c = ctx(), b = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = b.getChannelData(0); let v = 0; for (let i = 0; i < d.length; i++) { v = 0.985 * v + 0.015 * (Math.random() * 2 - 1); d[i] = v * 3; }
  const s = c.createBufferSource(); s.buffer = b; s.loop = true; const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 120; const g = c.createGain(); g.gain.value = 0.5; s.connect(f); f.connect(g); g.connect(c.destination); s.start(); ruido = { s, g }; }
  if (!on && ruido) { ruido.g.gain.setTargetAtTime(0, ctx().currentTime, 0.4); const r = ruido; ruido = null; setTimeout(() => r.s.stop(), 1500); } } catch (e) { } }

// ------------------------------------------------------------------ decisiones
function elegir(titulo, ops, fuente, ok) {
  W.$('mCont').innerHTML = `<h2>${titulo}</h2><div id="ops"></div><p class="ficticio">[FICTICIO – ejercicio didáctico]</p>`;
  [...ops].sort(() => Math.random() - .5).forEach(o => { const b = document.createElement('button'); b.className = 'op'; b.textContent = o.t;
    b.onclick = () => { W.$('modal').style.display = 'none'; if (o.ok) { W.bien(o.fb || 'Correcto.', fuente); ok && ok(); } else { W.mal(o.fb, fuente, !!o.critico); setTimeout(() => elegir(titulo, ops, fuente, ok), 900); } };
    W.$('ops').appendChild(b); });
  W.$('modal').style.display = 'flex'; if (location.search.includes('qa')) window.__ops = ops;
}
exterior.then(e => { tocable(e.reunion, 'reunion', 2.6); });
[sRuta, sNo, sAlt, sSalida, pRestringida, sMenor, zonaMR, sRutaP].forEach((o, i) => tocable(o, ['ruta', 'no_paso', 'alterna', 'salida', 'no_paso', 'menor', 'menor', 'ruta'][i], 0.9));

function pasosExterior(sismoCaso) {
  const arr = [];
  arr.push({ titulo: 'Sal del edificio', texto: 'Toca la <b>señal de salida de emergencia</b> y sal por ella.', fuente: `${F3}, 5.1`,
    iniciar() { irV('salida'); },
    tocar(o) { if (o.userData.tipo !== 'salida') return; W.bien('Salida de emergencia: verde, con silueta que avanza hacia la salida.', `${F3}, 5.1`);
      caminar([[5.4, yo.position.z > 0.5 ? 0.6 : 0], [6.8, 0], [10, 0]], () => W.siguiente()); } });
  if (sismoCaso) arr.push({ titulo: '¿Dónde esperas?', texto: 'Ya estás afuera. Hay varios lugares cerca: <b>toca el lugar seguro</b> para esperar.', fuente: FS,
    iniciar() { irV('exterior'); Object.values(marcas).forEach(m => { m.visible = true; m.userData.etq.visible = true; }); },
    tocar(o) { const t = o.userData.tipo || '';
      if (t === 'reunion') { Object.values(marcas).forEach(m => { m.visible = false; m.userData.etq.visible = false; });
        W.bien('El punto de reunión es la zona de menor riesgo al exterior: alejado de edificios, cables, postes, árboles o cualquier objeto que pueda caer.', FS);
        caminar([[24, 1.6], [REUNION[0] - 0.8, REUNION[1]]], () => W.siguiente()); }
      else if (t === 'lugar_fachada') W.mal('Junto al edificio pueden caer vidrios, acabados o partes de la fachada en una réplica.', FS, true);
      else if (t === 'lugar_arbol') W.mal('Un árbol puede caer o soltar ramas: el punto de reunión debe estar alejado de árboles.', FS);
      else if (t === 'lugar_poste') W.mal('Postes y cables pueden caer o electrificarse: el punto de reunión debe estar alejado de ellos.', FS, true); } });
  else arr.push({ titulo: 'Llega al punto de reunión', texto: 'Sigue las flechas verdes y toca el <b>punto de reunión</b> (círculo verde con cuatro flechas).', fuente: `${F3}, 5.1`,
    iniciar() { irV('exterior'); },
    tocar(o) { if (o.userData.tipo !== 'reunion') return; W.bien('Punto de reunión: cuatro flechas dirigidas a un punto. Está en zona abierta, lejos del edificio.', `${F3}, 5.1`);
      caminar([[24, 1.6], [REUNION[0] - 0.8, REUNION[1]]], () => W.siguiente()); } });
  arr.push({ titulo: 'Censo', texto: 'Ya estás a salvo en el punto de reunión.', fuente: `${F2}, Guía de Referencia II, II.4 j)`,
    async iniciar() { irV('reunion'); sirena(false); await listos;
      P.brig && P.brig.caminar([[REUNION[0] + 1.2, REUNION[1] - 1.4]]).then(() => { P.brig.mirarA(...REUNION); P.brig.anim('emote-yes'); });
      P.ana && P.ana.caminar([enReunion(7)]);
      elegir('Llegaste al punto de reunión. ¿Qué sigue?', [
        { t: 'Me reporto con la brigada para el censo y permanezco en el punto de reunión', ok: true, fb: 'Correcto: la brigada hace el censo para saber si falta alguien.' },
        { t: 'Me voy a mi casa', critico: true, fb: 'Si te vas sin reportarte, la brigada podría arriesgarse buscándote.' },
        { t: 'Regreso por mi celular', critico: true, fb: 'No regreses al edificio.' }], `${F2}, Guía de Referencia II, II.4 j)`, () => W.siguiente()); } });
  arr.push({ titulo: 'Regreso', texto: 'Última decisión.', fuente: `${F2}, Guía de Referencia II, II.4 k)`,
    iniciar() { elegir('¿Cuándo se regresa al edificio?', [
      { t: sismoCaso ? 'Solo cuando la brigada indique que se revisó el inmueble y ya no existe peligro' : 'Solo cuando la brigada o el coordinador indican que ya no existe peligro', ok: true, fb: sismoCaso ? 'Correcto: después del sismo se evacúa, en caso necesario, para permitir la revisión del inmueble.' : 'Correcto.' },
      { t: sismoCaso ? 'En cuanto deja de temblar' : 'Cuando deje de sonar la alarma', fb: 'El regreso lo coordina la brigada cuando ya no hay peligro.' },
      { t: 'Cuando la mayoría decida volver', fb: 'El regreso lo coordina la brigada cuando ya no hay peligro.' }], `${F2}, Guía de Referencia II, II.4 k)${sismoCaso ? '; ' + FS : ''}`, () => W.siguiente()); } });
  return arr;
}

// ---- escenario INCENDIO: evacuación total hasta el punto de reunión exterior
const pasosIncendio = () => [
  { titulo: '¡Suena la alarma!', texto: 'Alarma audible y luz estroboscópica: emergencia de incendio en el edificio.', fuente: `${F2}, 4.2 y 8.1 c)`,
    iniciar() { sirena(true); irV('oficina'); elegir('Suena la alarma de incendio. ¿Qué haces?', [
      { t: 'Suspendo lo que hago y sigo el procedimiento de evacuación y las indicaciones de la brigada', ok: true, fb: 'Correcto: la brigada da la señal de evacuación y conduce a las personas fuera del edificio.' },
      { t: 'Termino el correo que estaba escribiendo', fb: 'Cada segundo cuenta: deja lo que haces.' },
      { t: 'Regreso a mi lugar por mis cosas', fb: 'No regreses por pertenencias.' }], `${F2}, 8.1 e) y Guía de Referencia II, II.4 c) y h)`, () => { evacuarCompaneros(true, 3500); W.siguiente(); }); } },
  { titulo: 'Elige por dónde salir', texto: 'Toca la señal que te indica la <b>ruta de evacuación</b>.', fuente: `${F3}, 5.1 · NOM-026-STPS-2008, A.3`,
    iniciar() { irV('oficina'); },
    tocar(o) { const t = o.userData.tipo; if (t === 'ruta') { W.bien('La señal verde con flecha indica la ruta de evacuación.', `${F3}, 5.1`); caminar([[-5.3, -5.0], [-5.3, -2.2], [-5.3, -0.2], [0.5, -0.2]], () => W.siguiente()); }
      else if (t === 'no_paso') W.mal('Esa puerta dice "Prohibido el paso": no es salida.', 'NOM-026-STPS-2008, Apéndice A, A.3'); } },
  { titulo: 'La ruta está obstruida', texto: 'Hay cajas bloqueando el pasillo hacia la salida.', fuente: `${F2}, Guía de Referencia II, II.4 i) y 6.8`,
    iniciar() { irV('edificio'); elegir('El pasillo está bloqueado con cajas. La brigadista te señala otra ruta. ¿Qué haces?', [
      { t: 'Sigo la ruta alterna que indica la brigada', ok: true, fb: 'Correcto. Y recuerda: las rutas nunca deben bloquearse.' },
      { t: 'Me pongo a mover las cajas en plena emergencia', fb: 'Pierdes tiempo y puedes lesionarte: usa la ruta alterna.' },
      { t: 'Me quedo a esperar a que alguien las quite', critico: true, fb: 'Quedarte en el edificio en emergencia te pone en riesgo.' }], `${F2}, Guía de Referencia II, II.4 i); 6.8 no bloquear rutas`, () => caminar([[0.3, 0], [0.3, 2.8], [4.5, 2.8], [4.5, 0.9]], () => W.siguiente())); } },
  { titulo: 'Una compañera necesita apoyo', texto: 'Ana usa silla de ruedas y sigue en el pasillo.', fuente: `${F2}, 8.1 e)`,
    async iniciar() { irV('edificio'); await listos; elegir('Ana usa silla de ruedas y no puede pasar por las cajas. ¿Qué haces?', [
      { t: 'Aviso a la brigada para que la acompañe por la ruta accesible, como prevé el plan de emergencia', ok: true, fb: 'Correcto: la evacuación debe considerar a las personas con discapacidad.' },
      { t: 'La dejo: la brigada la verá después', critico: true, fb: 'Nadie debe quedarse atrás: avisa a la brigada de inmediato.' },
      { t: 'Intento cargarla yo solo con todo y silla', fb: 'Sin entrenamiento puedes lastimarla o lastimarte: apóyate en la brigada.' }], `${F2}, 8.1 e) evacuación considerando a personas con discapacidad`, () => {
        P.brig && P.brig.caminar([[-3.8, 0.3]]).then(() => { P.brig.caminar([[0.3, 0.3], [0.3, 2.8], [4.5, 2.8], [4.5, 0.4], [6.8, 0.4], ...RUTA_EXT.slice(1), enReunion(8)]); });
        P.ana && setTimeout(() => P.ana.caminar([[0.3, 0.6], [0.3, 2.8], [4.5, 2.8], [4.5, 0.6], [6.8, 0.6], ...RUTA_EXT.slice(1), enReunion(7)], { vel: 1.3 }), 1600);
        W.siguiente(); }); } },
  ...pasosExterior(false),
];

// ---- escenario SISMO: repliegue en la zona de menor riesgo y, al terminar, evacuación para revisar el inmueble
const pasosSismo = () => [
  { titulo: '¡Está temblando!', texto: 'Se siente un sismo fuerte <b>sin que haya sonado la alerta sísmica</b>.', fuente: FS,
    iniciar() { cajas.visible = false; irV('oficina'); sismo = 1; tSismo = 0; retumbo(true);
      listos.then(() => COMP.forEach(id => P[id] && P[id].anim('crouch')));
      elegir('Se percibe un sismo y no sonó la alerta sísmica. ¿Qué haces?', [
        { t: 'Me repliego: voy a la zona de menor riesgo del interior y permanezco ahí hasta que el sismo termine', ok: true, fb: 'Correcto: cuando se percibe el sismo sin alerta, se hace repliegue a la zona de menor riesgo.' },
        { t: 'Corro hacia la salida empujando a los demás', critico: true, fb: 'Sin alerta no hay tiempo de salir con seguridad: correr en pleno movimiento provoca caídas y lesiones. Repliégate.' },
        { t: 'Me quedo junto a la ventana para ver qué pasa', critico: true, fb: 'Los vidrios pueden romperse y caer: aléjate de ellos.' }], FS, () => W.siguiente()); } },
  { titulo: 'Zona de menor riesgo', texto: 'Toca el lugar al que te replegarías dentro de la oficina.', fuente: `${F3}, 4.30 y 5.1; ${FS}`,
    iniciar() { irV('oficina'); },
    tocar(o) { const t = o.userData.tipo;
      if (t === 'menor') { W.bien('Zona de menor riesgo: junto a columnas y trabes, lejos de vidrios y de muebles que puedan caer.', `${F3}, 4.30; ${FS}`);
        caminar([[-3.4, -2.9]], () => { listos.then(() => COMP.slice(0, 4).forEach((id, i) => P[id] && P[id].caminar([[-3.9 + i * 0.5, -3.3 - (i % 2) * 0.3]]).then(() => P[id].anim('crouch')))); W.siguiente(); }); }
      else if (t === 'ventana') W.mal('Junto a las ventanas los vidrios pueden romperse y caer.', FS, true);
      else if (t === 'librero') W.mal('Un librero alto puede volcarse o tirar objetos: aléjate de muebles altos.', FS);
      else if (t === 'salida' || t === 'ruta') W.mal('Mientras tiembla no corras a la salida: primero repliégate.', FS); } },
  { titulo: 'Espera a que termine', texto: 'El movimiento continúa unos segundos más…', fuente: FS, sinPuntos: true,
    iniciar() { setTimeout(() => { sismo = 0.4; }, 2500); setTimeout(() => { sismo = 0; retumbo(false); W.aviso('<h2>El sismo terminó</h2><p>La brigada revisa la situación y da la indicación de <b>evacuar</b> el inmueble por la ruta de evacuación hacia el punto de reunión, para que se pueda revisar el edificio.</p>', () => W.siguiente(), 'Continuar'); }, 5000); } },
  { titulo: 'Después del sismo', texto: 'La brigada indica evacuar.', fuente: FS,
    iniciar() { listos.then(() => COMP.forEach(id => P[id] && P[id].anim('idle')));
      elegir('Terminó el sismo y la brigada indica evacuar. ¿Por qué se evacúa?', [
        { t: 'Para permitir la revisión del inmueble antes de volver a ocuparlo', ok: true, fb: 'Correcto: después del sismo, en caso de ser necesario, se evacúa para permitir la revisión del inmueble.' },
        { t: 'No hace falta salir: ya dejó de temblar', fb: 'El edificio pudo dañarse: sigue la indicación de la brigada y evacúa para que se revise.' },
        { t: 'Para irme a mi casa en cuanto salga', critico: true, fb: 'Debes llegar al punto de reunión y reportarte con la brigada.' }], FS, () => { evacuarCompaneros(false, 600); caminar([[-3.4, -0.2], [0.5, -0.2]], () => W.siguiente()); }); } },
  { titulo: 'Ayuda en la evacuación', texto: 'Ana usa silla de ruedas.', fuente: `${F2}, 8.1 e)`,
    async iniciar() { irV('edificio'); await listos; elegir('Ana usa silla de ruedas. ¿Qué haces?', [
      { t: 'Aviso a la brigada para que la acompañe por la ruta accesible, como prevé el plan de emergencia', ok: true, fb: 'Correcto: la evacuación debe considerar a las personas con discapacidad.' },
      { t: 'Me voy sin avisar: alguien más la ayudará', critico: true, fb: 'Nadie debe quedarse atrás: avisa a la brigada.' }], `${F2}, 8.1 e)`, () => {
        P.brig && P.brig.caminar([[-3.8, 0.3]]).then(() => P.brig.caminar([[5.4, 0.3], [6.8, 0.3], ...RUTA_EXT.slice(1), enReunion(8)]));
        P.ana && setTimeout(() => P.ana.caminar([[5.4, 0.6], [6.8, 0.6], ...RUTA_EXT.slice(1), enReunion(7)], { vel: 1.3 }), 1600);
        W.siguiente(); }); } },
  ...pasosExterior(true),
];

const reinicio = () => { yo.position.set(-4.2, 0, -5.2); ruta = []; sismo = 0; cajas.visible = true; };
W.inicio([
  { id: 'incendio', txt: '🔥 <b>Incendio:</b> evacuación total del edificio hasta el punto de reunión (ruta obstruida y una compañera en silla de ruedas)' },
  { id: 'sismo', txt: '🌎 <b>Sismo sin alerta:</b> repliegue en la zona de menor riesgo y, al terminar, evacuación para revisar el inmueble' }],
  id => { reinicio(); return id === 'sismo' ? pasosSismo() : pasosIncendio(); },
  'Basado en la NOM-002-STPS-2010 (8.1 y Guía de Referencia II), la NOM-003-SEGOB-2011 (4.30 y 5.1), la NOM-026-STPS-2008 y el tríptico de evacuación y repliegue en caso de sismos de la SGIRPC CDMX (2022). Edificio y personas ficticios. Modelos 3D: Kenney (CC0).');
exterior.then(e => W.activarXR({ inicio: [-4.2, -4.6], piso: e.pasto, entorno: [] }));
if (location.search.includes('qa')) window.__qa = { W, tocar: W.tocar, estado: W.qa, obj: { sRuta, sNo, sAlt, sSalida, sMenor, zonaMR, marcas, vidrios }, yo, P, exterior, libreros };
</script>
