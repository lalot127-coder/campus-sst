<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Simulador · Construye un entorno favorable (NOM-035)</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script src="../../../motor/motor.js"></script>
<script src="../comun.js"></script>
<script src="../nom035_comun.js"></script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Fuentes verificadas (02_fuentes_verificadas/registro_fuentes.md, consulta 05/10/2026)
const N = 'NOM-035-STPS-2018';
const W = MotorSim.crearMundo(THREE, OrbitControls, { titulo: 'Construye un entorno favorable', icono: '🌱',
  clave: 'laboral_nom035_entorno', criterio: { pct: 80, sinCriticos: true }, fondo: 0xE6EEEC,
  vistas: [[[0, 1.8, 2.4], [0, 1.1, -2.6]], [[-1.2, 1.7, 0.6], [-3.0, 1.1, -2.2]], [[1.2, 1.7, 0.6], [3.0, 1.1, -2.2]]] });
const { caja, cil, scene } = W;
const { persona } = window.Laboral;
const { sala, globo, situacion, decide, tocaYDecide, tocaYPregunta, con, PALETA } = window.Nom035;

// ------------------------------------------------------------------ Sala de juntas de Grupo Altiplano [FICTICIO]
const { piso, entorno } = sala(W, { rotulo: 'SALA DE JUNTAS · ¿QUÉ NOS HACE BIEN AQUÍ?', piso: 0xD7CCC8 });
W.activarXR({ inicio: [0, 0.8], piso, entorno });
cil(1.2, 0.05, 0xA1887F, 0, 0.74, -2.0); cil(0.12, 0.72, 0x6D4C41, 0, 0.36, -2.0);   // mesa redonda
[[-1.4, -1.3, Math.PI / 2.4], [1.4, -1.3, -Math.PI / 2.4], [-0.9, -3.2, Math.PI / 6], [0.9, -3.2, -Math.PI / 6]]
  .forEach(([x, z, ry], i) => persona(W, { x, z, ry, ropa: [0x00796B, 0x5E35B1, 0xF57C00, 0x0288D1][i] }));
// tablero de la política y buzón
caja(1.8, 1.1, 0.05, 0xFFFFFF, 0, 1.75, -5.9); globo(W, '📜 Política de prevención', 0, 2.5, -5.85, PALETA.petroleo, '#fff', 1.8);
caja(0.35, 0.45, 0.25, 0x1F5F6B, 3.9, 1.1, -3.2); globo(W, '📮 Buzón', 3.9, 1.55, -3.1, '#E3EFE6', '#16323F', 0.7);
// seis estaciones del entorno organizacional favorable (7.3), en arco
const EST = [
  ['pertenencia', '🤝', 'Pertenencia', -3.6, -1.0], ['formacion', '🎓', 'Formación', -3.4, -3.4], ['responsab', '🗂️', 'Responsabilidades', -1.8, -4.8],
  ['comunica', '💬', 'Comunicación', 1.8, -4.8], ['cargas', '⚖️', 'Cargas y jornadas', 3.4, -4.6], ['reconoce', '🏅', 'Reconocimiento', 3.6, -1.0]];
const S = {};
EST.forEach(([k, ic, n, x, z]) => { caja(0.5, 0.9, 0.5, 0xE3EFE6, x, 0.45, z); S[k] = situacion(W, { x, z, y: 1.35, tipo: k, icono: ic, etiqueta: n, color: PALETA.salvia }); S[k].rot.visible = true; });
S.politica = situacion(W, { x: 0, z: -5.6, y: 1.75, tipo: 'politica', icono: '📜' });
S.buzon = situacion(W, { x: 3.9, z: -2.8, y: 2.0, tipo: 'buzon', icono: '📮' });

const intro = html => ({ titulo: 'Inicio', texto: 'Lee la situación.', sinPuntos: true,
  iniciar() { W.aviso(html + '<p class="ficticio">[FICTICIO – ejercicio didáctico] Grupo Altiplano · 80 personas trabajadoras.</p>', () => W.siguiente(), 'Comenzar'); } });
const est = (k, pregunta, ops, fuente) => tocaYDecide(EST.find(e => e[0] === k)[2], `Toca la estación <b>${EST.find(e => e[0] === k)[2]}</b>.`, S[k].marco, k, pregunta, ops, fuente);

const CASOS = {
  jef: () => con(W, [intro('<h2>🧑‍💼 Rol: director(a)</h2><p>Los resultados de la Guía III salieron en nivel <b>medio</b>. Hoy reúnes a tu equipo para construir un entorno organizacional favorable. Cada estación es un elemento del entorno (7.3).</p>'),
    tocaYPregunta('La política', 'Toca el <b>tablero de la política</b>.', S.politica.marco, 'politica',
      '¿Qué debe contemplar la política de prevención? (elige las 3)', ['Prevenir los factores de riesgo psicosocial', 'Prevenir la violencia laboral',
        'Promover un entorno organizacional favorable', 'Aumentar las ventas', 'Vigilar las redes sociales del personal'], [0, 1, 2], `${N}, 5.1`, true,
      'Los 3 ejes: factores de riesgo, violencia laboral y entorno favorable; por escrito, implantada y difundida.'),
    decide('Difundir', 'Ya está escrita la política.', [
      { t: 'Difundirla con folletos, boletines o carteles', ok: true, fb: 'Así puede acreditarse la difusión.', f: `${N}, 10.2 (5.1 y 5.7)` },
      { t: 'Guardarla en un cajón para la inspección', ok: false, fb: 'Debe implantarse y difundirse.', f: `${N}, 5.1` },
    ], `${N}, 5.1`),
    est('pertenencia', '¿Qué acción promueve el sentido de pertenencia?', [
      { t: 'Reuniones donde todos puedan exponer dudas, inquietudes y quejas', ok: true, fb: 'Acción de pertenencia y participación (ejemplo de la Guía IV).', f: `${N}, 8.1 c) y Guía IV` },
      { t: 'Que solo opinen los directivos', ok: false, fb: 'Todos los trabajadores son importantes para el centro de trabajo.', f: `${N}, Guía IV, principio 2` },
    ], `${N}, 8.1 c)`),
    est('formacion', '¿Qué pide la norma sobre capacitación?', [
      { t: 'Analizar la relación capacitación-tareas y detectar necesidades al menos cada 2 años', ok: true, fb: 'Acciones de capacitación y adiestramiento.', f: `${N}, 8.2 i)` },
      { t: 'Capacitar solo cuando haya inspección', ok: false, fb: 'La formación para las tareas es parte del entorno favorable.', f: `${N}, 7.3 b)` },
    ], `${N}, 8.2 i)`),
    est('responsab', '¿Cómo se definen las responsabilidades?', [
      { t: 'Con instructivos o procedimientos que definan claramente tareas y responsabilidades', ok: true, fb: 'Definición precisa de responsabilidades.', f: `${N}, 8.2 b) 3)` },
      { t: 'Que cada quien adivine', ok: false, fb: 'La falta de claridad de funciones es liderazgo negativo.', f: `${N}, 7.2 f) 1)` },
    ], `${N}, 8.2 b) 3)`),
    est('comunica', '¿Qué promueve la comunicación?', [
      { t: 'Comunicación directa y frecuente, difundir los cambios y escuchar opiniones', ok: true, fb: 'Información y comunicación con los trabajadores.', f: `${N}, 8.2 h)` },
      { t: 'Avisar los cambios cuando ya pasaron', ok: false, fb: 'Los cambios deben difundirse entre los trabajadores.', f: `${N}, 8.2 h) 2)` },
    ], `${N}, 8.2 h)`),
    est('cargas', '¿Qué haces con las cargas y jornadas?', [
      { t: 'Distribuir la carga de forma equitativa, planear pausas y jornadas conforme a la LFT', ok: true, fb: 'Cargas de trabajo y jornadas regulares.', f: `${N}, 8.1 c) y 8.2 b)` },
      { t: 'Premiar a quien se quede hasta la noche', ok: false, fb: 'Fomenta jornadas superiores a la LFT, un factor de riesgo.', f: `${N}, 7.2 d) y 8.2 e) 2)` },
    ], `${N}, 8.2 b)`),
    est('reconoce', '¿Qué mecanismo de reconocimiento pide la norma?', [
      { t: 'Reconocer el desempeño sobresaliente, difundir logros y expresar posibilidades de desarrollo', ok: true, fb: 'Reconocimiento en el trabajo.', f: `${N}, 8.2 f)` },
      { t: 'Nunca felicitar para que no se confíen', ok: false, fb: 'El escaso reconocimiento es parte del liderazgo negativo.', f: `${N}, 7.2 f) 1)` },
    ], `${N}, 8.2 f)`),
    tocaYDecide('El buzón', 'Toca el <b>buzón</b>.', S.buzon.marco, 'buzon', '¿Cómo debe ser el mecanismo de quejas?', [
      { t: 'Seguro y confidencial, con procedimiento de atención y seguimiento', ok: true, fb: 'Mecanismo seguro y confidencial + procedimiento.', f: `${N}, 8.1 b) y 8.2 g) 2)` },
      { t: 'Que las quejas se lean en voz alta en la junta', ok: false, crit: true, fb: 'Debe ser confidencial.', f: `${N}, 8.1 b)` },
    ], `${N}, 8.1 b)`),
    { titulo: 'El programa', texto: 'Arma tu programa de intervención.', fuente: `${N}, 8.4`, iniciar() {
      W.pregunta('¿Qué debe contener el programa? (elige todo lo que aplica)', ['Áreas o trabajadores sujetos al programa', 'Tipo de acciones y medidas de control',
        'Fechas programadas', 'Control de avances', 'Evaluación posterior de las medidas', 'Responsable de su ejecución', 'Nombres de quienes presentaron quejas'],
      [0, 1, 2, 3, 4, 5], `${N}, 8.4`, () => W.siguiente(), true, 'Seis contenidos; nunca se exhibe a quien se queja.'); } }]),
  tra: () => con(W, [intro('<h2>👷 Rol: trabajador(a)</h2><p>Tu empresa está construyendo un entorno organizacional favorable. ¿Qué te toca a ti y cómo participas?</p>'),
    tocaYDecide('La política', 'Toca el <b>tablero de la política</b>.', S.politica.marco, 'politica', '¿Qué debe darte a conocer tu centro de trabajo?', [
      { t: 'La política, las medidas, cómo quejarte, los resultados de la evaluación y los posibles efectos en la salud', ok: true, fb: 'Es obligación del patrón difundirlo.', f: `${N}, 5.7` },
      { t: 'Nada: es asunto de los jefes', ok: false, fb: 'Tienes derecho a esa información.', f: `${N}, 5.7` },
    ], `${N}, 5.7`),
    est('comunica', '¿Cómo participas en la comunicación?', [
      { t: 'Expreso mis opiniones sobre cómo resolver problemas o mejorar mis condiciones de trabajo', ok: true, fb: 'La norma promueve que puedas expresarlas.', f: `${N}, 8.2 h) 3)` },
      { t: 'Me quedo callado aunque vea un problema', ok: false, fb: 'Tu opinión cuenta para mejorar.', f: `${N}, 8.2 h) 3)` },
    ], `${N}, 8.2 h)`),
    est('formacion', '¿Qué puedes hacer sobre tu capacitación?', [
      { t: 'Señalar mis necesidades de capacitación conforme a mis actividades', ok: true, fb: 'La norma pide darte esa oportunidad.', f: `${N}, 8.2 i) 2)` },
      { t: 'Esperar a que adivinen qué necesito', ok: false, fb: 'Puedes y debes señalarlas.', f: `${N}, 8.2 i) 2)` },
    ], `${N}, 8.2 i)`),
    est('pertenencia', 'Un compañero nuevo no conoce a nadie y le cuesta un procedimiento.', [
      { t: 'Le ayudo y comparto lo que sé: eso es apoyo social', ok: true, fb: 'Ayuda mutua e intercambio de conocimientos.', f: `${N}, 4.2 y 8.2 d) 3)` },
      { t: 'Lo dejo solo para que aprenda a la mala', ok: false, fb: 'Las relaciones negativas y la falta de apoyo son un factor de riesgo.', f: `${N}, 7.2 f) 2)` },
    ], `${N}, 8.2 d)`),
    est('cargas', 'Tu área tiene pausas programadas en una tarea repetitiva.', [
      { t: 'Las respeto: evitan ritmos de trabajo acelerados', ok: true, fb: 'Las pausas son una medida de prevención.', f: `${N}, 8.2 b) 2) y 6.1` },
      { t: 'Me las salto para terminar antes', ok: false, fb: 'Debes observar las medidas de prevención.', f: `${N}, 6.1` },
    ], `${N}, 6.1`),
    decide('Una práctica opuesta', 'En la comida, unos compañeros proponen excluir siempre al nuevo.', [
      { t: 'No participo y lo invito a integrarse', ok: true, fb: 'Abstente de prácticas contrarias al entorno favorable.', f: `${N}, 6.2` },
      { t: 'Me uno: así son las cosas aquí', ok: false, crit: true, fb: 'Es una práctica contraria al entorno favorable.', f: `${N}, 6.2` },
    ], `${N}, 6.2`),
    decide('Los eventos de información', 'La empresa organiza una plática sobre la NOM-035.', [
      { t: 'Asisto y participo', ok: true, fb: 'Participar en los eventos de información es tu obligación.', f: `${N}, 6.6` },
      { t: 'No voy: no me interesa', ok: false, fb: 'Es una obligación de los trabajadores.', f: `${N}, 6.6` },
    ], `${N}, 6.6`),
    tocaYDecide('El buzón', 'Toca el <b>buzón</b>.', S.buzon.marco, 'buzon', '¿Para qué lo usas?', [
      { t: 'Para informar prácticas opuestas al entorno favorable y denunciar violencia laboral', ok: true, fb: 'Es uno de los mecanismos para cumplir tu obligación de informar.', f: `${N}, 6.4` },
      { t: 'Para pedir aumento de sueldo', ok: false, fb: 'Su objetivo son las quejas y denuncias de la NOM-035.', f: `${N}, 8.1 b)` },
    ], `${N}, 6.4`)]),
};

W.inicio([{ id: 'tra', txt: '👷 <b>Rol 1:</b> Trabajador(a) — participa' }, { id: 'jef', txt: '🧑‍💼 <b>Rol 2:</b> Director(a) — construye' }],
  id => CASOS[id](),
  'Basado en: NOM-035-STPS-2018 (DOF 23/10/2018) numerales 4.2, 5.1, 5.7, 6.1-6.6, 7.2, 7.3, 8.1, 8.2, 8.4, 10.2 y Guía de referencia IV. Empresa y personas ficticias. 🥽 En visor: botón VR.');

if (location.search.includes('qa')) window.__qa = { S: Object.fromEntries(Object.entries(S).map(([k, v]) => [k, v.marco])), tocar: W.tocar, estado: W.qa, xr: () => W.xr };
</script>
</body>
</html>
