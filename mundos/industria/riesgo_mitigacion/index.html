<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Simulador · Mitigación: jerarquía de controles</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script src="../../../motor/motor.js"></script>
<script src="../../riesgo/comun.js"></script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Fuentes verificadas (02_fuentes_verificadas/registro_fuentes.md, consulta 05/10/2026)
const NIOSH = 'NIOSH, Hierarchy of Controls (10/04/2024), referencia no obligatoria';
const N17 = 'NOM-017-STPS-2024', N10 = 'NOM-010-STPS-2014', N33 = 'NOM-033-STPS-2015', RF = 'RFSST (DOF 13/11/2014)';
const W = MotorSim.crearMundo(THREE, OrbitControls, { titulo: 'Mitigación: jerarquía de controles', icono: '🛡️',
  clave: 'industria_riesgo_mitigacion', criterio: { pct: 80, sinCriticos: true }, fondo: 0xEDEFF2,
  vistas: [[[0, 3.4, 4.2], [0, 0.9, -1]], [[0, 16, 4], [0, 0, -6]], [[-7, 2.4, -2], [-4, 1, -8]], [[7, 2.4, -2], [4, 1, -8]]] });
const { scene, letrero, caja } = W;
const { sala, prop, persona, situacion, decidir, intro, PALETA } = window.Riesgo;

const { piso, entorno, z0 } = sala(W, { ancho: 20, fondo: 16, rotulo: 'PLANTA · PROGRAMA DE CONTROL DE RIESGOS' });
W.activarXR({ inicio: [0, 0.6], piso, entorno });
// recorrido a pie (12/10/2026): toca el piso para caminar; el avatar rodea muebles y personas
setTimeout(() => W.recorrido({ piso, limites: { x0: -10, x1: 10, z0: -14, z1: 2.4 }, obstaculos: OBST, muros: entorno.filter(m => m.geometry && m.geometry.type === 'BoxGeometry' && m.geometry.parameters.height > 1), inicio: [0, 0.9] }), 300);
// Pirámide invertida de la jerarquía en la pared del fondo
['1 ELIMINACIÓN', '2 SUSTITUCIÓN', '3 INGENIERÍA', '4 ADMINISTRATIVOS', '5 EPP'].forEach((t, i) => {
  const col = ['#2E7D32', '#1F6F8B', '#C2410C', '#F2A900', '#B03A2E'][i];
  const l = letrero(t, 3.2 - i * 0.45, 0.3, col); l.position.set(0, 2.25 - i * 0.34, z0 + 0.08); scene.add(l); });

const RIESGOS = [
  { id: 'prensa', prop: 'prensa', x: -7.6, z: -7.92, icono: '⚙️', et: 'Atrapamiento en prensa', per: { x: -7.6, z: -6.16, ry: Math.PI },
    txt: 'Los operadores alimentan la prensa con la mano y ya hubo dos atrapamientos. [FICTICIO]',
    q1: [{ t: 'Guarda fija y mando bimanual para que las manos no entren a la zona de peligro', ok: true, fb: 'Control de ingeniería: aísla a la persona del peligro. (Si se pudiera automatizar la alimentación, sería aún mejor.)', f: `${NIOSH}; NOM-004-STPS-1999, 5.3` },
          { t: 'Pedirles que tengan más cuidado', ok: false, fb: 'Depende solo de la conducta: es el control menos confiable.', f: NIOSH },
          { t: 'Solo guantes', ok: false, fb: 'El EPP no evita el atrapamiento: es transitorio o complementario.', f: `${N17}, 5.2` }],
    q2: [{ t: 'Procedimiento de bloqueo de energía antes del mantenimiento', ok: true, fb: 'Control administrativo que complementa la guarda.', f: 'NOM-029-STPS-2011, 7.1; NOM-004-STPS-1999, 5.3 a)' },
         { t: 'Quitar la guarda para limpiar con la máquina encendida', ok: false, crit: true, fb: 'Expone directamente al trabajador: condición insegura grave.', f: `${RF} art. 3 fr. V y XXVI` }],
    p2: 'Además de la guarda, ¿qué control administrativo agregas?' },
  { id: 'solvente', prop: 'tambo', x: -2.6, z: -10.12, icono: '🧪', et: 'Vapores de solvente', per: { x: -2.6, z: -8.36, ry: Math.PI, pose: 'agachado' },
    txt: 'Se desengrasan piezas con un solvente tóxico en una tina abierta; el trabajador refiere mareo. [FICTICIO]',
    q1: [{ t: 'Sustituir el solvente por otro cuyos efectos sean menos nocivos', ok: true, fb: 'Sustitución: está por encima de la ventilación y del EPP.', f: `${N10}, 11.3 h)` },
         { t: 'Respirador para el trabajador y seguir igual', ok: false, fb: 'El EPP solo es transitorio o complementario.', f: `${N17}, 5.2 a)` },
         { t: 'Abrir una ventana de vez en cuando', ok: false, fb: 'No controla la exposición de forma confiable.', f: `${N10}, 11.3` }],
    q2: [{ t: 'Como medida transitoria mientras se instala la extracción localizada', ok: true, fb: 'Así lo indica la NOM-017-STPS-2024.', f: `${N17}, 5.2 a)` },
         { t: 'Como solución definitiva en lugar de cualquier otra medida', ok: false, fb: 'El EPP no sustituye a las demás medidas.', f: `${N17}, 5.2` }],
    p2: 'Mientras llega el nuevo solvente, ¿en qué papel se usa el respirador?' },
  { id: 'cisterna', prop: 'tanque', x: 2.6, z: -10.12, icono: '🕳️', et: 'Inspección de cisterna',
    txt: 'Hay que revisar el interior de una cisterna cada mes. [FICTICIO]',
    q1: [{ t: 'Inspeccionarla con una cámara desde el exterior para no entrar', ok: true, fb: 'Eliminación: el trabajo en espacios confinados debe evitarse preferentemente.', f: `${N33}, 7.1` },
         { t: 'Entrar con arnés porque "siempre se ha hecho así"', ok: false, fb: 'Solo se entra si la actividad no se puede hacer desde el exterior.', f: `${N33}, 7.1` },
         { t: 'Entrar sin análisis porque es rápido', ok: false, crit: true, fb: 'Se requiere análisis de riesgos previo al acceso.', f: `${N33}, 5.2` }],
    q2: [{ t: 'Clasificar el espacio, análisis de riesgos, autorización por escrito, vigía y plan de rescate', ok: true, fb: 'Son requisitos de la norma cuando sí se debe entrar.', f: `${N33}, 5.2, cap. 8 y 10` },
         { t: 'Nada más un casco', ok: false, crit: true, fb: 'Faltan análisis, autorización, muestreo y rescate.', f: `${N33}, 5.2 y cap. 8` }],
    p2: 'Si un día sí es indispensable entrar, ¿qué se necesita?' },
  { id: 'ruido', prop: 'compresora', x: 7.6, z: -7.92, icono: '🔊', et: 'Ruido de compresora', per: { x: 6.0, z: -6.6, ry: -Math.PI / 2 },
    txt: 'La compresora está junto a los puestos de ensamble y se escucha muy fuerte todo el turno. [FICTICIO]',
    q1: [{ t: 'Reubicar o encapsular la compresora para alejar el ruido de los puestos', ok: true, fb: 'Control de ingeniería: actúa en la fuente y en la trayectoria.', f: `${NIOSH}; ${RF} art. 33 fr. V` },
         { t: 'Solo tapones auditivos', ok: false, fb: 'El EPP es el último recurso, complementario a otras medidas.', f: `${RF} art. 33 fr. VI; ${N17}, 5.2` },
         { t: 'Subir el volumen del radio', ok: false, fb: 'Aumenta la exposición.', f: `${RF} art. 33` }],
    q2: [{ t: 'Hacer el reconocimiento y la evaluación del ruido conforme a la norma de la materia', ok: true, fb: 'El RFSST exige reconocer y evaluar el ruido donde hay personal expuesto.', f: `${RF} art. 33 fr. II y IV` },
         { t: 'Adivinar el nivel de ruido', ok: false, fb: 'La evaluación se hace con método y equipo.', f: `${RF} art. 33 fr. IV` }],
    p2: '¿Cómo sabes si el control funcionó?' },
];
const S = {};

// ambientación (no inspeccionable) para dar profundidad al taller: anaqueles, bancos y cajas junto a los muros
const DECOR = [['anaquel', -9.2, -6, Math.PI / 2], ['anaquel', -9.2, -9.5, Math.PI / 2], ['cajas', 9.0, -9.8, -Math.PI / 2], ['mesa', 8.6, -6.2, -Math.PI / 2], ['basurero', -8.8, -2.2, 0], ['lampara', 0, -13.6, 0], ['senal_salida', -9.6, -12.4, Math.PI / 2], ['reloj', 5, -13.8, 0]];
const OBST = [];
DECOR.forEach(([k, x, z, ry]) => OBST.push(prop(W, k, x, z, ry)));
RIESGOS.forEach(r => { OBST.push(prop(W, r.prop, r.x, r.z)); if (r.per) OBST.push(persona(W, { ropa: 0x1565C0, casco: 0xF2C94C, ...r.per }).g);
  S[r.id] = situacion(W, { x: r.x, z: r.z + 0.6, y: 1.95, tipo: r.id, icono: r.icono, etiqueta: r.et }); });

function pasoRiesgo(r) {
  return { titulo: r.et, texto: `Toca el riesgo que brilla: <b>${r.et}</b>.`, fuente: r.q1[0].f, puntos: 20,
    iniciar() { W.resaltar([S[r.id].marco]); },
    tocar(o) { if (o.userData.tipo !== r.id || this._h) return; this._h = true; W.resaltar([]); if (S[r.id].rot) S[r.id].rot.visible = true;
      decidir(W, '¿Cuál es la medida MÁS efectiva que puedes aplicar?', r.q1, () => {
        setTimeout(() => decidir(W, r.p2, r.q2, () => { S[r.id].marco.material.color.set(0x2E7D32); W.siguiente(); }, r.txt), 600);
      }, r.txt); } };
}
const cierre = { titulo: 'El orden correcto', texto: 'Última pregunta.', fuente: NIOSH,
  iniciar() { decidir(W, '¿Cuál es el orden de la jerarquía de controles, del más al menos efectivo?', [
    { t: 'Eliminación → sustitución → ingeniería → administrativos → EPP', ok: true, fb: 'Y el EPP, transitorio o complementario.', f: `${NIOSH}; ${N17}, 5.2` },
    { t: 'EPP → administrativos → ingeniería → sustitución → eliminación', ok: false, fb: 'Es al revés: el EPP es el último recurso.', f: NIOSH },
    { t: 'Administrativos → EPP → eliminación', ok: false, fb: 'Primero se intenta quitar o sustituir el peligro.', f: NIOSH },
  ], () => W.siguiente()); } };

W.inicio([{ id: 'todo', txt: '🛡️ <b>Programa completo:</b> 4 riesgos de la planta' }, { id: 'dos', txt: '⚡ <b>Práctica rápida:</b> 2 riesgos' }],
  id => [intro(W, '<h2>🛡️ Del análisis a la acción</h2><p>El análisis de riesgos de la planta ya está hecho. Ahora te toca proponer las <b>medidas de control</b>: primero la más efectiva posible y, solo al final, el equipo de protección personal.</p><p><b>Jerarquía:</b> eliminación → sustitución → ingeniería → administrativos → EPP (NIOSH, referencia). En México, el EPP es transitorio o complementario (NOM-017-STPS-2024, 5.2).</p>',
    'Planta de Metalmecánica del Centro.'), ...(id === 'todo' ? RIESGOS : RIESGOS.slice(0, 2)).map(pasoRiesgo), cierre],
  'Basado en: jerarquía de controles NIOSH (referencia); NOM-017-STPS-2024 5.2; NOM-010-STPS-2014 11.3; NOM-033-STPS-2015 5.2, 7.1 y caps. 8 y 10; NOM-004-STPS-1999 5.3; NOM-029-STPS-2011 7.1; RFSST art. 3 y 33. Empresa ficticia. 🥽 En visor: botón VR.');

if (location.search.includes('qa')) window.__qa = { S: Object.fromEntries(Object.entries(S).map(([k, v]) => [k, v.marco])), RIESGOS, tocar: W.tocar, estado: W.qa };
</script>
</body>
</html>
